{"id":"i-science-03","lv":1,"theme":"science","q":"Do you watch science videos online?","qja":"ネットで科学の動画を見ますか?","hint":"はい、寝る前によく見る","model":"Yes, I often watch them before bed.","alts":["Yes, I often watch them before I go to sleep.","I do, usually before bed."],"keys":[["bed","sleep"],["before"]],"loose":["yes","no","often","watch*","videos","sometimes","before","bed","weekend*","channel*","every","night"],"opts":{"o":["Yes, I often watch them before the bed.","Yes, I often watch them before bed.","Yes, I watch often them before sleeping."],"a":1},"para":["All the time, right before bed.","Yeah, they're my bedtime routine."],"tip":"often は一般動詞の前に置きます (I often watch)。"},
{"id":"i-science-04","lv":1,"theme":"science","q":"Do you like visiting science museums?","qja":"科学館に行くのは好きですか?","hint":"はい、恐竜の展示が大好き","model":"Yes, I love the dinosaur exhibits.","alts":["Yes, especially the dinosaur sections.","I do. The dinosaurs are my favorite."],"keys":[["yes","i do","love"],["dinosaur*"]],"loose":["yes","no","love*","like*","museum*","dinosaur*","exhibits","kids","weekend","sometimes","space","robot*"],"opts":{"o":["Yes, I love the dinosaur exhibits.","Yes, I love the dinosaurs exhibit.","Yes, I'm loving dinosaur exhibits."],"a":0},"para":["Love them, especially the dinosaurs.","Big yes. Dinosaurs never get old."],"tip":"名詞を形容詞のように使うときは単数形 (dinosaur exhibits) にします。"},
{"id":"i-science-05","lv":1,"theme":"science","q":"Are you good at math?","qja":"数学は得意ですか?","hint":"あまり得意ではないけど、好き","model":"Not really, but I like it.","alts":["Not very good, but I enjoy it.","I'm not great at it, but I like it."],"keys":[["not"],["like","enjoy","love","fun","interesting"]],"loose":["yes","no","not","good","bad","like","hate","math","numbers","really","school","enjoy"],"opts":{"o":["Not really, but I am liking it.","No really, but I like.","Not really, but I like it."],"a":2},"para":["Not really, but it's fun.","I'm no math whiz, but I enjoy it."],"tip":"like は目的語が必要なので I like it と言います。"},
{"id":"i-science-06","lv":2,"theme":"science","q":"What's a scientific fact that surprised you?","qja":"驚いた科学の事実は何ですか?","hint":"体の細胞の多くは数年で入れ替わるということ","model":"I was surprised that many of the cells in our body are replaced every few years.","alts":["That a lot of our body's cells get replaced every few years.","I was shocked to learn our cells keep getting replaced."],"keys":[["cell*"],["replac*","renew*","chang*","swap*"]],"loose":["surprised","that","learned","body","cells","brain","animals","water","light","because","know","fact"],"opts":{"o":["I was surprised that many of the cells in our body replace every few years.","I was surprised that many of the cells in our body are replaced every few years.","I surprised that many cells in body are replaced every few year."],"a":1},"para":["Our cells keep getting replaced. Wild, right?","Most of our cells are swapped out over the years."],"tip":"「驚いた」は I was surprised。I surprised では「驚かせた」になります。"},
{"id":"i-science-07","lv":2,"theme":"science","q":"Do you have any experiments you'd like to try at home?","qja":"家でやってみたい実験はありますか?","hint":"重曹とお酢で小さな火山を作ってみたい","model":"I'd like to make a small volcano with baking soda and vinegar.","alts":["Making a mini volcano with baking soda and vinegar.","I want to try the baking soda and vinegar volcano."],"keys":[["volcano*"],["baking soda","vinegar"]],"loose":["would","like","want*","try","make","experiment*","home","kitchen","kids","water","volcano","egg*","ice","plants"],"opts":{"o":["I'd like to make a small volcano with baking soda and vinegar.","I'd like to make a small volcano by baking soda and vinegar.","I would like making small volcano with baking soda and a vinegar."],"a":0},"para":["The classic baking soda volcano.","I'd love to do a fizzy volcano with my kids."],"tip":"材料を表す「〜で(作る)」は with を使います。"},
{"id":"i-science-08","lv":2,"theme":"science","q":"How do you explain science to children?","qja":"子どもに科学をどう説明していますか?","hint":"身近なものを例にして、一緒に実験する","model":"I use everyday things as examples and do experiments together.","alts":["I give examples from daily life, and we try experiments together.","I use familiar things and we experiment together."],"keys":[["example*","everyday","daily","familiar"],["experiment*"],["together"]],"loose":["use*","examples","simple","easy","show*","together","games","pictures","experiment*","explain*","questions","words"],"opts":{"o":["I use everyday things as example and doing experiments together.","I am using every day things to examples and experiments together.","I use everyday things as examples and do experiments together."],"a":2},"para":["Simple examples and hands-on experiments.","I keep it real-life and we try stuff together."],"tip":"everyday (形容詞) は「日常の」、every day (副詞) は「毎日」です。"},
{"id":"i-science-09","lv":2,"theme":"science","q":"Which invention do you think changed the world the most?","qja":"世界を一番変えた発明は何だと思いますか?","hint":"インターネット。世界中の人がつながったから","model":"The internet, because it connected people all over the world.","alts":["I'd say the internet, since it links people everywhere.","The internet. It connected the whole world."],"keys":[["internet","web"],["connect*","link*","together"]],"loose":["think","because","internet","electricity","printing","phone","car*","computer*","world","people","changed","medicine","wheel"],"opts":{"o":["The internet, because it connected the people all over world.","The internet, because it connected people all over the world.","The internet, because it was connecting people in all over the world."],"a":1},"para":["The internet. It brought everyone together.","Has to be the internet."],"tip":"「世界中の」は all over the world です。"},
{"id":"i-science-10","lv":2,"theme":"science","q":"Do you read about health and the human body?","qja":"健康や人の体についての本や記事を読みますか?","hint":"はい、睡眠についての記事をよく読む","model":"Yes, I often read articles about sleep.","alts":["Yes, mostly articles about sleep.","I do. I read a lot about sleep."],"keys":[["sleep*"],["read*","article*","yes","yeah","i do"]],"loose":["yes","no","read*","articles","books","sleep","food","diet","exercise","health","often","sometimes"],"opts":{"o":["Yes, I often read articles about sleep.","Yes, I often read articles about sleeping well things.","Yes, I am often reading article about sleep."],"a":0},"para":["Yeah, mainly stuff about sleep.","All the time, especially sleep science."],"tip":"article は数えられる名詞なので articles と複数形にします。"},
{"id":"i-science-11","lv":3,"theme":"science","q":"If you could be a scientist, what would you research?","qja":"もし科学者になれるとしたら、何を研究しますか?","hint":"海の生き物。深海にはまだ知られていない生物が多いから","model":"I'd study deep-sea creatures, because there are still many species we haven't discovered.","alts":["Ocean life, since lots of deep-sea species haven't been found yet.","I'd research the deep sea, because so many creatures there are still unknown."],"keys":[["sea","ocean","marine"],["discover*","found","unknown","new","undiscovered","unexplored"]],"loose":["would","study","research*","because","ocean","space","brain","animals","energy","disease*","climate","since","medicine"],"opts":{"o":["I'd study deep-sea creatures, because there are still many species we didn't discover.","I will study deep sea creature, because still many species not discovered by us.","I'd study deep-sea creatures, because there are still many species we haven't discovered."],"a":2},"para":["The deep ocean. It's basically unexplored.","Deep-sea life. There's so much still out there."],"tip":"「まだ〜していない」は現在完了 we haven't discovered で表します。"},
{"id":"i-science-12","lv":3,"theme":"science","q":"What do you think is the biggest challenge for science today?","qja":"今の科学にとって一番の課題は何だと思いますか?","hint":"気候変動。解決にはみんなの協力が必要","model":"Climate change, because we can't solve it unless everyone works together.","alts":["I think climate change, and it needs everyone's cooperation.","Climate change. It can only be solved if we all work together."],"keys":[["climate","global warming"],["together","cooperat*","everyone","all of us","we all"]],"loose":["think","climate","change","energy","disease*","because","together","world","problem","solve","unless","health","future"],"opts":{"o":["Climate change, because we can't solve it unless everyone works together.","Climate change, because we can't solve it unless everyone doesn't work together.","Climate change, because we can't solving unless all people work together."],"a":0},"para":["Climate change. Nobody can fix it alone.","Global warming, and it'll take all of us."],"tip":"unless は「〜しない限り」。後ろに否定語を重ねないようにします。"},
{"id":"i-science-13","lv":3,"theme":"science","q":"Have you ever changed a habit because of something you learned?","qja":"何かを学んだことがきっかけで習慣を変えたことはありますか?","hint":"ある。寝る前のスマホが睡眠に悪いと知って、やめた","model":"Yes, I stopped using my phone before bed after learning it affects sleep.","alts":["Yes. When I learned screens hurt sleep, I quit using my phone at night.","I have. I don't look at my phone before bed anymore, since it's bad for sleep."],"keys":[["phone*","screen*"],["sleep*","bed"],["stop*","quit","not","anymore","no more","ditch*","gave up"]],"loose":["yes","stopped","started","quit","learned","because","habit","now","after","healthy","sleep","food","since"],"opts":{"o":["Yes, I stopped to use my phone before bed after learning it affects sleep.","Yes, I stopped using my phone before bed after learning it affects sleep.","Yes, I am stopped using phone before bed after I learn it affects sleep."],"a":1},"para":["Yep, no more phone in bed. It wrecks your sleep.","I ditched late-night scrolling once I learned what it does to sleep."],"tip":"stop -ing は「〜するのをやめる」、stop to do は「〜するために立ち止まる」です。"},
{"id":"i-science-14","lv":3,"theme":"science","q":"Which would you rather explore, the deep sea or outer space?","qja":"深海と宇宙、探検するならどちらがいいですか?","hint":"深海。宇宙より近いのに、ほとんど知られていないから","model":"The deep sea, because even though it's closer than space, we know very little about it.","alts":["The deep sea. It's close to us, but we hardly know anything about it.","I'd pick the deep ocean, since it's so near and still mostly unknown."],"keys":[["sea","ocean"],["little","hardly","barely","unknown","not know","myster*"]],"loose":["would","rather","deep","sea","ocean","space","because","since","although","explore","scary","unknown","both"],"opts":{"o":["The deep sea, because even though it's closer than space, we know very little about it.","The deep sea, because even it's closer than space, we know very few about it.","The deep sea, because although closer than space, we are knowing little."],"a":0},"para":["The deep sea. It's right here, and we barely know it.","Ocean, for sure. It's a mystery next door."],"tip":"even though は「〜なのに」。even だけでは接続詞になりません。"},
{"id":"i-science-15","lv":4,"theme":"science","q":"Do you think science can answer every question about life?","qja":"科学は人生のあらゆる疑問に答えられると思いますか?","hint":"そうは思わない。科学は多くを説明できるが、生きる意味のような問いは別","model":"I don't think so, because although science explains a lot, questions like the meaning of life are different.","alts":["No. Science can explain many things, but not things like why we're here.","Not every question. The meaning of life is something science can't really answer."],"keys":[["not","no"],["meaning","why we are here","purpose"]],"loose":["think","not","because","although","however","science","explain*","meaning","everything","some","questions","life","maybe"],"opts":{"o":["I don't think so, because although science explains a lot, but questions like meaning of life are different.","I don't think, because science is explaining many, questions like life meaning is different.","I don't think so, because although science explains a lot, questions like the meaning of life are different."],"a":2},"para":["Not everything. Some questions are more philosophical.","Science covers a lot, but not the meaning of life."],"tip":"although と but は一緒に使いません。どちらか1つにします。"},
{"id":"i-science-16","lv":4,"theme":"science","q":"If you could ask a famous scientist from history one question, what would it be?","qja":"歴史上の有名な科学者に1つ質問できるとしたら、何を聞きますか?","hint":"失敗が続いたとき、どうやってやる気を保ったのか","model":"I'd ask how they stayed motivated when their experiments kept failing.","alts":["How they kept going after so many failed experiments.","I'd want to know how they stayed motivated through all their failures."],"keys":[["motivat*","kept going","keep going","give up","gave up","kept them going","keep trying","kept trying"],["fail*"]],"loose":["would","ask","how","why","what","idea*","failure*","motivated","discover*","think","work","future","if"],"opts":{"o":["I'd ask how they stayed motivated when their experiments kept failing.","I'd ask how did they stay motivated when their experiments kept failing.","I'd ask how they stayed motivated when their experiments were keep failing."],"a":0},"para":["How they didn't give up after all those failures.","What kept them going when nothing worked."],"tip":"keep -ing で「〜し続ける」(kept failing = 失敗し続けた) です。"},
{"id":"i-music-01","lv":1,"theme":"music","q":"What kind of music do you like?","qja":"どんな音楽が好きですか?","hint":"ロック、特に古いロック","model":"I like rock music, especially old rock.","alts":["Rock, especially the old stuff.","I love rock, particularly classic rock."],"keys":[["rock"],["old","classic"]],"loose":["like*","love*","rock","pop","jazz","classical","especially","music","listen*","hip","metal","all"],"opts":{"o":["I like rock music, especially old rocks.","I like rock music, especially old rock.","I'm like rock musics, special old rock."],"a":1},"para":["Rock, mostly the classic stuff.","Old-school rock all the way."],"tip":"ジャンル名の music は数えられないので musics にはしません。"},
{"id":"i-music-02","lv":1,"theme":"music","q":"Do you play any instruments?","qja":"何か楽器を弾きますか?","hint":"エレキギターを弾く","model":"Yes, I play the electric guitar.","alts":["I play electric guitar.","Yes, electric guitar."],"keys":[["electric"],["guitar*"]],"loose":["yes","no","play*","guitar","piano","drums","bass","violin","little","used","learn*","instrument*"],"opts":{"o":["Yes, I play the electric guitar.","Yes, I play electric guitar instrument.","Yes, I am playing an electric guitar always."],"a":0},"para":["Yep, electric guitar.","I'm a guitar guy. Electric."],"tip":"楽器を弾くは play the guitar のように the を付けるのが基本です。"},
{"id":"i-music-03","lv":1,"theme":"music","q":"How often do you practice the guitar?","qja":"どのくらいギターの練習をしますか?","hint":"毎日30分","model":"I practice for thirty minutes every day.","alts":["Thirty minutes a day.","Every day, for about half an hour."],"keys":[["thirty","half an hour","30"],["every day","a day","daily"]],"loose":["every","day","minutes","hour*","week","practice*","night","weekend*","often","sometimes","usually","about"],"opts":{"o":["I practice thirty minutes in every day.","I am practicing for thirty minute every day.","I practice for thirty minutes every day."],"a":2},"para":["Half an hour, every day.","Thirty minutes a day, no matter what."],"tip":"every day の前に in は付けません。"},
{"id":"i-music-04","lv":1,"theme":"music","q":"When do you usually listen to music?","qja":"たいていいつ音楽を聴きますか?","hint":"通勤中と料理しているとき","model":"I listen to music on my commute and while I cook.","alts":["On my way to work and when I'm cooking.","While commuting and while cooking."],"keys":[["commut*","way to work","train","work"],["cook*","kitchen"]],"loose":["listen*","when","while","commute*","train","work","cook*","run*","study*","morning","night","always"],"opts":{"o":["I listen to music on my commute and while I cook.","I listen music on my commute and while I cook.","I listen to music in my commute and when cooking it."],"a":0},"para":["Commuting and cooking, mostly.","Whenever I'm on the train or in the kitchen."],"tip":"listen は listen to music のように to が必要です。"},
{"id":"i-music-05","lv":1,"theme":"music","q":"Have you ever been to a concert?","qja":"コンサートに行ったことはありますか?","hint":"ある。去年、友だちとロックのライブに行った","model":"Yes, I went to a rock concert with friends last year.","alts":["Yes, I saw a rock show with my friends last year.","I have. Last year, I went to a rock concert with my friends."],"keys":[["rock"],["last year"]],"loose":["yes","no","went","been","concert*","festival*","last","year","friends","once","never","live"],"opts":{"o":["Yes, I have gone to a rock concert with friends last year.","Yes, I went to a rock concert with friends last year.","Yes, I went to rock concert with friends in last year."],"a":1},"para":["Yep, a rock show last year with friends.","I did, last year. It was a blast."],"tip":"last year のような過去の時を示す語があるときは現在完了ではなく過去形を使います。"},
{"id":"i-music-06","lv":2,"theme":"music","q":"What made you start playing the guitar?","qja":"ギターを始めたきっかけは何ですか?","hint":"高校のとき、好きなバンドのギタリストにあこがれた","model":"In high school, I wanted to be like the guitarist in my favorite band.","alts":["I looked up to a guitarist in a band I loved in high school.","When I was in high school, I admired the guitarist of my favorite band."],"keys":[["high school"],["guitarist","guitar player"]],"loose":["because","when","school","band","friend*","father","wanted","cool","saw","heard","started","song*","video*"],"opts":{"o":["In high school, I wanted to be the guitarist like my favorite band.","When high school, I wanted being like guitarist of my favorite band.","In high school, I wanted to be like the guitarist in my favorite band."],"a":2},"para":["A guitar hero from my favorite band, back in high school.","I wanted to be like my favorite band's guitarist."],"tip":"look up to ... は「〜にあこがれる、尊敬する」の意味です。"},
{"id":"i-music-07","lv":2,"theme":"music","q":"What's the hardest part of learning the guitar?","qja":"ギターを習うときに一番難しいのはどこですか?","hint":"コードをすばやく切り替えること","model":"Changing chords quickly is the hardest part for me.","alts":["Switching between chords fast.","For me, it's changing chords smoothly and quickly."],"keys":[["chord*"],["chang*","switch*"]],"loose":["hard*","difficult","chords","fingers","practice","time*","rhythm","barre","because","fast","quickly","hurt*"],"opts":{"o":["Changing chords quickly is the hardest part for me.","Change chords quickly is the hardest part for me.","Changing chords quick is the most hard part for me."],"a":0},"para":["Switching chords fast enough.","Smooth chord changes, by far."],"tip":"主語に動詞を使うときは -ing 形 (Changing chords ...) にします。"},
{"id":"i-music-08","lv":2,"theme":"music","q":"Do you prefer playing alone or in a band?","qja":"一人で弾くのとバンドで弾くの、どちらが好きですか?","hint":"バンド。みんなで音を合わせるのが楽しい","model":"In a band, because playing together with others is so much fun.","alts":["A band. Making music with other people is really fun.","I prefer a band, since jamming together is fun."],"keys":[["band"],["fun","enjoy*","love","jam*","together"]],"loose":["prefer*","alone","band","because","fun","together","others","both","home","people","jam*","nervous"],"opts":{"o":["In a band, because playing together with others are so much fun.","In a band, because playing together with others is so much fun.","In a band, because play together with others is so funny."],"a":1},"para":["A band, for sure. Jamming is the best.","With others. It's way more fun."],"tip":"「楽しい」は fun。funny は「おかしい、笑える」です。"},
{"id":"i-music-09","lv":2,"theme":"music","q":"Is there a song that always cheers you up?","qja":"いつも元気をくれる曲はありますか?","hint":"ある。昔のロックの曲で、聴くと踊りたくなる","model":"Yes, an old rock song that always makes me want to dance.","alts":["Yes, there's an old rock song that makes me want to dance.","There is. A classic rock tune that gets me dancing."],"keys":[["rock"],["dance","dancing"]],"loose":["yes","song","always","makes","happy","when","favorite","listen*","sad","cheer*","feel*","dance"],"opts":{"o":["Yes, an old rock song that always makes me want to dance.","Yes, an old rock song that always makes me to want dance.","Yes, an old rock song always make me wanting to dance."],"a":0},"para":["Yep, an old rock song that gets me dancing every time.","There's this classic rock track I can't sit still to."],"tip":"make + 人 + 動詞の原形 (makes me want to dance) の形に注意します。"},
{"id":"i-music-10","lv":2,"theme":"music","q":"How do you learn new songs on the guitar?","qja":"ギターで新しい曲をどうやって覚えていますか?","hint":"動画を見て、ゆっくり少しずつ練習する","model":"I watch videos and practice slowly, little by little.","alts":["I learn from videos and practice slowly, bit by bit.","I watch online lessons and go slowly, one part at a time."],"keys":[["video*","lesson*","tutorial*"],["slow*"]],"loose":["watch*","videos","tabs","ear","practice*","slowly","listen*","lesson*","part*","sheet","music","online","learn*"],"opts":{"o":["I watch videos and practice slow, little and little.","I watch video and practicing slowly, a little by a little.","I watch videos and practice slowly, little by little."],"a":2},"para":["Videos and lots of slow practice.","Online tutorials, nice and slow."],"tip":"little by little は「少しずつ」という決まった言い方です。"},

{"id":"l3-daily-02","lv":3,"theme":"daily","lines":[{"s":"M","en":"Did you end up getting the blue sofa?"},{"s":"W","en":"I almost did, but, you know, it was too big for our living room."},{"s":"M","en":"So what happened?"},{"s":"W","en":"I went with a smaller gray one. It's actually more comfortable."}],"ja":"男性:結局あの青いソファ、買ったの?\n女性:買いかけたんだけど、ほら、うちのリビングには大きすぎて。\n男性:それでどうしたの?\n女性:小さめのグレーのにしたよ。実はそっちのほうが座り心地がいいの。","q":"Why didn't the woman buy the blue sofa?","o":["It was too expensive","It wasn't comfortable","It didn't fit her room","It was sold out"],"a":2,"why":"too big for our living room(リビングには大きすぎた)=部屋に合わなかった、という言い換えです。","key":"too big for our living room"},
{"id":"l3-daily-03","lv":3,"theme":"daily","lines":[{"s":"W","en":"Ugh, I've been waiting for the plumber since nine."},{"s":"M","en":"Did they give you a time window?"},{"s":"W","en":"They said between nine and noon. It's almost one now."},{"s":"M","en":"I'd call them. I mean, that's way past what they promised."}],"ja":"女性:もう、9時から配管工さんを待ってるんだけど。\n男性:時間の幅は言われてた?\n女性:9時から12時の間って。もうすぐ1時だよ。\n男性:僕なら電話するな。だって、約束よりずっと過ぎてるでしょ。","q":"What does the man think the woman should do?","o":["Contact the plumber's company","Fix it herself","Keep waiting quietly","Find a new house"],"a":0,"why":"I'd call them(僕なら電話する)=業者に連絡すべき、という助言です。","key":"I'd call them"},
{"id":"l3-travel-01","lv":3,"theme":"travel","lines":[{"s":"M","en":"So, how was Lisbon?"},{"s":"W","en":"Amazing, but honestly, the hills nearly killed me."},{"s":"M","en":"Ha, I've heard. Did you try the trams?"},{"s":"W","en":"Once. They were packed, so we mostly walked."}],"ja":"男性:で、リスボンはどうだった?\n女性:最高だったけど、正直、坂で死にそうだった。\n男性:はは、聞いたことある。路面電車は乗った?\n女性:1回だけ。満員だったから、ほとんど歩いたよ。","q":"How did the woman mostly get around?","o":["By tram","By taxi","By bike","On foot"],"a":3,"why":"we mostly walked(ほとんど歩いた)と言っています。tram は1回だけです。","key":"we mostly walked"},
{"id":"l3-travel-02","lv":3,"theme":"travel","lines":[{"s":"W","en":"Excuse me, I think I'm in the wrong line. Is this for international flights?"},{"s":"M","en":"No, this one's domestic. International check-in is on the other side."},{"s":"W","en":"Oh, great. My flight boards in forty minutes."},{"s":"M","en":"You should be fine, but I wouldn't stop for coffee."}],"ja":"女性:すみません、列を間違えたみたいで。ここは国際線ですか。\n男性:いいえ、ここは国内線です。国際線のチェックインは反対側です。\n女性:ああ、もう。私の便、あと40分で搭乗なんです。\n男性:間に合うと思いますが、コーヒーを買う時間はないと思いますよ。","q":"What does the man suggest?","o":["She has missed her flight","She should go straight to check-in","She should buy coffee first","She should stay in this line"],"a":1,"why":"I wouldn't stop for coffee(私ならコーヒーで寄り道しない)=まっすぐチェックインへ行くべき、という意味です。Oh, great はここでは皮肉です。","key":"I wouldn't stop for coffee"},
{"id":"l3-travel-03","lv":3,"theme":"travel","lines":[{"s":"M","en":"Hi, I booked a room with a view of the sea."},{"s":"W","en":"Let me check... Hmm, it says here you booked a garden view."},{"s":"M","en":"Really? I'm pretty sure I chose the sea view."},{"s":"W","en":"I'm sorry about that. We do have one sea-view room left, if you'd like it at no extra charge."}],"ja":"男性:こんにちは、海が見える部屋を予約したんですが。\n女性:確認しますね……あら、こちらではガーデンビューのご予約になっています。\n男性:本当ですか?海側を選んだはずなんですが。\n女性:申し訳ございません。海側のお部屋が1つ残っておりますので、よろしければ追加料金なしでご用意します。","q":"What will probably happen next?","o":["The man will pay more","The man will leave the hotel","The man will get a sea-view room","The man will choose a garden view"],"a":2,"why":"at no extra charge(追加料金なし)で海側の部屋を提案しているので、男性はその部屋に泊まると推測できます。","key":"at no extra charge"},
{"id":"l3-business-01","lv":3,"theme":"business","lines":[{"s":"W","en":"How did the presentation go?"},{"s":"M","en":"Well, the client liked the idea, but they want to see the numbers first."},{"s":"W","en":"So no decision yet?"},{"s":"M","en":"Not yet. They're getting back to us next week."}],"ja":"女性:プレゼン、どうだった?\n男性:うーん、お客さんはアイデアは気に入ってくれたけど、まず数字を見たいって。\n女性:じゃあ、まだ決まってないの?\n男性:まだ。来週返事をくれるって。","q":"What is the client's position?","o":["They rejected the plan","They need more information before deciding","They signed the contract","They didn't like the idea"],"a":1,"why":"want to see the numbers first(まず数字を見たい)、no decision yet なので、決める前に情報が必要という状態です。","key":"see the numbers first"},
{"id":"l3-business-02","lv":3,"theme":"business","lines":[{"s":"M","en":"Do you have a minute? It's about the Hanson project."},{"s":"W","en":"Sure, what's up?"},{"s":"M","en":"I mean, I don't think we can finish it with just two people."},{"s":"W","en":"Okay. Let me talk to the manager about getting you some help."}],"ja":"男性:ちょっといいですか。ハンソンのプロジェクトのことなんですが。\n女性:いいよ、どうしたの?\n男性:その、2人だけでは終わらせられないと思うんです。\n女性:わかった。人を増やせないか、部長に話してみるね。","q":"What is the man's problem?","o":["The team is too small","The project is boring","The manager is angry","The deadline was moved earlier"],"a":0,"why":"with just two people(2人だけでは)無理=チームの人数が少なすぎる、という問題です。","key":"with just two people"},
{"id":"l3-business-03","lv":3,"theme":"business","lines":[{"s":"W","en":"I heard you're leaving the company."},{"s":"M","en":"Yeah, actually, I'm starting my own business."},{"s":"W","en":"Wow, that's brave! What kind?"},{"s":"M","en":"Online English lessons. You know, I've always wanted to teach."},{"s":"W","en":"Good for you. I'll miss you, though."}],"ja":"女性:会社を辞めるって聞いたよ。\n男性:うん、実は自分で事業を始めるんだ。\n女性:わあ、勇気あるね!どんな事業?\n男性:オンライン英会話。ほら、ずっと教えたかったからさ。\n女性:よかったね。でも寂しくなるな。","q":"Why is the man leaving?","o":["He got a job at another company","He is moving abroad","He was fired","He is starting a company of his own"],"a":3,"why":"starting my own business(自分の事業を始める)を言い換えた選択肢が正解です。","key":"starting my own business"},
{"id":"l3-fx-01","lv":3,"theme":"fx","lines":[{"s":"M","en":"You look tired. Were you trading all night again?"},{"s":"W","en":"Yeah. I kept waiting for a better entry, and it never came."},{"s":"M","en":"You know, sometimes no trade is the best trade."},{"s":"W","en":"I know, I know. I should've just gone to bed."}],"ja":"男性:疲れてるね。また徹夜でトレードしてたの?\n女性:うん。もっといいエントリーを待ち続けてたけど、結局来なかった。\n男性:ほら、トレードしないのが一番のトレードってこともあるよ。\n女性:わかってる、わかってる。さっさと寝ればよかった。","q":"What does the woman wish she had done?","o":["Traded earlier","Gone to sleep","Bought more","Asked for advice"],"a":1,"why":"I should've just gone to bed(寝ればよかった)は後悔の表現です。","key":"I should've just gone to bed"},
{"id":"l3-fx-02","lv":3,"theme":"fx","lines":[{"s":"W","en":"How big was your position?"},{"s":"M","en":"Honestly, too big. I risked about ten percent of my account."},{"s":"W","en":"Ten? I never go over one or two percent on a single trade."},{"s":"M","en":"Yeah, lesson learned. I'm keeping it small from now on."}],"ja":"女性:ポジションはどのくらいの大きさだったの?\n男性:正直、大きすぎた。口座の10%くらいをリスクにさらしてた。\n女性:10%?私は1回のトレードで1〜2%を超えないようにしてるよ。\n男性:うん、いい勉強になった。これからは小さくするよ。","q":"What will the man do from now on?","o":["Take smaller risks","Stop trading","Risk ten percent again","Trade more often"],"a":0,"why":"I'm keeping it small(小さく保つ)=リスクを小さくする、という意味です。","key":"keeping it small"},
{"id":"l3-fx-03","lv":3,"theme":"fx","lines":[{"s":"M","en":"So, do you trade based on the news?"},{"s":"W","en":"Not really. I mean, I check the calendar so I'm not surprised."},{"s":"M","en":"But you don't trade the news itself?"},{"s":"W","en":"No. The price jumps around too much. I wait until it calms down."}],"ja":"男性:ニュースをもとにトレードしてるの?\n女性:そうでもないよ。というか、驚かないように指標カレンダーは確認してる。\n男性:でも、ニュースそのものではトレードしないんだ?\n女性:しない。値段が飛び跳ねすぎるから。落ち着くまで待つの。","q":"Why doesn't the woman trade right at news time?","o":["She doesn't understand the news","She has no time","The price moves too wildly","Her broker doesn't allow it"],"a":2,"why":"The price jumps around too much(値段が激しく動きすぎる)の言い換えが正解です。","key":"jumps around too much"},
{"id":"l3-stocks-01","lv":3,"theme":"stocks","lines":[{"s":"W","en":"Did you see Norvale's earnings?"},{"s":"M","en":"Yeah, profits were up, but the stock still fell."},{"s":"W","en":"Weird. Why?"},{"s":"M","en":"Well, people expected even better results, I guess."}],"ja":"女性:ノーベイル社の決算、見た?\n男性:うん、利益は増えたのに、株価は下がったね。\n女性:変なの。どうして?\n男性:たぶん、みんなもっといい結果を期待してたんだと思うよ。","q":"Why did the stock fall, according to the man?","o":["Profits went down","The results were below expectations","The company closed","People sold for the holidays"],"a":1,"why":"people expected even better results(もっと良い結果を期待していた)=予想を下回った、ということです。利益は増えています。","key":"expected even better results"},
{"id":"l3-stocks-02","lv":3,"theme":"stocks","lines":[{"s":"M","en":"I'm thinking of putting all my savings into one company."},{"s":"W","en":"All of it? That sounds risky."},{"s":"M","en":"But I really believe in them."},{"s":"W","en":"Sure, but, you know, even good companies have bad years. I'd spread it out."}],"ja":"男性:貯金を全部1つの会社に入れようと思ってるんだ。\n女性:全部?それは危なそう。\n男性:でも、本当にその会社を信じてるんだ。\n女性:それはわかるけど、ほら、いい会社にも悪い年はあるよ。私なら分散するな。","q":"What is the woman's advice?","o":["Invest in many companies","Put everything in one company","Keep the money in the bank","Wait for a bad year"],"a":0,"why":"I'd spread it out(私なら分散する)=いくつもの会社に分けて投資する、という助言です。","key":"spread it out"},
{"id":"l3-stocks-03","lv":3,"theme":"stocks","lines":[{"s":"W","en":"How often do you check your stocks?"},{"s":"M","en":"Honestly? Like twenty times a day."},{"s":"W","en":"No wonder you're stressed! I only look once a month."},{"s":"M","en":"Once a month? Maybe I should try that."}],"ja":"女性:株はどのくらいの頻度でチェックしてる?\n男性:正直に言うと、1日20回くらい。\n女性:そりゃストレスもたまるよ!私は月に1回しか見ないよ。\n男性:月1回?僕もやってみようかな。","q":"What will the man probably try?","o":["Checking more often","Selling all his stocks","Buying more stocks","Checking his stocks less often"],"a":3,"why":"Maybe I should try that(やってみようかな)の that は「月1回だけ見る」こと。つまり見る回数を減らします。","key":"maybe I should try that"},
{"id":"l3-tech-01","lv":3,"theme":"tech","lines":[{"s":"M","en":"Have you tried the new photo app? It removes people from your pictures."},{"s":"W","en":"Yeah, it's kind of scary how good it is."},{"s":"M","en":"Scary? Why?"},{"s":"W","en":"I mean, how do we know which photos are real anymore?"}],"ja":"男性:新しい写真アプリ使った?写真から人を消せるんだよ。\n女性:うん、性能がよすぎてちょっと怖いくらい。\n男性:怖い?なんで?\n女性:だって、もうどの写真が本物かわからなくなるじゃない。","q":"What worries the woman?","o":["The app is too expensive","Telling real photos from edited ones","Her photos might be lost","The app is hard to use"],"a":1,"why":"which photos are real(どの写真が本物か)わからない、という心配です。","key":"which photos are real"},
{"id":"l3-tech-02","lv":3,"theme":"tech","lines":[{"s":"W","en":"My laptop's been super slow lately."},{"s":"M","en":"How many tabs do you have open?"},{"s":"W","en":"Um... maybe fifty?"},{"s":"M","en":"Well, there's your problem. Close some of them and see what happens."}],"ja":"女性:最近ノートパソコンがすごく遅いの。\n男性:タブはいくつ開いてる?\n女性:えーと……50くらい?\n男性:それが原因だよ。いくつか閉じて様子を見てみて。","q":"What does the man think is causing the problem?","o":["Too many open tabs","A virus","An old battery","A slow internet connection"],"a":0,"why":"fifty(50)と聞いて there's your problem(それが原因だ)と言っています。","key":"there's your problem"},
{"id":"l3-tech-03","lv":3,"theme":"tech","lines":[{"s":"M","en":"Did you back up your files before the update?"},{"s":"W","en":"No... should I have?"},{"s":"M","en":"Well, usually it's fine, but if something goes wrong, you could lose everything."},{"s":"W","en":"Okay, I'm doing it right now."}],"ja":"男性:アップデートの前にファイルのバックアップは取った?\n女性:ううん……取るべきだった?\n男性:まあ普通は大丈夫だけど、何かあったら全部なくなるかもしれないよ。\n女性:わかった、今すぐやる。","q":"What is the woman going to do?","o":["Skip the update","Buy a new computer","Make a copy of her files","Delete old files"],"a":2,"why":"I'm doing it right now の it は back up(バックアップ)。ファイルのコピーを取ることです。","key":"back up your files"},
{"id":"l3-space-01","lv":3,"theme":"space","lines":[{"s":"W","en":"Did you see the meteor shower last night?"},{"s":"M","en":"I tried, but it was too cloudy where I live."},{"s":"W","en":"Oh, that's a shame. It's supposed to continue tonight, though."},{"s":"M","en":"Really? Then I'll try again if the sky's clear."}],"ja":"女性:昨夜の流星群、見た?\n男性:見ようとしたけど、うちのほうは曇りすぎてた。\n女性:それは残念。でも今夜も続くらしいよ。\n男性:本当?じゃあ晴れていたらまた挑戦してみる。","q":"What will the man do tonight?","o":["Stay inside because of clouds","Watch the shower on TV","Go to the woman's house","Try to see it again if the weather is good"],"a":3,"why":"I'll try again if the sky's clear(空が晴れていたらまた挑戦する)の言い換えです。","key":"if the sky's clear"},
{"id":"l3-space-02","lv":3,"theme":"space","lines":[{"s":"M","en":"Why do we always see the same side of the Moon?"},{"s":"W","en":"Actually, it spins exactly once each time it goes around us."},{"s":"M","en":"So the other side is always facing away?"},{"s":"W","en":"Right. But it still gets sunlight. It's not really dark."}],"ja":"男性:どうしていつも月の同じ面しか見えないの?\n女性:実は、月は地球の周りを1周するたびに、ちょうど1回自転してるの。\n男性:じゃあ、反対側はいつも向こうを向いてるんだ?\n女性:そう。でも反対側にも日光は当たるよ。本当に暗いわけじゃないの。","q":"What does the woman say about the far side of the Moon?","o":["It is always dark","It also gets sunlight","It spins faster","We can see it in winter"],"a":1,"why":"it still gets sunlight(それでも日光は当たる)と言っています。always dark は誤解として否定されています。","key":"it still gets sunlight"},
{"id":"l3-science-01","lv":3,"theme":"science","lines":[{"s":"W","en":"I can't sleep if I drink coffee after three."},{"s":"M","en":"Same here. Caffeine stays in your body for hours."},{"s":"W","en":"Really? How many?"},{"s":"M","en":"I'm not sure exactly, but, you know, long enough to ruin your night."}],"ja":"女性:3時以降にコーヒーを飲むと眠れないの。\n男性:僕も。カフェインは何時間も体に残るからね。\n女性:そうなの?何時間?\n男性:正確にはわからないけど、ほら、夜を台無しにするくらいには長いよ。","q":"What do they both have in common?","o":["They drink coffee at night","They don't like coffee","Afternoon coffee hurts their sleep","They work at night"],"a":2,"why":"Same here(僕も同じ)で、午後のコーヒーで眠れないことが共通しています。","key":"same here"},
{"id":"l3-science-02","lv":3,"theme":"science","lines":[{"s":"M","en":"Why does my bread go bad so fast in summer?"},{"s":"W","en":"Mold loves warm, wet places."},{"s":"M","en":"So, should I keep it in the fridge?"},{"s":"W","en":"Actually, the freezer's better. The fridge can make bread dry."}],"ja":"男性:夏はどうしてパンがすぐ悪くなるの?\n女性:カビは暖かくて湿った場所が大好きだからね。\n男性:じゃあ、冷蔵庫に入れたほうがいい?\n女性:実は冷凍庫のほうがいいよ。冷蔵庫だとパンがパサパサになることがあるの。","q":"Where does the woman suggest keeping bread?","o":["In the freezer","In the fridge","In a warm place","In the sun"],"a":0,"why":"Actually, the freezer's better(実は冷凍庫のほうがいい)と言っています。fridge は男性の案です。","key":"the freezer's better"},
{"id":"l3-music-01","lv":3,"theme":"music","lines":[{"s":"W","en":"How's the new guitar?"},{"s":"M","en":"Love it. But, I mean, the neck feels a lot thinner than my old one."},{"s":"W","en":"Is that a problem?"},{"s":"M","en":"Not really. It just takes some getting used to."}],"ja":"女性:新しいギターはどう?\n男性:気に入ってるよ。でも、なんていうか、ネックが前のよりずっと細く感じる。\n女性:それって問題?\n男性:そうでもない。ちょっと慣れが必要なだけ。","q":"How does the man feel about the guitar?","o":["He wants to return it","He likes it but needs time to adjust","He prefers his old one","He thinks it's too heavy"],"a":1,"why":"Love it(気に入っている)と It just takes some getting used to(慣れが必要なだけ)を合わせた言い換えです。","key":"takes some getting used to"},
{"id":"l3-music-02","lv":3,"theme":"music","lines":[{"s":"M","en":"We need a drummer for Saturday's show."},{"s":"W","en":"What happened to Leo?"},{"s":"M","en":"He hurt his wrist playing basketball."},{"s":"W","en":"Ouch. Actually, my cousin plays. Want me to ask her?"}],"ja":"男性:土曜のライブ用にドラマーが必要なんだ。\n女性:レオはどうしたの?\n男性:バスケで手首をけがしたんだ。\n女性:痛そう。実は私のいとこがドラムをやってるの。聞いてみようか?","q":"What will the woman probably do?","o":["Play the drums herself","Cancel the show","Visit Leo in the hospital","Ask her cousin to play"],"a":3,"why":"my cousin plays. Want me to ask her?(いとこが叩ける。聞いてみようか)から、いとこに頼むと推測できます。","key":"my cousin plays"},

// ===== lv4 達人 =====
{"id":"l4-daily-01","lv":4,"theme":"daily","lines":[{"s":"W","en":"So, for Mom's birthday, are we doing dinner at home or going out?"},{"s":"M","en":"I'd say going out. Nobody wants to cook and clean all day."},{"s":"W2","en":"But she always says restaurants are too noisy."},{"s":"W","en":"That's true. What about a private room somewhere?"},{"s":"M","en":"Good idea. That place by the river has one, I think."},{"s":"W2","en":"Okay, I'll call them tomorrow and ask."},{"s":"M","en":"And I'll handle the cake."},{"s":"W","en":"Perfect. Then I'll take care of the present."}],"ja":"女性1:お母さんの誕生日、家でディナーにする?それとも外食?\n男性:外食かな。一日中料理して片付けたい人なんていないし。\n女性2:でも、お母さんはいつもレストランはうるさすぎるって言うよ。\n女性1:確かに。どこかの個室はどう?\n男性:いいね。川沿いのあの店に個室があったと思う。\n女性2:じゃあ、明日電話して聞いてみる。\n男性:ケーキは僕が用意するよ。\n女性1:完璧。じゃあ私はプレゼント担当ね。","q":"Why do they want a private room?","o":["It's cheaper than a normal table","Their mother doesn't like noisy places","The restaurant is full","They want to cook themselves"],"a":1,"why":"she always says restaurants are too noisy(母はレストランはうるさいと言う)を受けて個室を提案しています。","key":"too noisy"},
{"id":"l4-daily-02","lv":4,"theme":"daily","lines":[{"s":"M","en":"Hi, this is Dan from Greenleaf Dental. I'm calling about your appointment on Tuesday at ten."},{"s":"M","en":"Unfortunately, the doctor has to be out that morning. We can see you the same day at four, or on Wednesday at ten."},{"s":"M","en":"Please call us back by Monday to let us know. Thanks, and have a great day."}],"ja":"もしもし、グリーンリーフ歯科のダンです。火曜日10時のご予約の件でお電話しました。あいにく、その日の午前は先生が不在になります。同じ日の4時か、水曜日の10時でしたらお受けできます。月曜日までに折り返しお電話でお知らせください。よろしくお願いします。よい一日を。","q":"Why is Dan calling?","o":["To reschedule an appointment","To cancel all future visits","To ask about a bill","To confirm a visit on Monday"],"a":0,"why":"先生が不在のため、別の時間(同じ日の4時か水曜10時)を提案しています。つまり予約の変更です。Monday は返事の期限です。","key":"the doctor has to be out"},
{"id":"l4-travel-01","lv":4,"theme":"travel","lines":[{"s":"W","en":"Welcome aboard, everyone. In about ten minutes, we'll cross the old stone bridge, which was built over three hundred years ago."},{"s":"W","en":"After that, we'll stop at the market for forty-five minutes. Please stay together, because it gets very crowded."},{"s":"W","en":"If you get lost, meet me at the clock tower. Our bus will leave from there at noon sharp."}],"ja":"皆さま、ご乗車ありがとうございます。あと10分ほどで、300年以上前に造られた古い石橋を渡ります。その後、市場で45分間停車します。とても混雑しますので、はぐれないようにしてください。迷子になったら、時計台で私と合流してください。バスはそこから正午ちょうどに出発します。","q":"What should people do if they get lost?","o":["Go back to the bus","Wait at the bridge","Go to the clock tower","Call the guide"],"a":2,"why":"If you get lost, meet me at the clock tower(迷ったら時計台で合流)と言っています。","key":"meet me at the clock tower"},
{"id":"l4-travel-02","lv":4,"theme":"travel","lines":[{"s":"M2","en":"Good morning. Do you have a reservation?"},{"s":"M","en":"Yes, under Tanaka. A compact car for three days."},{"s":"M2","en":"Let me see... I'm sorry, we don't have any compact cars left today."},{"s":"W","en":"Oh no. What do you have?"},{"s":"M2","en":"I can give you a larger car for the same price."},{"s":"M","en":"Well, that's fine with us. Actually, it's better. We have a lot of luggage."},{"s":"W","en":"Does it use more gas, though?"},{"s":"M2","en":"A little, but it's a hybrid, so not much."}],"ja":"店員:おはようございます。ご予約はありますか。\n男性:はい、タナカで。小型車を3日間です。\n店員:確認します……申し訳ありません、本日は小型車が残っていません。\n女性:えっ。何がありますか。\n店員:同じ料金で大きめの車をご用意できます。\n男性:それなら大丈夫です。実はそのほうがいいです。荷物が多いので。\n女性:でも、ガソリンはたくさん使いますか。\n店員:少しだけです。ハイブリッドなので、それほどではありません。","q":"How does the man feel about the larger car?","o":["He is upset about the price","He wants to cancel","He wants a compact car from another shop","He is happy because they have many bags"],"a":3,"why":"Actually, it's better. We have a lot of luggage.(むしろいい。荷物が多いから)と言っています。","key":"it's better"},
{"id":"l4-business-01","lv":4,"theme":"business","lines":[{"s":"W","en":"Okay, let's start. The main topic today is the website launch."},{"s":"M","en":"Right. The design is done, but testing is behind schedule."},{"s":"W2","en":"How far behind?"},{"s":"M","en":"About a week. We found some problems with the payment page."},{"s":"W","en":"Can we still launch on the first?"},{"s":"W2","en":"Honestly, I'd rather delay it than launch something broken."},{"s":"M","en":"I agree. A week's delay is better than angry customers."},{"s":"W","en":"Okay then. Let's move the launch to the eighth and tell the sales team today."}],"ja":"女性1:では始めましょう。今日の主な議題はウェブサイトの公開です。\n男性:はい。デザインは完成していますが、テストが予定より遅れています。\n女性2:どのくらい遅れているんですか。\n男性:1週間ほどです。決済ページにいくつか問題が見つかりました。\n女性1:それでも1日に公開できますか。\n女性2:正直、不具合のあるものを出すより延期したいです。\n男性:同感です。1週間の遅れのほうが、怒ったお客さまより良いです。\n女性1:わかりました。公開を8日に変更して、今日営業チームに伝えましょう。","q":"What do they decide?","o":["To launch on the first","To delay the launch by a week","To remove the payment page","To hire more testers"],"a":1,"why":"move the launch to the eighth(公開を8日に移す)=1日から1週間遅らせる決定です。","key":"move the launch to the eighth"},
{"id":"l4-business-02","lv":4,"theme":"business","lines":[{"s":"M","en":"Thanks for coming, everyone. I want to quickly share our results from the customer survey."},{"s":"M","en":"Most people were happy with our product, but many said our instructions were hard to understand."},{"s":"M","en":"So, this quarter, we're going to rewrite the manual with simpler language and more pictures. We're also adding short videos online."},{"s":"M","en":"Our goal is to cut support calls by twenty percent."}],"ja":"皆さん、お集まりいただきありがとうございます。顧客アンケートの結果を手短に共有します。ほとんどの方が製品に満足していましたが、説明書がわかりにくいという声が多くありました。そこで今四半期は、もっと簡単な言葉と多くの図で説明書を書き直します。また、短い動画もオンラインで追加します。目標は、サポートへの問い合わせ電話を20%減らすことです。","q":"What is the main problem customers mentioned?","o":["The product breaks easily","The price is too high","The instructions are confusing","Support calls are too long"],"a":2,"why":"instructions were hard to understand(説明書がわかりにくい)を confusing と言い換えています。","key":"hard to understand"},
{"id":"l4-fx-01","lv":4,"theme":"fx","lines":[{"s":"M","en":"So, what did everyone learn this week?"},{"s":"W","en":"For me, it's patience. I waited three days for my setup, and it finally came."},{"s":"M2","en":"Did it work?"},{"s":"W","en":"It did. But even if it hadn't, I'd still be happy I followed my rules."},{"s":"M2","en":"That's the hard part for me. I always jump in too early."},{"s":"M","en":"Maybe try writing your rules on a sticky note next to your screen."},{"s":"M2","en":"Ha, that's actually not a bad idea. I'll try it."}],"ja":"男性1:さて、今週はみんな何を学んだ?\n女性:私は忍耐かな。自分の形になるまで3日待って、やっと来たの。\n男性2:うまくいった?\n女性:うまくいったよ。でも、もしダメだったとしても、ルールを守れたことに満足してたと思う。\n男性2:僕にはそこが難しいんだ。いつも早く飛び乗っちゃう。\n男性1:ルールを付箋に書いて画面の横に貼ってみたら?\n男性2:はは、それ実は悪くないね。やってみるよ。","q":"What is the second man's weakness?","o":["He waits too long","He forgets to check the news","He trades too much money","He enters trades too soon"],"a":3,"why":"I always jump in too early(いつも早く飛び乗ってしまう)=エントリーが早すぎる、の言い換えです。","key":"jump in too early"},
{"id":"l4-stocks-01","lv":4,"theme":"stocks","lines":[{"s":"W","en":"Hi, and welcome back to Money Basics. Today's topic is something many beginners ask about: what is a dividend?"},{"s":"W","en":"Simply put, it's a part of a company's profit that is paid to its shareholders. Not every company pays one."},{"s":"W","en":"Young, fast-growing companies often use their profits to grow instead. So, a company without a dividend isn't necessarily a bad company."}],"ja":"こんにちは、「マネー・ベーシックス」へようこそ。今日のテーマは、初心者の方からよく聞かれる「配当とは何か」です。簡単に言うと、会社の利益の一部を株主に支払うものです。すべての会社が配当を出すわけではありません。若くて急成長している会社は、利益を成長のために使うことがよくあります。ですから、配当のない会社が必ずしも悪い会社というわけではありません。","q":"According to the speaker, why do some companies not pay dividends?","o":["They use profits to grow","They have no shareholders","They are always losing money","The law doesn't allow it"],"a":0,"why":"use their profits to grow instead(代わりに利益を成長に使う)と説明しています。","key":"use their profits to grow"},
{"id":"l4-tech-01","lv":4,"theme":"tech","lines":[{"s":"W","en":"Has anyone tried the new AI meeting notes tool?"},{"s":"M","en":"Yeah, I used it yesterday. It wrote a summary in seconds."},{"s":"M2","en":"Was it accurate?"},{"s":"M","en":"Mostly. It mixed up two people's names, though."},{"s":"W","en":"Hmm, so we'd still need someone to check it."},{"s":"M2","en":"Right. And what about private information? Where does the data go?"},{"s":"W","en":"Good question. Let's ask the IT team before we use it for client meetings."}],"ja":"女性:新しいAI議事録ツール、誰か使ってみた?\n男性1:うん、昨日使ったよ。数秒で要約を書いてくれた。\n男性2:正確だった?\n男性1:だいたいね。でも2人の名前を取り違えてた。\n女性:うーん、じゃあ結局誰かがチェックしないといけないね。\n男性2:そうだね。それに個人情報はどうなの?データはどこに行くの?\n女性:いい質問。お客さんとの会議で使う前に、IT担当に聞いてみよう。","q":"What will they probably do before using the tool with clients?","o":["Buy a better tool","Ask the IT team about data safety","Stop having meetings","Change people's names"],"a":1,"why":"Where does the data go?(データはどこへ?)を受けて ask the IT team(IT担当に聞く)と決めています。","key":"ask the IT team"},
{"id":"l4-space-01","lv":4,"theme":"space","lines":[{"s":"M","en":"Good evening, and welcome to the planetarium. Tonight, we'll travel from our own planet to the edge of the solar system."},{"s":"M","en":"Light from the Sun takes about eight minutes to reach Earth. But to reach Neptune, it takes about four hours."},{"s":"M","en":"Think about that: the Sun you see is always a little bit in the past. Now, please lean back and enjoy the show."}],"ja":"こんばんは、プラネタリウムへようこそ。今夜は私たちの惑星から太陽系の果てまで旅をします。太陽の光が地球に届くまでには約8分かかります。しかし、海王星に届くまでには約4時間かかります。考えてみてください。皆さんが見ている太陽は、いつも少しだけ過去の姿なのです。では、背もたれに寄りかかってショーをお楽しみください。","q":"What is the speaker's point about the Sun?","o":["It is getting smaller","Neptune is closer to it than Earth","We see the Sun as it was a short time ago","The Sun moves around the Earth"],"a":2,"why":"the Sun you see is always a little bit in the past(見ている太陽は少し過去の姿)の言い換えです。","key":"a little bit in the past"},
{"id":"l4-science-01","lv":4,"theme":"science","lines":[{"s":"W","en":"Okay, class, what happened to the plant we kept in the dark closet?"},{"s":"M","en":"It got really tall and thin, and kind of yellow."},{"s":"W2","en":"Wait, why did it grow taller without light?"},{"s":"W","en":"Good question. What do you think?"},{"s":"M","en":"Maybe it was trying to reach the light?"},{"s":"W","en":"Exactly. It used its energy to grow up, looking for sunlight."},{"s":"W2","en":"So the yellow color means it couldn't make enough food?"},{"s":"W","en":"That's right. Without light, it can't make chlorophyll, so it can't make food properly."}],"ja":"先生:はい、みんな。暗い戸棚に入れておいた植物はどうなりましたか。\n男子:すごく細長く伸びて、ちょっと黄色くなりました。\n女子:待って、光がないのにどうして背が伸びたんですか。\n先生:いい質問ですね。どう思いますか。\n男子:光に届こうとしていたのかな?\n先生:その通り。日光を探して、エネルギーを上に伸びることに使ったんです。\n女子:じゃあ、黄色いのは栄養を十分作れなかったということですか。\n先生:そうです。光がないと葉緑素が作れないので、栄養をきちんと作れないんです。","q":"Why did the plant grow tall and thin?","o":["It was searching for light","It got too much water","It was too cold","The closet was too small"],"a":0,"why":"looking for sunlight(日光を探して)伸びたと先生が説明しています。","key":"looking for sunlight"},
{"id":"l4-music-01","lv":4,"theme":"music","lines":[{"s":"M","en":"Okay, let's run it one more time. Mia, the intro felt a bit rushed."},{"s":"W","en":"Sorry, I think I was nervous. I'll slow down."},{"s":"M2","en":"Can I turn up my guitar a little? I can't hear myself."},{"s":"M","en":"Sure, but not too much. Last time, we couldn't hear the vocals."},{"s":"W","en":"Actually, maybe the drums could play softer instead?"},{"s":"M2","en":"Fair. Let's try that first."},{"s":"M","en":"Great. One, two, three, four..."}],"ja":"男性1:よし、もう1回通そう。ミア、イントロが少し走ってたよ。\n女性:ごめん、緊張してたみたい。ゆっくりにするね。\n男性2:ギター、少し上げてもいい?自分の音が聞こえないんだ。\n男性1:いいよ、でも上げすぎないで。前回はボーカルが聞こえなかったから。\n女性:というか、代わりにドラムを少し小さくしてもらうのはどう?\n男性2:確かに。まずそれを試そう。\n男性1:よし。ワン、ツー、スリー、フォー……","q":"What will they try first?","o":["Turning the guitar up a lot","Making the intro faster","Stopping practice for today","Having the drums play more quietly"],"a":3,"why":"the drums could play softer(ドラムを小さく)という案に Let's try that first(まずそれを試そう)と答えています。","key":"play softer"}
];

{"id":"q14","lv":4,"theme":"space","t":"プラネタリウムのガイドと宇宙の話","partner":"Planetarium guide","pv":"f",
 "intro":"プラネタリウムの上映が終わりました。ガイドさんが質問を受けつけています。気になることを聞いてみましょう。",
 "goal":"質問や感想を自分の言葉で伝えて、会話を楽しむ",
 "start":"n1",
 "nodes":{
  "n1":{"p":"Welcome! That was our evening sky show. Do you have any questions about what you saw?","ja":"ようこそ!今のが夜空の上映でした。ご覧になって、何か質問はありますか?",
   "ch":[
    {"en":"Yes. How far away is the Andromeda Galaxy?","go":"andro","keys":[["andromeda","galaxy","how far"]]},
    {"en":"Why do the stars look like they move across the sky?","go":"move","keys":[["move*","moving","across","rotat*","spin*"]]},
    {"en":"Honestly, I fell asleep halfway through.","go":"sleep","keys":[["asleep","sleep*","fell","dozed"]]}
   ]},
  "andro":{"p":"It's about two and a half million light-years away. So the light we see tonight left it long before modern humans existed.","ja":"約250万光年です。つまり今夜見える光は、現生人類が現れるずっと前にそこを出たものなんです。",
   "free":{"ja":"驚きを伝え、肉眼で見えるのか聞く","model":"That's mind-blowing. Can you see it with the naked eye?","alts":["Wow. Is it visible without a telescope?"],"keys":[["naked eye","without a telescope","see it","visible","binoculars"]],"hint":"Can you see it with the ~ eye?"},
   "go":"eye"},
  "eye":{"p":"You can, actually, from a dark place far from city lights. It looks like a faint, fuzzy patch.","ja":"実は見えますよ。街明かりから離れた暗い場所なら。ぼんやりとした淡い光のしみのように見えます。","go":"more"},
  "move":{"p":"Great question. The stars aren't really moving that way. It's the Earth rotating that makes them seem to move.","ja":"いい質問ですね。星そのものがそう動いているわけではありません。地球が自転しているから、動いて見えるんです。",
   "free":{"ja":"地球が回っているからだと、言い換えて確認する","model":"Oh, so it's because the Earth is spinning?","alts":["So the Earth turns, and the stars only seem to move?"],"keys":[["earth"],["spin*","rotat*","turn*"]],"hint":"So it's because the Earth is ~?"},
   "go":"polaris"},
  "polaris":{"p":"Exactly. And Polaris, the North Star, hardly seems to move at all, because it sits almost in line with Earth's axis.","ja":"そのとおりです。そして北極星はほとんど動いて見えません。地球の自転軸のほぼ延長線上にあるからです。","go":"more"},
  "sleep":{"p":"Ha, that happens more often than you'd think. The seats are very comfortable. Is there anything you're curious about?","ja":"ふふ、意外とよくあることですよ。座席がとても快適なので。何か気になることはありますか?",
   "free":{"ja":"星によって色が違うのはなぜか聞く","model":"Actually, I've always wondered why stars have different colors.","alts":["Why are some stars red and others blue?"],"keys":[["color*","colour*","red","blue"]],"hint":"I've always wondered why ~."},
   "go":"color"},
  "color":{"p":"It mostly depends on their surface temperature. Hotter stars look bluish, and cooler ones look reddish.","ja":"主に表面温度で決まります。熱い星は青っぽく、温度の低い星は赤っぽく見えるんです。","go":"more"},
  "more":{"p":"Is there anything else you'd like to know?","ja":"ほかに知りたいことはありますか?",
   "ch":[
    {"en":"Could you recommend a good place for stargazing around here?","go":"spot","keys":[["stargaz*","place","where","spot"]]},
    {"en":"Do you think there's life somewhere else in the universe?","go":"life","keys":[["life","alien*","living things","anyone out there"]]},
    {"en":"No, that's all. Thanks, this was fascinating.","go":"thanks","keys":[["that is all","thank*","nothing else","fascinating"]]}
   ]},
  "spot":{"p":"The hills north of town are pretty dark. Just avoid nights around the full moon.","ja":"町の北の丘はかなり暗いですよ。満月のころの夜だけは避けてくださいね。","end":true,
   "wrap":"I've always wondered ~.(ずっと~が気になっていた)/ Could you recommend ~? 質問を自然に切り出す表現です。"},
  "life":{"p":"Nobody knows yet, but scientists are searching. With so many stars and planets, many people find it hard to believe we're alone.","ja":"まだ誰にもわかりませんが、科学者たちが探しています。これほど多くの星や惑星があるので、私たちだけとは信じがたいと考える人は多いですね。",
   "free":{"ja":"自分も同じように感じると伝え、理由を一言そえる","model":"I feel the same way. The universe is just too big.","alts":["I agree. There are just so many planets out there."],"keys":[["same","agree","me too","i think so","feel","believe"]],"hint":"I feel the same way. The universe is ~."},
   "go":"thanks"},
  "thanks":{"p":"My pleasure. Thanks for coming, and enjoy the night sky!","ja":"どういたしまして。ご来場ありがとうございました。夜空を楽しんでくださいね!","end":true,
   "wrap":"That's mind-blowing. / I feel the same way. 感想や共感を伝えると、雑談がぐっと続きます。"}
 }}
];

{"id":"s-j1-07","g":"中1","t":"命令文と Let's","sub":"動詞から始めて「〜して」「〜しよう」","link":"g01",
 "pts":["主語を言わず<b>動詞の元の形で始める</b>と「〜しなさい・〜して」。","<b>Please</b> を付けると丁寧になります。","<b>Don't + 動詞</b> = 「〜しないで」。be動詞なら <b>Be ~</b>(Be quiet.)。","<b>Let's + 動詞</b> = 「〜しよう」。答えは Yes, let's. / Sorry, I can't."],
 "ex":[{"en":"Open your textbook.","ja":"教科書を開きなさい。"},{"en":"Don't run in the hallway.","ja":"廊下を走らないで。"},{"en":"Let's have lunch together.","ja":"一緒にお昼を食べましょう。"}],
 "q":[
  {"k":"fill","s":"____ careful. The floor is wet.","c":["Be","Are","Is","Do"],"a":0,"why":"careful(形容詞)の命令文は be動詞の元の形 Be で始めます。"},
  {"k":"fill","s":"____ use your phone in class.","c":["Not","Don't","No","Doesn't"],"a":1,"why":"「〜しないで」は Don't + 動詞。"},
  {"k":"fill","s":"Let's ____ tennis after school.","c":["plays","playing","play","to play"],"a":2,"why":"Let's のあとは動詞の元の形。"},
  {"k":"fill","s":"Please ____ down.","c":["sitting","sits","to sit","sit"],"a":3,"why":"命令文は動詞の元の形 sit。"},
  {"k":"fill","s":"Let's go to the park. — Yes, ____.","c":["I am","let's","it is","you do"],"a":1,"why":"Let's ~. に賛成するときは Yes, let's.。"},
  {"k":"order","ja":"ここで写真を撮らないでください。","en":"Please don't take pictures here."},
  {"k":"order","ja":"一緒に夕食を作りましょう。","en":"Let's make dinner together."},
  {"k":"write","ja":"窓を開けてください。","model":"Please open the window.","alts":["Open the window, please."],"keys":[["open"],["window*"]],"why":"動詞 open で始め、Please を付けて丁寧に。"},
  {"k":"write","ja":"遅れないでください。","model":"Don't be late.","alts":["Please don't be late."],"keys":[["do not be","never be"],["late"]],"why":"late は形容詞なので Don't be ~ の形。"},
  {"k":"meaning","en":"Let's take a break.","c":["休憩してもいいですか","休憩しなさい","休憩しましょう","休憩しないでください"],"a":2,"why":"Let's ~ = 〜しましょう。take a break = 休憩する。"}
 ]},
{"id":"s-j1-08","g":"中1","t":"助動詞 can","sub":"動詞に「できる」を足す","link":"g07",
 "pts":["<b>can + 動詞の元の形</b> = 「〜できる」。","主語が he・she でも can の形は同じ。動詞にも -s は付けません。","否定は <b>can't(cannot)</b>。疑問文は <b>Can ~?</b> と can を前に。","<b>Can you ~?</b> は「〜してくれますか」、<b>Can I ~?</b> は「〜してもいいですか」にもなります。"],
 "ex":[{"en":"She can speak three languages.","ja":"彼女は3つの言語を話せます。"},{"en":"I can't ride a bike.","ja":"私は自転車に乗れません。"},{"en":"Can I use this pen?","ja":"このペンを使ってもいいですか?"}],
 "q":[
  {"k":"fill","s":"She can ____ the guitar.","c":["plays","play","playing","played"],"a":1,"why":"can のあとは動詞の元の形。主語が She でも play。"},
  {"k":"fill","s":"I ____ read this kanji.","c":["can't","don't can","am not can","not can"],"a":0,"why":"can の否定は can't(cannot)。"},
  {"k":"fill","s":"____ you help me? — Sure.","c":["Are","Can","Is","Does"],"a":1,"why":"「手伝ってくれますか」は Can you ~?。"},
  {"k":"fill","s":"Can your brother drive? — No, he ____.","c":["doesn't","isn't","can't","don't"],"a":2,"why":"Can ~? には can / can't で答えます。"},
  {"k":"fill","s":"My dog can ____ very fast.","c":["runs","running","to run","run"],"a":3,"why":"can のあとは動詞の元の形 run。"},
  {"k":"order","ja":"あなたはイタリア料理を作れますか?","en":"Can you cook Italian food?"},
  {"k":"order","ja":"ここに座ってもいいですか?","en":"Can I sit here?"},
  {"k":"write","ja":"私の妹はとても速く泳げます。","model":"My sister can swim very fast.","alts":["My little sister can swim very fast.","My younger sister can swim really fast."],"keys":[["sister"],["can swim"]],"why":"can + swim。主語が3人称単数でも swims にしません。"},
  {"k":"write","ja":"私は今日、あなたに会えません。","model":"I can't see you today.","alts":["I can't meet you today.","I cannot meet you today."],"keys":[["can not see","can not meet"],["today"]],"why":"「〜できない」は can't + 動詞。"},
  {"k":"meaning","en":"Can you open the door?","c":["ドアを開けてもいいですか","ドアは開いていますか","ドアを開けましたか","ドアを開けてくれますか"],"a":3,"why":"Can you ~? は「〜してくれますか」というお願いにもなります。"}
 ]},
{"id":"s-j1-09","g":"中1","t":"現在進行形","sub":"「今まさに〜している」を映像で切り取る","link":"g02",
 "pts":["<b>be動詞 + 動詞の -ing</b> = 「(今)〜している」。","主語に合わせて am / is / are を使い分けます。否定は be動詞 + not、疑問文は be動詞を前に。","-ing の作り方:make → <b>making</b>、run → <b>running</b>、swim → <b>swimming</b>。","know・like など「状態」を表す動詞はふつう進行形にしません。"],
 "ex":[{"en":"I am cooking dinner now.","ja":"私は今、夕食を作っています。"},{"en":"They aren't watching TV.","ja":"彼らはテレビを見ていません。"},{"en":"What are you doing?","ja":"何をしているのですか?"}],
 "q":[
  {"k":"fill","s":"Look! The baby ____.","c":["sleep","sleeps","is sleeping","are sleeping"],"a":2,"why":"Look! で「今」の様子。The baby は単数なので is sleeping。"},
  {"k":"fill","s":"We are ____ for the bus.","c":["wait","waiting","waits","waited"],"a":1,"why":"are のあとは -ing で進行形。"},
  {"k":"fill","s":"My father is ____ in the pool.","c":["swiming","swim","swims","swimming"],"a":3,"why":"swim は m を重ねて swimming。"},
  {"k":"fill","s":"____ you studying now? — No, I'm not.","c":["Are","Do","Is","Does"],"a":0,"why":"進行形の疑問文は be動詞を前に。主語が you なので Are。"},
  {"k":"fill","s":"I ____ the answer.","c":["am knowing","knowing","know","am know"],"a":2,"why":"know は状態の動詞なので進行形にせず know。"},
  {"k":"order","ja":"彼女は今、電話で話しています。","en":"She is talking on the phone now."},
  {"k":"order","ja":"あなたは何を読んでいるのですか?","en":"What are you reading?"},
  {"k":"write","ja":"私は今、昼ごはんを食べています。","model":"I'm eating lunch now.","alts":["I'm having lunch now.","I am eating lunch now."],"keys":[["i am eating","i am having"],["lunch"]],"why":"am + eating で「今食べている」。"},
  {"k":"write","ja":"子どもたちは公園で遊んでいます。","model":"The children are playing in the park.","alts":["The kids are playing in the park."],"keys":[["children are playing","kids are playing"],["park"]],"why":"children は複数なので are playing。"},
  {"k":"meaning","en":"My brother isn't working today.","c":["兄は今日働いています","兄は今日は働いていません","兄は今日も働いていました","兄は今日働くつもりです"],"a":1,"why":"isn't working = 働いていない。"}
 ]},
{"id":"s-j1-10","g":"中1","t":"過去形(規則動詞・不規則動詞・was / were)","sub":"動詞の形で「もう終わったこと」を表す","link":"g03",
 "pts":["規則動詞は <b>-ed</b>(play → played、study → studied)。","不規則動詞は形が変わります(go → <b>went</b>、eat → <b>ate</b>、see → <b>saw</b>、buy → <b>bought</b>)。","否定は <b>didn't + 元の形</b>、疑問文は <b>Did ~ + 元の形?</b>","be動詞の過去は <b>was</b>(I・3人称単数)/ <b>were</b>(you・複数)。"],
 "ex":[{"en":"I visited my grandparents last Sunday.","ja":"私はこの前の日曜日、祖父母を訪ねました。"},{"en":"We didn't watch TV yesterday.","ja":"私たちは昨日テレビを見ませんでした。"},{"en":"Were you busy last week?","ja":"先週は忙しかったですか?"}],
 "q":[
  {"k":"fill","s":"I ____ to the library yesterday.","c":["go","goes","went","going"],"a":2,"why":"yesterday なので過去形。go の過去形は went。"},
  {"k":"fill","s":"She ____ a new bag last week.","c":["buyed","bought","buys","buy"],"a":1,"why":"buy の過去形は bought(不規則動詞)。"},
  {"k":"fill","s":"Did you ____ the movie?","c":["see","saw","seen","sees"],"a":0,"why":"Did のあとは動詞の元の形 see。"},
  {"k":"fill","s":"They ____ at home last night.","c":["was","are","be","were"],"a":3,"why":"They は複数で過去なので were。"},
  {"k":"fill","s":"We ____ eat breakfast this morning.","c":["didn't","don't","weren't","doesn't"],"a":0,"why":"this morning(今朝)の過去のことで、一般動詞の否定なので didn't。"},
  {"k":"order","ja":"私は昨日、宿題をしませんでした。","en":"I didn't do my homework yesterday."},
  {"k":"order","ja":"あなたは先週末どこへ行きましたか?","en":"Where did you go last weekend?"},
  {"k":"write","ja":"私は今朝6時に起きました。","model":"I got up at six this morning.","alts":["I woke up at six this morning.","I got up at 6 this morning."],"keys":[["got up","woke up"],["six"],["this morning"]],"why":"get up の過去形は got up。"},
  {"k":"write","ja":"昨日はとても寒かったです。","model":"It was very cold yesterday.","alts":["Yesterday was very cold.","It was really cold yesterday."],"keys":[["was"],["cold"],["yesterday"]],"why":"天気・寒さは It で表し、過去なので was。"},
  {"k":"meaning","en":"Were you at home last night?","c":["今夜は家にいますか","昨夜は家に帰りましたか","昨夜は家にいましたか","昨夜は家で何をしましたか"],"a":2,"why":"Were you at home ~? = 家にいましたか。last night = 昨夜。"}
 ]},
// ===== 中2 =====
{"id":"s-j2-01","g":"中2","t":"過去進行形","sub":"過去のある瞬間を写真のように切り取る","link":"g03",
 "pts":["<b>was / were + 動詞の -ing</b> = 「(その時)〜していた」。","過去のある時点で<b>途中だった動作</b>を表します。","when と相性がよい:I was taking a bath <b>when</b> you called.","否定は wasn't / weren't、疑問文は Was / Were を前に。"],
 "ex":[{"en":"I was watching TV at nine last night.","ja":"昨夜9時、私はテレビを見ていました。"},{"en":"They were playing soccer when it started to rain.","ja":"雨が降り出したとき、彼らはサッカーをしていました。"},{"en":"What were you doing then?","ja":"そのとき何をしていたのですか?"}],
 "q":[
  {"k":"fill","s":"I ____ dinner when you called me.","c":["was cooking","am cooking","cooking","were cooking"],"a":0,"why":"電話が来た過去の瞬間に途中だった動作。主語 I なので was cooking。"},
  {"k":"fill","s":"We ____ in the park at three yesterday.","c":["are walking","was walking","were walking","walk"],"a":2,"why":"昨日3時の途中の動作。We なので were walking。"},
  {"k":"fill","s":"What ____ you doing at that time?","c":["was","were","did","are"],"a":1,"why":"at that time(そのとき)で過去進行形。you なので were。"},
  {"k":"fill","s":"She wasn't ____ to music then.","c":["listen","listened","listens","listening"],"a":3,"why":"wasn't のあとは -ing。"},
  {"k":"fill","s":"____ it raining when you left home?","c":["Did","Is","Was","Were"],"a":2,"why":"過去進行形の疑問文。it なので Was。"},
  {"k":"order","ja":"私はそのとき本を読んでいました。","en":"I was reading a book then."},
  {"k":"order","ja":"あなたは昨夜10時に何をしていましたか?","en":"What were you doing at ten last night?"},
  {"k":"write","ja":"私が帰宅したとき、妹は眠っていました。","model":"My sister was sleeping when I got home.","alts":["When I got home, my sister was sleeping.","My little sister was sleeping when I came home."],"keys":[["sister was sleeping"],["when i got home","when i came home","when i came back","when i returned"]],"why":"帰宅した瞬間に途中だった動作なので was sleeping。"},
  {"k":"write","ja":"彼らはそのときテニスをしていました。","model":"They were playing tennis then.","alts":["They were playing tennis at that time."],"keys":[["were playing"],["tennis"]],"why":"They なので were + playing。"},
  {"k":"meaning","en":"It was snowing when I woke up.","c":["私が起きたあと雪が降り始めました","私が起きたとき雪が降っていました","雪が降っていたので私は起きました","私が起きたとき雪はやんでいました"],"a":1,"why":"was snowing = (その時)降っていた。"}
 ]},
{"id":"s-j2-02","g":"中2","t":"未来(will・be going to)","sub":"これから先のことを言う2つの道具","link":"g04",
 "pts":["<b>will + 元の形</b> = 「〜でしょう」「(その場で決めて)〜します」。","<b>be going to + 元の形</b> = 「〜するつもり」(前から決めていた予定)。","否定は <b>won't</b>(will not)/ be not going to。","疑問文は <b>Will you ~?</b> / <b>Are you going to ~?</b>"],
 "ex":[{"en":"It will be sunny tomorrow.","ja":"明日は晴れるでしょう。"},{"en":"I'm going to visit Osaka next week.","ja":"来週、大阪を訪れるつもりです。"},{"en":"I'll call you later.","ja":"あとで電話しますね。"}],
 "q":[
  {"k":"fill","s":"It ____ rain tomorrow.","c":["will","is","does","going"],"a":0,"why":"未来の予想で、後ろが元の形 rain なので will。"},
  {"k":"fill","s":"I'm going ____ my uncle this weekend.","c":["visit","to visit","visiting","visits"],"a":1,"why":"be going to + 元の形。"},
  {"k":"fill","s":"She will ____ busy next week.","c":["is","being","was","be"],"a":3,"why":"will のあとは元の形。is の元の形は be。"},
  {"k":"fill","s":"____ you going to join the party?","c":["Will","Do","Are","Did"],"a":2,"why":"be going to の疑問文は be動詞を前に。you なので Are。"},
  {"k":"fill","s":"I ____ be late. I promise.","c":["don't","am not","won't","isn't"],"a":2,"why":"後ろが元の形 be なので will not = won't。"},
  {"k":"order","ja":"私は来年カナダで勉強するつもりです。","en":"I'm going to study in Canada next year."},
  {"k":"order","ja":"彼は試験に合格するでしょう。","en":"He will pass the test."},
  {"k":"write","ja":"私は今夜、母に電話するつもりです。","model":"I'm going to call my mother tonight.","alts":["I will call my mother tonight.","I'm going to call my mom tonight."],"keys":[["going to call","will call","gonna call","going to phone","will phone"],["mother","mom"],["tonight"]],"why":"予定なので be going to + call。"},
  {"k":"write","ja":"明日はとても暑くなるでしょう。","model":"It will be very hot tomorrow.","alts":["It's going to be very hot tomorrow.","It'll be really hot tomorrow."],"keys":[["will be","going to be"],["hot"],["tomorrow"]],"why":"予想なので will be。hot の前に be を忘れずに。"},
  {"k":"meaning","en":"I'll carry your bag.","c":["あなたのかばんを持ちますよ","あなたのかばんを持っていました","あなたのかばんを持ってくれますか","あなたのかばんを持ってはいけません"],"a":0,"why":"I'll ~ はその場で決めた「〜しますよ」。"}
 ]},
{"id":"s-j2-03","g":"中2","t":"助動詞(must・have to・should・may)","sub":"動詞に「気持ち」や「ルール」を足す","link":"g07",
 "pts":["<b>must</b> / <b>have to</b> = 「〜しなければならない」。<b>must not</b> = 「〜してはいけない」。","<b>don't have to</b> = 「〜しなくてよい」(must not と意味がまったく違います)。","<b>should</b> = 「〜したほうがいい」。<b>may</b> = 「〜してもよい」「〜かもしれない」。","どれも後ろは<b>動詞の元の形</b>。have to は主語によって has to。"],
 "ex":[{"en":"You must wear a helmet.","ja":"ヘルメットをかぶらなければなりません。"},{"en":"I have to get up early tomorrow.","ja":"明日は早く起きなければなりません。"},{"en":"You should see a doctor.","ja":"医者にみてもらったほうがいいですよ。"}],
 "q":[
  {"k":"fill","s":"You ____ swim here. It's dangerous.","c":["mustn't","don't have to","may","can"],"a":0,"why":"危険なので「泳いではいけない」= mustn't。"},
  {"k":"fill","s":"Tomorrow is Sunday. You ____ get up early.","c":["must","don't have to","have to","should"],"a":1,"why":"日曜日なので「早起きしなくてよい」= don't have to。"},
  {"k":"fill","s":"She has ____ finish her report today.","c":["must","for","to","should"],"a":2,"why":"has to + 元の形 で「〜しなければならない」。"},
  {"k":"fill","s":"You look tired. You ____ go to bed early.","c":["mustn't","don't have to","may not","should"],"a":3,"why":"疲れているので「早く寝たほうがいい」= should。"},
  {"k":"fill","s":"____ I use your phone? — Of course.","c":["Am","Have","May","Was"],"a":2,"why":"許可を求める「〜してもいいですか」は May I ~?。"},
  {"k":"order","ja":"あなたはここで靴を脱がなければなりません。","en":"You have to take off your shoes here."},
  {"k":"order","ja":"あなたは今日、学校に行かなくてもいいです。","en":"You don't have to go to school today."},
  {"k":"write","ja":"あなたはもっと野菜を食べたほうがいいです。","model":"You should eat more vegetables.","alts":["You should eat more veggies."],"keys":[["should","had better","would better","ought to"],["more vegetables","more veggies"]],"why":"アドバイスは should + 元の形。"},
  {"k":"write","ja":"私は今日、宿題を終わらせなければなりません。","model":"I have to finish my homework today.","alts":["I must finish my homework today.","I've got to finish my homework today."],"keys":[["have to","must","have got to"],["finish","do","complete"],["homework"]],"why":"「〜しなければならない」は have to / must。"},
  {"k":"meaning","en":"You must not talk during the test.","c":["テスト中に話さなくてもいいです","テスト中に話したほうがいいです","テスト中に話すかもしれません","テスト中に話してはいけません"],"a":3,"why":"must not = 〜してはいけない(禁止)。"}
 ]},
{"id":"s-j2-04","g":"中2","t":"不定詞(名詞・副詞・形容詞的用法)","sub":"to + 動詞で「これから向かう動作」を表す","link":"g10",
 "pts":["形はいつも <b>to + 動詞の元の形</b>。","名詞的用法「〜すること」:I want <b>to read</b>. / My dream is <b>to travel</b>.","副詞的用法「〜するために」「〜して(気持ちの理由)」:I went there <b>to buy</b> milk. / I'm glad <b>to see</b> you.","形容詞的用法「〜するための・〜すべき」:something <b>to drink</b> / homework <b>to do</b>"],
 "ex":[{"en":"I want to be a doctor.","ja":"私は医者になりたいです。"},{"en":"She went to the library to study.","ja":"彼女は勉強するために図書館へ行きました。"},{"en":"I have nothing to do today.","ja":"今日はすることが何もありません。"}],
 "q":[
  {"k":"fill","s":"I want ____ a new computer.","c":["buy","buying","to buy","bought"],"a":2,"why":"want のあとは to + 元の形。"},
  {"k":"fill","s":"He went to the station ____ his friend.","c":["meet","to meet","met","meets"],"a":1,"why":"「友だちに会うために」は to meet(副詞的用法)。"},
  {"k":"fill","s":"Do you want something ____?","c":["drink","drinks","to drink","drank"],"a":2,"why":"「何か飲むもの」は something to drink(形容詞的用法)。"},
  {"k":"fill","s":"I was happy ____ the news.","c":["to hear","hear","heard","hears"],"a":0,"why":"「その知らせを聞いて」うれしい。感情の理由は to + 元の形。"},
  {"k":"fill","s":"My dream is ____ around the world.","c":["travel","travels","traveled","to travel"],"a":3,"why":"「旅行すること」は to travel(名詞的用法)。"},
  {"k":"order","ja":"私は数学を勉強するために早く起きました。","en":"I got up early to study math."},
  {"k":"order","ja":"東京には訪れるべき場所がたくさんあります。","en":"There are many places to visit in Tokyo."},
  {"k":"write","ja":"私は将来、先生になりたいです。","model":"I want to be a teacher in the future.","alts":["I want to become a teacher in the future.","In the future, I want to be a teacher."],"keys":[["want to be","want to become","would like to be","would like to become","hope to be","hope to become"],["teacher"]],"why":"「〜になりたい」は want to be ~。"},
  {"k":"write","ja":"私は本を借りるために図書館へ行きました。","model":"I went to the library to borrow a book.","alts":["I went to the library to borrow some books.","I went to the library to check out a book."],"keys":[["went to the library"],["to borrow","to check out","to get"],["book*"]],"why":"目的「〜するために」は to + 元の形。"},
  {"k":"meaning","en":"I have a lot of work to do today.","c":["今日は仕事をするのが大好きです","今日は仕事をするためにたくさん来ました","今日はやるべき仕事がたくさんあります","今日は仕事をたくさん終えました"],"a":2,"why":"work to do = やるべき仕事(形容詞的用法)。"}
 ]},
{"id":"s-j2-05","g":"中2","t":"動名詞","sub":"-ing で動作を「名詞」に変える","link":"g11",
 "pts":["動詞の <b>-ing</b> で「〜すること」(名詞のはたらき)。","文の主語にもなります:<b>Swimming</b> is fun.","<b>enjoy・finish・stop</b> のあとは -ing(× enjoy to ~)。","前置詞のあとも -ing:good at <b>cooking</b> / Thank you for <b>coming</b>."],
 "ex":[{"en":"I enjoy playing the guitar.","ja":"私はギターを弾くのを楽しんでいます。"},{"en":"Reading books is fun.","ja":"本を読むことは楽しいです。"},{"en":"She is good at drawing.","ja":"彼女は絵をかくのが得意です。"}],
 "q":[
  {"k":"fill","s":"I enjoyed ____ with you.","c":["talk","to talk","talking","talked"],"a":2,"why":"enjoy のあとは -ing。"},

{"id":"s-j3-08","g":"中3","t":"仮定法の基本(If I were ~ / I wish ~)","sub":"現実とちがう「もしも」","link":"g17",

{"id":"s-h1-02","g":"高1","t":"時制の注意点(状態動詞・時と条件の副詞節)","sub":"「未来なのに現在形」のルール","link":"g02",
 "pts":["<b>状態動詞</b>(know・like・have(持っている)・belong など)はふつう進行形にしません。","<b>時・条件の副詞節</b>(when・if・before・until など)の中は、未来のことでも<span class=\"mk\">現在形</span>。","ただし「~かどうか」の if(名詞節)は、未来なら will を使います。"],

 "q":[

  {"k":"fill","s":"If it ____ tomorrow, we will stay home.","c":["will rain","rains","rained","raining"],"a":1,"why":"条件の if の中は未来でも現在形。"},
  {"k":"fill","s":"This bag ____ to my sister.","c":["is belonging","belong","belongs","belonging"],"a":2,"why":"belong は状態動詞なので進行形にしません。主語が3人称単数なので belongs。"},
  {"k":"fill","s":"I don't know if he ____ tomorrow.","c":["come","will come","came","coming"],"a":1,"why":"この if は「~かどうか」(know の目的語)なので、未来は will を使います。"},

  {"k":"write","ja":"私の兄はギターを2本持っています。","model":"My brother has two guitars.","alts":["My older brother has two guitars.","My brother owns two guitars."],"keys":[["has","owns","has got"],["two guitars"]],"why":"「持っている」の have は状態動詞なので進行形にしません。"},
  {"k":"meaning","en":"I'll tell her when she comes back.","c":["彼女に戻ってくるように言います","彼女が戻ってきたら、彼女に伝えます","彼女が戻ってきたときに伝えました","彼女は戻ってくると言いました"],"a":1,"why":"when she comes back は時の副詞節で「戻ってきたら」。"}
 ]},
{"id":"s-h1-03","g":"高1","t":"過去完了・未来完了","sub":"基準の時点を過去・未来にずらした完了形","link":"g06",

 "q":[

  {"k":"fill","s":"By next April, I ____ lived here for ten years.","c":["will have","had","have","will"],"a":0,"why":"未来の時点(来年の4月)までの継続なので will have + 過去分詞。"},
  {"k":"fill","s":"She lost the watch her father ____ her.","c":["has given","gives","had given","will give"],"a":2,"why":"なくした(過去)より前にもらっていたので had given。"},

  {"k":"order","ja":"来週までにこの本を読み終えているでしょう。","en":"I will have finished this book by next week."},

  {"k":"write","ja":"明日の今ごろまでには、私はレポートを書き終えているでしょう。","model":"I will have finished my report by this time tomorrow.","alts":["I'll have finished writing my report by this time tomorrow."],"keys":[["will have finished","will have written","will have completed"],["report"],["by this time tomorrow","by tomorrow"]],"why":"未来の時点までの完了は will have + 過去分詞。"},
  {"k":"meaning","en":"I had lived in Osaka for five years before I came to Tokyo.","c":["東京に5年間住んでから、大阪に来ました","大阪に5年間住む予定です","東京に来てから5年がたちました","東京に来る前に、大阪に5年間住んでいました"],"a":3,"why":"had lived = 東京に来た(過去)時点までの継続。"}
 ]},
{"id":"s-h1-04","g":"高1","t":"助動詞 + have + 過去分詞","sub":"過去のことを「今」推測する・後悔する","link":"g08",

  {"k":"fill","s":"I failed the test. I ____ studied harder.","c":["must have","should have","can't have","may have"],"a":1,"why":"不合格だった後悔なので「もっと勉強すべきだった」= should have。"},
  {"k":"fill","s":"She ____ said that. She is always kind to everyone.","c":["must have","should have","can't have","will have"],"a":2,"why":"いつも親切な人なので「そんなことを言ったはずがない」= can't have。"},
  {"k":"fill","s":"I can't find my key. I ____ dropped it somewhere, but I'm not sure.","c":["must have","should have","can't have","might have"],"a":3,"why":"「確かではない」ので「~したかもしれない」= might have。"},
  {"k":"fill","s":"You look tired. You must have ____ late last night.","c":["stay up","stayed up","staying up","to stay up"],"a":1,"why":"must have のあとは過去分詞。"},

  {"k":"order","ja":"私たちはもっと早く出発すべきでした。","en":"We should have left earlier."},

  {"k":"write","ja":"あなたは私に本当のことを言うべきでした。","model":"You should have told me the truth.","alts":["You should've told me the truth."],"keys":[["should have","ought to have"],["told","said"],["truth"]],"why":"「~すべきだったのに」は should have + 過去分詞。"},
  {"k":"meaning","en":"He can't have finished the work so quickly.","c":["彼はそんなに早く仕事を終えられません","彼がそんなに早く仕事を終えたはずがありません","彼は仕事を早く終えたにちがいありません","彼は仕事を早く終えるべきでした"],"a":1,"why":"can't have + 過去分詞 = ~したはずがない(過去の推測)。"}
 ]},

  {"k":"write","ja":"彼女はその映画に興味があります。","model":"She is interested in the movie.","alts":["She's interested in that movie.","She is interested in the film."],"keys":[["interested in"],["movie","film"]],"why":"be interested in ~ で「~に興味がある」。"},
  {"k":"meaning","en":"The letter has just been sent.","c":["その手紙をちょうど送るところです","その手紙はまだ送られていません","その手紙はちょうど送られたところです","その手紙はもうすぐ届きます"],"a":2,"why":"has just been sent = ちょうど送られたところ(完了形の受け身)。"}
 ]},
{"id":"s-h1-06","g":"高1","t":"不定詞の発展(意味上の主語・too ~ to・enough to・完了不定詞)","sub":"to 不定詞の細かい使い方","link":"g10",

  {"k":"fill","s":"The question was easy enough for me ____.","c":["answer","answering","answered","to answer"],"a":3,"why":"enough for 人 to ~ の形。"},

  {"k":"meaning","en":"He seems to have lost his wallet.","c":["彼は財布をなくしそうです","彼は財布をなくしたようです","彼は財布をなくしたことがありません","彼は財布を探しているようです"],"a":1,"why":"seems to have lost = (以前に)なくしたようだ。"}

  {"k":"meaning","en":"Thank you for inviting me.","c":["私を招待してください","あなたを招待できてうれしいです","招待してくれてありがとう","招待するのを忘れていました"],"a":2,"why":"for + -ing で「~してくれたことに対して」。"}

{"id":"s-h1-08","g":"高1","t":"分詞の発展(知覚動詞・have / get + O + 過去分詞)","sub":"O が「する」のか「される」のか","link":"g12",

  {"k":"meaning","en":"I had my wallet stolen on the bus.","c":["バスで財布を盗みました","バスで財布を盗まれました","バスで財布を見つけてもらいました","バスに財布を置いてきました"],"a":1,"why":"have + O + 過去分詞は「O を~される」(被害)の意味にもなります。"}

{"id":"s-h1-09","g":"高1","t":"関係代名詞の発展(whose・what・前置詞 + 関係代名詞・非制限用法)","sub":"関係代名詞をもう一段深く","link":"g14",

{"id":"s-h2-08","g":"高2","t":"接続詞の発展(as long as・unless・whether・in case)","sub":"条件・備えを表す接続詞",

  {"k":"order","ja":"忘れるといけないので、書きとめておきなさい。","en":"Write it down in case you forget."},

{"id":"s-h3-01","g":"高3","t":"倒置","sub":"否定語が前に出ると疑問文の語順になる",

{"id":"s-h3-02","g":"高3","t":"強調構文(It is ~ that)","sub":"「〜なのは○○だ」とスポットライトを当てる",
