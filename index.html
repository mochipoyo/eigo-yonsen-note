// ===== speech: 読み上げ(speechSynthesis)と音声認識(SpeechRecognition) =====
const TTS={voices:[],ready:false};
function loadVoices(){if(!('speechSynthesis'in window))return;TTS.voices=speechSynthesis.getVoices().filter(v=>/^en[-_]/i.test(v.lang));TTS.ready=TTS.voices.length>0}
if('speechSynthesis'in window){loadVoices();speechSynthesis.onvoiceschanged=loadVoices}
const FEM=/female|samantha|victoria|karen|moira|tessa|fiona|serena|zira|susan|allison|ava|joanna|kendra|kimberly|salli|libby|sonia|natasha|jenny|aria|michelle|catherine|hazel|emma|olivia|amy|nicky|kate|martha|google us english$/i;
const MAL=/\bmale|daniel|alex\b|fred|david|mark|george|guy|ryan|william|james|thomas|oliver|arthur|aaron|gordon|rishi|brian|matthew|joey|justin|lee|tom\b|evan|reed|eddy|rocko/i;
const ACC={'en-US':'アメリカ','en-GB':'イギリス','en-AU':'オーストラリア','en-CA':'カナダ'};
function voicesFor(lang){const L=lang.toLowerCase().replace('_','-');let v=TTS.voices.filter(x=>x.lang.toLowerCase().replace('_','-').startsWith(L));return v}
let mixPick={};
function pickVoice(g,lang){
 if(!TTS.ready)loadVoices();
 if(lang==='mix'){const ls=Object.keys(ACC).filter(l=>voicesFor(l).length);lang=ls.length?ls[Math.floor(Math.random()*ls.length)]:'en-US'}
 let list=voicesFor(lang);if(!list.length)list=voicesFor('en-US');if(!list.length)list=TTS.voices;
 if(!list.length)return {voice:null,pitch:g==='m'?.85:1.05,lang};
 const pref=S.set.voice&&list.find(v=>v.name===S.set.voice);
 const isF=v=>FEM.test(v.name),isM=v=>!isF(v)&&MAL.test(v.name);
 // 品質の高い音声(Google, Natural, Enhanced, Premium)を優先
 const good=v=>/google|natural|enhanced|premium|neural/i.test(v.name)?1:0;
 const sorted=[...list].sort((a,b)=>good(b)-good(a));
 let v=g==='m'?sorted.find(isM):sorted.find(isF);
 if(!v&&pref)v=pref;
 if(!v)v=sorted[0];
 const pitch=(g==='m'&&!isM(v))?.8:(g==='f'&&isM(v))?1.2:1;
 return {voice:v,pitch,lang:v.lang||lang};
}
let speakId=0;
function speak(text,opt={}){
 return new Promise(res=>{
  if(!('speechSynthesis'in window)){toast('このブラウザは読み上げに未対応です');return res(false)}
  // 二重再生を防ぐ: 再生中・待ち行列があれば止めてから話す。マイクで聞いている間は聞き取りを止める(自分の声を拾わないように)
  if(speechSynthesis.speaking||speechSynthesis.pending)speechSynthesis.cancel();
  if(typeof recNow!=='undefined'&&recNow)stopListen();
  const id=++speakId;const u=new SpeechSynthesisUtterance(text.replace(/____/g,'blank'));
  const p=pickVoice(opt.g||'f',opt.lang||S.set.accent);
  if(p.voice)u.voice=p.voice;u.lang=p.lang;u.pitch=p.pitch;u.rate=(opt.slow?0.72:opt.fast?1.3:1)*S.set.rate;
  let done=false;const fin=()=>{if(done)return;done=true;clearTimeout(t);res(id===speakId)};
  u.onend=fin;u.onerror=fin;
  const t=setTimeout(fin,1500+text.length*120/u.rate);
  speechSynthesis.speak(u);
 });
}
function stopSpeak(){speakId++;if('speechSynthesis'in window)speechSynthesis.cancel()}
async function speakSeq(arr){// arr: [{text,g}]  — 途中で別の再生が始まったら止まる
 stopSpeak();const my=speakId;
 for(const a of arr){if(my!==speakId)return false;await speak(a.text,{g:a.g,lang:a.lang});if(my!==speakId)return false;await wait(a.gap||350)}
 return true;
}
const wait=ms=>new Promise(r=>setTimeout(r,ms));

// ---- 音声認識 ----
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
const canListen=!!SR;
let recNow=null;
// 音声認識。onStart(時刻) は話し始めを検知したとき呼ばれる(反応時間の計測用)。
// 二重起動を防ぐため、認識中は新しい認識を始めない。
function listen(onStart){
 return new Promise((res,rej)=>{
  if(!SR)return rej('unsupported');
  if(recNow)return rej('busy');
  stopSpeak();
  const r=new SR();recNow=r;r.lang=S.set.accent==='en-GB'?'en-GB':'en-US';r.interimResults=false;r.maxAlternatives=5;r.continuous=false;
  let got=null,conf=null;
  r.onspeechstart=()=>{onStart&&onStart(Date.now())};
  r.onresult=e=>{const alts=[];for(let i=0;i<e.results[0].length;i++)alts.push(e.results[0][i].transcript);got=alts;conf=e.results[0][0].confidence};
  r.onerror=e=>{if(recNow===r)recNow=null;rej(e.error||'error')};
  r.onend=()=>{if(recNow===r)recNow=null;got?res(Object.assign(got,{conf})):rej('no-speech')};
  try{r.start()}catch(e){recNow=null;rej('busy')}
 });
}
function stopListen(){if(recNow){try{recNow.abort?recNow.abort():recNow.stop()}catch(e){}recNow=null}}
const NUMW=['zero','one','two','three','four','five','six','seven','eight','nine','ten','eleven','twelve','thirteen','fourteen','fifteen','sixteen','seventeen','eighteen','nineteen','twenty'];
function normWords(s){
 s=s.toLowerCase().replace(/[’‘]/g,"'")
  .replace(/\bwon't\b/g,'will not').replace(/\bcan't\b/g,'can not').replace(/\bcannot\b/g,'can not').replace(/\bshan't\b/g,'shall not')
  .replace(/n't\b/g,' not').replace(/'re\b/g,' are').replace(/'m\b/g,' am').replace(/'ll\b/g,' will').replace(/'ve\b/g,' have').replace(/'d\b/g,' would')
  .replace(/\b(\d+)\b/g,(m,d)=>NUMW[+d]||d).replace(/%/g,' percent').replace(/&/g,' and ')
  .replace(/[^a-z0-9' ]+/g,' ').replace(/'s\b/g,'s').replace(/'/g,'');
 return s.split(/\s+/).filter(Boolean);
}
function lcsMatch(a,b){// a=expected words, b=heard words -> [lcsLen, hit flags for a]
 const n=a.length,m=b.length,dp=Array.from({length:n+1},()=>new Array(m+1).fill(0));
 for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)dp[i][j]=a[i]===b[j]?dp[i+1][j+1]+1:Math.max(dp[i+1][j],dp[i][j+1]);
 const hit=new Array(n).fill(false);let i=0,j=0;
 while(i<n&&j<m){if(a[i]===b[j]){hit[i]=true;i++;j++}else if(dp[i+1][j]>=dp[i][j+1])i++;else j++}
 return [dp[0][0],hit];
}
function scoreSpeech(expected,alts){
 const ew=normWords(expected);let best={score:0,heard:alts[0]||'',hit:ew.map(()=>false)};
 for(const h of alts){const hw=normWords(h);const [l,hit]=lcsMatch(ew,hw);const sc=Math.round(200*l/(ew.length+hw.length||1));if(sc>best.score)best={score:sc,heard:h,hit}}
 // 表示用: 元の単語ごとに当否(短縮形の展開で語数がずれる場合は全体スコアのみ)
 const ow=expected.split(/\s+/);let k=0;
 best.marks=ow.map(w=>{const n=normWords(w).length;const ok=n===0||best.hit.slice(k,k+n).every(Boolean);k+=n;return `<span class="${ok?'hit':'miss'}">${esc(w)}</span>`}).join(' ');
 return best;
}

// ---- キーワード判定(意味が通じるかの目安) ----
function wordHit(w,alt){return alt.endsWith('*')?w.startsWith(alt.slice(0,-1)):w===alt}
function hasSeq(words,alt){const a=String(alt).toLowerCase().split(/\s+/).filter(Boolean);
 for(let i=0;i+a.length<=words.length;i++){let ok=true;for(let k=0;k<a.length;k++)if(!wordHit(words[i+k],a[k])){ok=false;break}if(ok)return true}return false}
// it's / that's / he's などは「its」と「it is」の両方の形で照合する(どちらで書かれたキーでも一致するように)
const SUBJ_S=/\b(it|that|there|what|he|she|here|where|who|how)['’]s\b/gi;
function keysOk(text,keys){const w=normWords(text);const t2=String(text).replace(SUBJ_S,'$1 is').replace(/\blet['’]s\b/gi,'let us');const w2=t2!==text?normWords(t2):null;
 const hit=(keys||[]).map(g=>g.some(alt=>hasSeq(w,alt)||(w2&&hasSeq(w2,alt))));return {ok:hit.every(Boolean),hit,ratio:hit.length?hit.filter(Boolean).length/hit.length:1}}
function simScore(text,cands){// 模範解答との文字の一致度(0〜100)。発音の良さではない
 const hw=normWords(text);let best=0;for(const c of cands){const ew=normWords(c);const [l]=lcsMatch(ew,hw);best=Math.max(best,Math.round(200*l/(ew.length+hw.length||1)))}return best}

// ---- 録音(自分の声の確認用。端末の中だけで再生し、どこにも送信しない) ----
const canRecord=!!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia&&window.MediaRecorder);
let recStream=null,recorder=null;
async function recStart(){if(!canRecord)throw new Error('unsupported');if(recorder&&recorder.state==='recording')throw new Error('busy');
 recStream=await navigator.mediaDevices.getUserMedia({audio:true});const chunks=[];recorder=new MediaRecorder(recStream);
 recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};
 const done=new Promise(r=>{recorder.onstop=()=>{recStream&&recStream.getTracks().forEach(t=>t.stop());recStream=null;r(new Blob(chunks,{type:recorder.mimeType||'audio/webm'}))}});
 recorder.start();return done}
function recStop(){try{if(recorder&&recorder.state==='recording')recorder.stop()}catch(e){}if(recStream){recStream.getTracks().forEach(t=>t.stop());recStream=null}}
let playEl=null;
function playBlob(url){return new Promise(res=>{if(playEl){playEl.pause()}stopSpeak();playEl=new Audio(url);playEl.onended=()=>res(true);playEl.onerror=()=>res(false);playEl.play().catch(()=>res(false))})}
function stopAllAudio(){stopSpeak();stopListen();recStop();if(playEl){try{playEl.pause()}catch(e){}}}

 const cols=['#d9473b','#2a63c4','#1f8455','#ffe04a'];const P=Array.from({length:90},()=>({x:innerWidth/2,y:innerHeight*.35,vx:(Math.random()-.5)*12,vy:Math.random()*-12-3,r:Math.random()*6+3,c:cols[Math.floor(Math.random()*4)],a:Math.random()*6}));
 let f=0;(function tick(){c.clearRect(0,0,cv.width,cv.height);P.forEach(p=>{p.vy+=.35;p.x+=p.vx;p.y+=p.vy;p.a+=.2;c.save();c.translate(p.x,p.y);c.rotate(p.a);c.fillStyle=p.c;c.fillRect(-p.r/2,-p.r/4,p.r,p.r/2);c.restore()});if(++f<110)requestAnimationFrame(tick);else c.clearRect(0,0,cv.width,cv.height)})()}

function dayRec(d=today()){let r=S.days[d];if(!r){r=S.days[d]={xp:0,sec:0,said:0,free:0,ok:0,n:0,ins:0,ph:0,lis:0,sh:0,qst:0,rv:0,rd:-1}}
 return r}
let lastAct=0;
function activity(){// 操作と操作の間隔(最大60秒)を学習時間として数える
 const now=Date.now();if(lastAct&&now-lastAct<60000)dayRec().sec+=Math.round((now-lastAct)/1000);lastAct=now}

// m: モード, ok: 正解/通じた, ms: 反応時間, h: ヒント使用, r: 参照ID, f: 自力で作った発話か
function logEv(e){activity();const d=today();const rec=dayRec(d);
 const ev={d,m:e.m,ok:e.ok?1:0,ms:e.ms||0,h:e.h?1:0,r:e.r||'',f:e.f?1:0};
 // 同じ問題の二重記録を防ぐ(同じ参照IDの記録が直前1.5秒以内なら捨てる)
 const L=S.log[S.log.length-1];if(L&&L.r&&L.r===ev.r&&L.m===ev.m&&Date.now()-(S._lastLogAt||0)<1500)return;
 S._lastLogAt=Date.now();S.log.push(ev);if(S.log.length>3000)S.log.splice(0,S.log.length-3000);
 rec.n++;if(ev.ok)rec.ok++;if(ev.f){rec.free++}
 if(rec[e.m]!=null)rec[e.m]++;
 checkQuests();save()}

// ---- 間隔反復(フレーズ・単語共通の考え方) ----
// 箱 0〜5。思い出して言えた → 1つ上へ。ヒントあり → 箱は上げず短い間隔。答えを見た/言えない → 箱1から。
const SRS_GAP=[0,1,3,7,16,35];
function srsUpdate(st,res){// res: {recall:bool, hint:bool, ms:number}
 st=st||{b:0,due:today(),n:0};st.n=(st.n||0)+1;st.last=today();
 if(res.recall&&!res.hint){st.b=Math.min(5,(st.b||0)+1);let g=SRS_GAP[st.b];
  if(res.ms&&res.ms<3000)g=Math.round(g*1.25);else if(res.ms>8000)g=Math.max(1,Math.round(g*0.7));
  st.due=dayPlus(Math.max(1,g));st.streak=(st.streak||0)+1}
 else if(res.recall&&res.hint){st.b=Math.max(1,Math.min(st.b||0,2));st.due=dayPlus(Math.max(1,Math.round(SRS_GAP[st.b]*0.6)));st.streak=0}
 else{st.b=1;st.due=dayPlus(1);st.streak=0}
 return st}

// ---- 分析 ----
function rate(evs){return evs.length?evs.filter(e=>e.ok).length/evs.length:null}
const median=a=>{if(!a.length)return null;const b=[...a].sort((x,y)=>x-y);return b[Math.floor(b.length/2)]};
function metrics(since){
 const L=since?S.log.filter(e=>e.d>=since):S.log;
 const last=(ms,n)=>L.filter(e=>ms.includes(e.m)).slice(-n);
 const sp=last(SPEAK_MODES,80);
 const phs=Object.values(S.ph);
 const days7=[...Array(7)].map((_,i)=>dayPlus(-i));
 let rvDone=0,rvDue=0;days7.forEach(d=>{const r=S.days[d];if(r&&r.rd>0){rvDue+=r.rd;rvDone+=Math.min(r.rv,r.rd)}});
 return {
  listen:rate(last(['lis','p2','p3'],80)),
  produce:sp.length?sp.filter(e=>e.ok&&e.f&&!e.h).length/sp.length:null,
  speed:median(sp.filter(e=>e.ms>0).map(e=>e.ms)),
  retain:phs.length?phs.filter(p=>p.b>=4).length/phs.length:null,
  grammar:rate(last(['gram','p5','p6','sch'],80)),
  review:rvDue?rvDone/rvDue:null,
  nohint:sp.length?sp.filter(e=>!e.h).length/sp.length:null,
  nSpeak:sp.length};
}
// 英会話レベル(経験値ではなく、話す・聞く力の実績から決める)
const TALK_TITLES=[{n:'あいさつ',d:'まずは英語を口に出すところから'},{n:'ひとこと',d:'短い返事が言える'},{n:'やりとり',d:'簡単な質問に答えられる'},{n:'日常会話',d:'身近な話題で会話を続けられる'},{n:'意見が言える',d:'理由をつけて考えを話せる'},{n:'議論ができる',d:'ヒントなしで素早く話せる'}];
function talkLevel(){const m=metrics();const n=m.nSpeak;
 if(n<10)return 0;
 let s=0;const p=m.produce||0,l=m.listen??0.5,sp=m.speed||9000,nh=m.nohint||0;
 s+=p*3+l*1.2+nh*1.2+(sp<3000?1.2:sp<5000?0.8:sp<8000?0.4:0)+Math.min(1,n/200);
 return Math.max(1,Math.min(5,Math.floor(s)))}

// ---- 日替わりクエスト・週間チャレンジ ----
const DQ_POOL=[
 {id:'ins5',n:'瞬間英会話を5問',k:'ins',goal:5},{id:'ph',n:'フレーズ復習を3つ',k:'ph',goal:3},{id:'lis5',n:'耳から英語を5問',k:'lis',goal:5},
 {id:'sh5',n:'シャドーイングで5文',k:'sh',goal:5},{id:'qst1',n:'会話クエストに1回挑戦',k:'qst',goal:1},{id:'free5',n:'自分の言葉で5回話す',k:'free',goal:5},
 {id:'said10',n:'声に出して10回',k:'said',goal:10}];
function ensureQuests(){const d=today();
 if(!S.dq||S.dq.d!==d){// 日付から決まる3つ(毎日入れ替わり)
  const seed=+d.replace(/-/g,'');const pool=[...DQ_POOL];const pickd=[];let x=seed;
  while(pickd.length<3){x=(x*9301+49297)%233280;const i=x%pool.length;pickd.push(pool.splice(i,1)[0].id)}
  S.dq={d,ids:pickd,done:{}}}
 const wk=weekKey();if(!S.wk||S.wk.w!==wk)S.wk={w:wk,done:{}}}
function weekKey(){const d=new Date();const day=(d.getDay()+6)%7;d.setDate(d.getDate()-day);return ymd(d)}
function weekDays(){const w=weekKey();return [...Array(7)].map((_,i)=>{const d=new Date(w);d.setDate(d.getDate()+i);return ymd(d)})}
const WK=[{id:'days4',n:'今週4日以上学習する',goal:4,val:()=>weekDays().filter(d=>S.days[d]&&S.days[d].n>0).length},
 {id:'free30',n:'今週、自分の言葉で30回話す',goal:30,val:()=>weekDays().reduce((s,d)=>s+((S.days[d]||{}).free||0),0)}];
function dqVal(q){const r=dayRec();return q.k==='said'?(r.said||0):(r[q.k]||0)}

 S.dq.ids.forEach(id=>{const q=DQ_POOL.find(x=>x.id===id);if(q&&!S.dq.done[id]&&dqVal(q)>=q.goal){S.dq.done[id]=1;S.xp+=15;dayRec().xp+=15;setTimeout(()=>toast('きょうのクエスト達成:'+q.n+' +15 XP','lvup'),300);

// ===== ai: 自分で用意したバックエンド経由でAIを使う(未設定ならAI機能だけ使えない) =====
// APIの秘密鍵はこのページには置かない。ここに入れるのは、利用者が自分で立てたバックエンドのURLと、
// そのバックエンド専用の合言葉(アクセストークン)だけ。backend/ フォルダに Cloudflare Workers 用の例がある。
const aiReady=()=>!!(S.ai&&/^https:\/\/[^\s]+$/i.test(S.ai.url||''));
let aiBusy=false;
async function aiCall(path,body,timeoutMs=25000){
 if(!aiReady())throw new Error('AIのバックエンドが設定されていません。');
 if(aiBusy)throw new Error('前の返事を待っています。');
 aiBusy=true;const ctl=new AbortController();const t=setTimeout(()=>ctl.abort(),timeoutMs);
 try{
  const url=S.ai.url.replace(/\/+$/,'')+'/'+path;
  const r=await fetch(url,{method:'POST',headers:{'content-type':'application/json',...(S.ai.token?{'authorization':'Bearer '+S.ai.token}:{})},body:JSON.stringify(body),signal:ctl.signal});
  if(r.status===401||r.status===403)throw new Error('アクセストークンが正しくありません(設定を確認してください)。');
  if(r.status===429)throw new Error('利用回数の上限に達しました。しばらくしてから試してください。');
  if(!r.ok)throw new Error('AIサーバーでエラーが起きました(HTTP '+r.status+')。');
  const j=await r.json();if(j&&j.error)throw new Error(String(j.error).slice(0,200));return j;
 }catch(e){if(e.name==='AbortError')throw new Error('AIの返事が時間内に届きませんでした。');throw e}
 finally{clearTimeout(t);aiBusy=false}
}

  if(opt.timeLimit){const T=opt.timeLimit;const tick=()=>{const s0=opt.startAt?opt.startAt():null;if(!s0){$('#ab-timer').textContent='';return}
    const left=Math.max(0,T-(Date.now()-s0)/1000);$('#ab-timer').textContent='残り '+left.toFixed(0)+' 秒';$('#ab-timer').classList.toggle('late',left<=0);if(left<=0)$('#ab-timer').textContent='時間切れ(答えてOK)'};timer=setInterval(tick,250)}
  const h=$('#ab-hint');if(h)h.onclick=()=>{hint=true;$('#ab-h').innerHTML=`<div class="hintbox">${opt.hintHtml}</div>`;h.disabled=true;opt.onHint&&opt.onHint()};

  const send=()=>{const t=inp.value.trim();if(!t)return;const s0=start();fin({text:t,alts:[t],typed:true,ms:s0&&firstKey?Math.max(0,firstKey-s0):0})};
  $('#ab-send').onclick=send;

   if(mb.classList.contains('on')){stopListen();return}
   mb.classList.add('on');$('#ab-st').textContent='聞いています…';$('#ab-sub').textContent='もう一度押すと止まります';
   let spokeAt=null;
   try{const alts=await listen(t=>{spokeAt=t});mb.classList.remove('on');
    const s0=start();fin({text:alts[0],alts:[...alts],conf:alts.conf,ms:s0&&spokeAt?Math.max(0,spokeAt-s0):0});
   }catch(err){mb.classList.remove('on');$('#ab-st').textContent='マイクを押して英語で答える';
    const m={'not-allowed':'マイクが許可されていません。ブラウザの設定で許可するか、キーボードで答えてください。','service-not-allowed':'このページでは音声認識が使えません。キーボードで答えてください。','no-speech':'声が聞き取れませんでした。もう一度どうぞ。','audio-capture':'マイクが見つかりません。キーボードで答えてください。','network':'音声認識にはネット接続が必要です。','busy':'音声認識が動作中です。少し待ってからもう一度。','aborted':'止めました。'}[err]||'うまく聞き取れませんでした。もう一度どうぞ。';

// 答えの評価。spec: {model, alts, keys, loose, free(=ヒントなしの自由回答か)}
// meaning: ok(通じる) / part(一部) / ng(通じにくい) / free(質問には答えていそう) / none(無回答)
function evalAnswer(res,spec){
 if(res.gaveUp||!res.text)return {meaning:'none',match:0,ms:0,hint:res.hint,heard:''};
 const cands=[spec.model,...(spec.alts||[])].filter(Boolean);
 let best={ok:false,ratio:0};for(const t of (res.alts||[res.text])){const k=keysOk(t,spec.keys||[]);if(k.ok||k.ratio>best.ratio){best=k;best.text=t;if(k.ok)break}}
 const heard=best.text||res.text;
 const match=simScore(heard,cands);
 let meaning=best.ok?'ok':best.ratio>=0.5?'part':'ng';
 if(meaning!=='ok'&&spec.free&&spec.loose){const w=normWords(heard);const lw=w.filter(x=>spec.loose.some(a=>wordHit(x,a))).length;if(w.length>=3&&lw>=1)meaning='free'}
 if(match>=85&&meaning!=='ok')meaning='ok';
 return {meaning,match,ms:res.ms||0,hint:!!res.hint,heard,typed:!!res.typed,conf:res.conf}
}
const MEAN={ok:['通じる','good'],free:['答えになっていそう','good'],part:['一部通じる',''],ng:['通じにくい','bad'],none:['回答なし','bad']};
// 4つの評価を分けて表示(発音の評価ではないことを明記)

 return `<div class="chips">
  <span class="chip ${MEAN[ev.meaning][1]}"><small>意味</small>${MEAN[ev.meaning][0]}${ev.ai?' <small>(AI判定)</small>':''}</span>
  <span class="chip"><small>模範解答との一致</small>${ev.meaning==='none'?'—':ev.match+'%'}</span>
  <span class="chip ${fast}"><small>反応</small>${sec}</span>
  <span class="chip ${ev.hint?'':'good'}"><small>ヒント</small>${ev.hint?'使った':'なし'}</span>
 </div>
 ${ev.heard?`<div class="heardline"><small>${ev.typed?'入力した英語':'聞き取られた英語'}:</small> <span class="en">${esc(ev.heard)}</span></div>`:''}

VIEWS.review=function(app){
 const items=S.miss.map(missToItem).filter(Boolean);
 if(!items.length){app.innerHTML=`<div class="row">${backBtn('TOEIC対策コース',{name:'toeicc'})}</div><section class="sheet panel"><p>まちがいノートは空です。</p></section>`;return wireGo(app)}
 startQuiz({title:'まちがいノートの復習',back:{name:'toeicc'},backLabel:'TOEIC対策コース',items:pick(items,10),xp:8,mode:'gram',retry:()=>go({name:'review'})});
};
function missToItem(r){
 if(r.t==='g'){const u=gById(r.u);const q=u&&u.q[r.i];if(!q)return null;return gramItem(u,q,r.i)}
 if(r.t==='p5'){const q=P5[r.i];if(!q)return null;return p5Item(q,r.i)}
 if(r.t==='p2'){const q=P2[r.i];if(!q)return null;return p2Item(q,r.i)}
 if(r.t==='s'){const u=sById(r.u);const q=u&&u.q[r.i];if(!q||(q.k!=='fill'&&q.k!=='meaning'))return null;
  return q.k==='fill'?{s:blankify(q.s),c:q.c,a:q.a,why:q.why,ref:r,label:u.g+' '+u.t,review:blankify(q.s)}:{s:esc(q.en),c:q.c,a:q.a,why:q.why,ref:r,label:u.g+' '+u.t,jaOpt:true,oneCol:true,review:esc(q.en)}}
 return null;
}

VIEWS.gram=function(app){

 const step=V.step||0;
 const steps=['イメージ','並べかえ','チャレンジ'];
 const done=[!!S.gRead[u.id],!!S.gBuild[u.id],S.gStars[u.id]>=1];
 app.innerHTML=`
 <div class="row">${backBtn('文法の一覧',{name:'grams'})}</div>
 <div class="uhead"><div class="row">${lvTag(u.lv)}<span class="gtag">${esc(u.cat)}</span></div><h1>${esc(u.t)}</h1></div>
 <div class="steps" role="tablist">${steps.map((s,i)=>`<button class="step" role="tab" data-s="${i}" aria-selected="${i===step}"><small>STEP ${i+1}</small>${s}${done[i]?'<span class="ck">✓</span>':''}</button>`).join('')}</div>
 <section class="sheet panel" id="gp"></section>`;
 wireGo(app);
 app.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>go({name:'gram',id:u.id,step:+b.dataset.s},true));
 const P=app.querySelector('#gp');
 if(step===0){
  P.innerHTML=`
   <div class="one">${esc(u.sub)}</div>

   <div class="blk"><h3>例文(タップで発音)</h3><div class="exs">${u.ex.map(e=>`<div class="ex">${sayBtn(e.en)}<div><div class="e en">${esc(e.en)}</div>${jaD(esc(e.ja))}${e.note?`<div class="n">${e.note}</div>`:''}</div></div>`).join('')}</div></div>

   ${u.talk?`<div class="blk"><h3>会話でそのまま使える</h3><div class="ex">${sayBtn(u.talk.en,'m')}<div><div class="e en"><span class="mk">${esc(u.talk.en)}</span></div>${jaD(esc(u.talk.ja))}</div></div></div>`:''}
   <div class="next"><button class="btn hl" id="nx">並べかえに進む →</button></div>`;
  wireSay(P);wireJa(P);
  if(!S.gRead[u.id]){S.gRead[u.id]=today();addXP(5)}
  P.querySelector('#nx').onclick=()=>go({name:'gram',id:u.id,step:1},true);
 }else if(step===1){buildView(P,u)}
 else{
  P.innerHTML=`<div class="one">チャレンジ:5問</div><p>TOEIC Part 5 と同じ「空所に入る語句を選ぶ」形式です。空所の前後にヒントが隠れています。満点で星3つ。</p><div class="next"><button class="btn hl" id="go">はじめる</button></div>`;

function gramQuiz(u){
 const qs=pick(u.q.map((q,i)=>({q,i})),5);
 startQuiz({title:u.t+' のチャレンジ',mode:'gram',back:{name:'gram',id:u.id,step:2},backLabel:'単元にもどる',items:qs.map(({q,i})=>gramItem(u,q,i)),
  onEnd:r=>{S.gStars[u.id]=Math.max(S.gStars[u.id]||0,r.stars)},retry:()=>gramQuiz(u)});
}
function buildView(P,u){
 let k=0,tries=0;
 const draw=()=>{
  const b=u.build[k];const words=b.en.split(/\s+/);const pool=shuffle(words.map((w,i)=>({w,i})));
  // 同じ並びのままにならないように
  if(pool.every((p,i)=>p.i===i)&&pool.length>1)pool.reverse();
  let picked=[];
  P.innerHTML=`<div class="qhead"><span>並べかえ ${k+1} / ${u.build.length}</span><span>${sayBtn(b.en,'f')}</span></div>
   <div class="bq">${esc(b.ja)}</div>
   <div class="slot" id="slot" aria-label="ここに並べる"></div>
   <div class="pool" id="pool">${pool.map((p,j)=>`<button class="tile" data-j="${j}">${esc(p.w)}</button>`).join('')}</div>
   <div id="bfb"></div>
   <div class="next"><button class="btn ghost" id="clr">やり直す</button><button class="btn hl" id="chk" disabled>答え合わせ</button></div>
   <p class="note" style="margin-top:14px">タイルをタップして英文を組み立てましょう。並べた単語をタップすると戻せます。スピーカーのボタンで正解の音声も聞けます(答えを見る代わりにどうぞ)。</p>`;
  wireSay(P);
  const slot=P.querySelector('#slot'),poolEl=P.querySelector('#pool'),chk=P.querySelector('#chk');
  const upd=()=>{slot.innerHTML=picked.map((j,x)=>`<button class="tile" data-x="${x}">${esc(pool[j].w)}</button>`).join('');
   poolEl.querySelectorAll('.tile').forEach(t=>t.classList.toggle('used',picked.includes(+t.dataset.j)));
   slot.querySelectorAll('.tile').forEach(t=>t.onclick=()=>{picked.splice(+t.dataset.x,1);slot.className='slot';upd()});
   chk.disabled=picked.length!==words.length};
  poolEl.querySelectorAll('.tile').forEach(t=>t.onclick=()=>{const j=+t.dataset.j;if(picked.includes(j))return;picked.push(j);upd()});
  P.querySelector('#clr').onclick=()=>{picked=[];slot.className='slot';upd()};
  chk.onclick=()=>{const s=picked.map(j=>pool[j].w).join(' ');const ok=s===b.en;
   if(!ok){tries++;slot.className='slot ng';
    P.querySelector('#bfb').innerHTML=`<p class="bad" style="margin-top:10px">${tries>=2?`正解は <span class="en good">${esc(b.en)}</span>`:'語順がちがうようです。もう一度!'}</p>`;
    if(tries>=2){chk.textContent='つぎへ';chk.disabled=false;chk.onclick=next}return}
   slot.className='slot ok';S.answered++;S.correct++;addXP(tries?5:10);
   P.querySelector('#bfb').innerHTML=`<div class="fb ok" style="margin-top:12px">${hana}<div><div class="verdict">正解!</div><div class="en">${esc(b.en)}</div></div></div>`;
   speak(b.en);chk.textContent=k+1<u.build.length?'つぎへ →':'チャレンジへ →';chk.onclick=next;
  };
  upd();
 };
 const next=()=>{k++;tries=0;if(k<u.build.length)draw();else{S.gBuild[u.id]=today();save();go({name:'gram',id:u.id,step:2},true)}};
 draw();
}

// 声に出して練習するパネル。onDone(score|null) を呼ぶ
function micPanel(el,text,onDone,opt={}){
 el.innerHTML=`<div class="mic">
  <div class="row" style="width:100%"><b>声に出して言ってみよう</b><span class="sp"></span>${sayBtn(text,'f')}<button class="say" data-say="${esc(text)}" data-slow="1" aria-label="ゆっくり読み上げ">${IC.slow}</button></div>
  <div class="heard en" id="tgt" style="font-size:17px">${esc(text)}</div>
  <div class="row">${canListen?`<button class="micbtn" id="mb" aria-label="話す">${IC.mic}</button><small id="ms">マイクを押して話してください</small>`:`<button class="btn" id="selfok">言えた!</button><small>声に出して言ってから押してください</small>`}</div>
  <div id="mr"></div>
  <div class="row"><button class="btn ghost sm" id="skip">${opt.skipLabel||'スキップ'}</button></div>
 </div>`;
 wireSay(el);
 let best=null;
 const fin=sc=>{onDone(sc)};
 el.querySelector('#skip').onclick=()=>fin(best);
 const so=el.querySelector('#selfok');if(so)so.onclick=()=>{S.said++;dayRec().said++;addXP(3);onDone(null,'self')};
 const mb=el.querySelector('#mb');if(!mb)return;
 mb.onclick=async()=>{
  if(mb.classList.contains('on')){stopListen();return}
  mb.classList.add('on');el.querySelector('#ms').textContent='聞いています… 話し終えたら自動で止まります';
  try{const alts=await listen();mb.classList.remove('on');
   const r=scoreSpeech(text,alts);S.said++;dayRec().said++;if(r.score>=80)S.saidGood++;
   const gain=r.score>=80?10:r.score>=60?6:3;addXP(gain);
   best=Math.max(best||0,r.score);
   el.querySelector('#tgt').innerHTML=r.marks;
   el.querySelector('#ms').textContent='もう一度話すこともできます';
   el.querySelector('#mr').innerHTML=`<div class="meter"><span style="width:${r.score}%"></span></div>
    <p style="margin:6px 0"><b class="${r.score>=80?'good':r.score>=60?'':'bad'}">${r.score>=90?'バッチリ伝わります!':r.score>=80?'よく言えています!':r.score>=60?'だいたい伝わります。赤い単語をもう一度。':'聞き取れなかった単語があります。お手本を聞いてもう一度。'}</b> <small>英文の一致度 ${r.score}% ・ +${gain} XP</small></p><small class="muted">一致度は文字起こしとお手本の比較で、発音の採点ではありません。</small><br>
    <small>聞き取られた英語:<span class="en">${esc(r.heard)}</span></small>`;
   el.querySelector('#skip').textContent=opt.doneLabel||'つぎへ →';el.querySelector('#skip').classList.remove('ghost');el.querySelector('#skip').classList.add('hl');
  }catch(err){mb.classList.remove('on');
   const m={'not-allowed':'マイクの使用が許可されていません。ブラウザの設定でマイクを許可してください。','service-not-allowed':'このページでは音声認識が使えません。','no-speech':'声が聞き取れませんでした。もう一度どうぞ。','audio-capture':'マイクが見つかりません。','network':'音声認識にネット接続が必要です。','unsupported':'このブラウザは音声認識に未対応です。'}[err]||'うまく聞き取れませんでした。もう一度どうぞ。';
   el.querySelector('#ms').textContent=m;
   if(err==='not-allowed'||err==='service-not-allowed'||err==='audio-capture'){el.querySelector('#mr').innerHTML='<button class="btn sm" id="selfok2">声に出して言えた(自己判定)</button>';el.querySelector('#selfok2').onclick=()=>{S.said++;dayRec().said++;addXP(3);onDone(null,'self')}}
  }
 };
}

function rolePlay(P,t){
 const R={i:0,first:0,turns:0,scores:[],xp0:S.xp};
 P.innerHTML=`<div class="row" style="margin-bottom:12px"><small>相手:<b class="en">${esc(t.partner)}</b> ・ あなた:<b>You</b></small><span class="sp"></span><button class="btn ghost sm" id="rp-re">${IC.redo}最初から</button></div>
  <div class="chat" id="chat"></div><div id="turn" style="margin-top:14px"></div>`;
 P.querySelector('#rp-re').onclick=()=>go({name:'talk',id:t.id,step:1},true);
 const chat=P.querySelector('#chat'),turn=P.querySelector('#turn');
 const bubble=(who,en,ja)=>{const d=document.createElement('div');d.className='bub '+(who==='me'?'me':'p');const hide=who!=='me'&&S.set.hideEn;
  d.innerHTML=`<div class="who">${who==='me'?'You':esc(t.partner)} ${sayBtn(en,who==='me'?'f':t.pv)}</div><div class="e en ${hide?'jh':''}">${esc(en)}</div>${ja?jaD(esc(ja)):''}`;
  chat.appendChild(d);wireSay(d);wireJa(d);d.scrollIntoView({block:'nearest',behavior:'smooth'});return d};
 const step=async()=>{
  if(R.i>=t.lines.length)return finish();
  const L=t.lines[R.i];
  if(L.who==='p'){bubble('p',L.en,L.ja);turn.innerHTML=`<p class="row"><small>相手が話しています…</small><button class="btn ghost sm" id="skipv">先へ</button></p>`;
   let skipped=false;turn.querySelector('#skipv').onclick=()=>{skipped=true;stopSpeak();R.i++;step()};
   await speak(L.en,{g:t.pv});if(skipped)return;await wait(250);if(skipped)return;R.i++;return step()}
  // あなたの番

function runQuest(P,q){
 const R={mode:questMode(),freeOk:0,freeNg:0,turns:0,path:[],xp0:S.xp};
 P.innerHTML=`<div class="row" style="margin-bottom:10px"><small>相手:<b class="en">${esc(q.partner)}</b> ・ 返事:<b>${R.mode==='free'?'自分の言葉だけ':'選択肢あり'}</b></small><span class="sp"></span><button class="btn ghost sm" id="qr">${IC.redo}最初から</button></div>

 const chat=P.querySelector('#chat'),turn=P.querySelector('#turn');

  chat.appendChild(d);wireSay(d);wireJa(d);d.scrollIntoView({block:'nearest',behavior:'smooth'})};
 const partner=async(text,ja)=>{bubble('p',text,ja);turn.innerHTML=`<p class="row"><small>相手が話しています…</small><button class="btn ghost sm" id="skv">先へ</button></p>`;
  let skipped=false;const sk=turn.querySelector('#skv');const pr=speak(text,{g:q.pv});await Promise.race([pr,new Promise(r=>sk.onclick=()=>{skipped=true;stopSpeak();r()})]);await wait(200)};

  await partner(n.p,n.ja);
  if(n.end)return finish(n);

  if(n.free)return freeTurn(n);
  return step(n.go)};
 // 選択肢のある場面(自由回答モードではキーワードで分岐先を決める)
 const choiceTurn=(n,forceChoice)=>{R.turns++;
  if(R.mode==='free'&&!forceChoice){let fails=0;
   const ask=()=>{turn.innerHTML=`<div class="turn"><div class="want">自分の言葉で返事をしましょう</div><div id="qa"></div></div>`;
    answerBox(turn.querySelector('#qa'),{hintHtml:'言えそうな返事:<br>'+n.ch.map(c=>`<span class="en">${esc(c.en)}</span>`).join('<br>')}).then(res=>{
     if(res.text&&!res.typed){S.said++;dayRec().said++}
     const c=res.gaveUp?null:n.ch.find(c=>(res.alts||[res.text]).some(t=>keysOk(t,c.keys).ok));
     logEv({m:'qst',ok:!!c,h:res.hint,ms:res.ms,r:q.id,f:!res.gaveUp});
     if(c){addXP(res.hint?4:8);bubble('me',res.text);if(c.bad)toastFb(c.fb);return step(c.go)}
     fails++;if(res.gaveUp||fails>=2){return choiceTurn(n,true)}
     bubble('p',"Sorry, could you say that again?");speak("Sorry, could you say that again?",{g:q.pv}).then(ask)})};
   return ask()}
  const ord=shuffle(n.ch.map((_,i)=>i));
  turn.innerHTML=`<div class="turn"><div class="want">返事を選んでください</div><div class="opts one-col">${ord.map((i,k)=>`<button class="opt en" data-i="${i}"><span class="k">${k+1}</span><span>${esc(n.ch[i].en)}</span></button>`).join('')}</div><div id="tf"></div></div>`;
  turn.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const c=n.ch[+b.dataset.i];turn.querySelectorAll('.opt').forEach(x=>x.disabled=true);b.classList.add(c.bad?'ng':'ok');

   micPanel(tf.querySelector('#mp'),c.en,sc=>{logEv({m:'qst',ok:!c.bad,r:q.id,f:false});addXP(c.bad?1:4);bubble('me',c.en);step(c.go)},{skipLabel:'言わずに進む'});
  });
 };
 // 自分の言葉で話す場面(クリア条件)
 const freeTurn=n=>{R.turns++;let tries=0;const f=n.free;
  const ask=()=>{turn.innerHTML=`<div class="turn"><div class="want">${esc(f.ja)}</div><small class="muted">選択肢はありません。自分の言葉で言ってみましょう。</small><div id="qa"></div><div id="qf"></div></div>`;

    if(res.text&&!res.typed){S.said++;dayRec().said++}

    logEv({m:'qst',ok,h:ev.hint,ms:ev.ms,r:q.id+':'+R.path[R.path.length-1],f:!res.gaveUp});

     qf.querySelector('#qretry').onclick=ask;return}

   <p style="text-align:left"><small>ほかの返事を選ぶと、別の展開になります。</small></p>
   <div class="row" style="justify-content:center"><button class="btn ghost" id="qa2">${IC.redo}別のルートで</button><button class="btn hl" id="qmap">${RT.lc?'レッスンにもどる':'マップへ'}</button></div></div>`;
  turn.querySelector('#qa2').onclick=()=>go({name:'quest',id:q.id},true);
  turn.querySelector('#qmap').onclick=()=>{if(RT.lc)RT.lc.done({ok:clear?1:0,n:1});else go({name:'map'})};
  turn.scrollIntoView({block:'nearest',behavior:'smooth'});
 };
