<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

<title>えいご4線ノート</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: English 4-line practice notebook (light) / night study desk (dark). One column; red pen = correct, highlighter = key phrase. */
:root{
 --paper:#f1f4f8;--sheet:#ffffff;--grid:#d9dfe9;--base:#efb7b0;--grid2:#cfd6e2;--line:#d3d9e4;
 --ink:#1b2540;--muted:#5d6880;--marker:#ffe04a;--marker-hl:#ffe680;--marker-ink:#1b2540;
 --red:#d9473b;--blue:#2a63c4;--green:#1f8455;--me:#e8f0ff;--them:#eef1f6;
 --f-disp:"Dela Gothic One","Zen Maru Gothic","Hiragino Sans",sans-serif;
 --f-body:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans","Noto Sans JP",sans-serif;
 --f-en:"Lexend","Helvetica Neue",Arial,var(--f-body);
 --f-num:"IBM Plex Mono",ui-monospace,Menlo,monospace;
 --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
 --paper:#151b2a;--sheet:#1d2538;--grid:#222b40;--base:#4a2f3a;--grid2:#2e3850;--line:#34405a;
 --ink:#eef1f7;--muted:#a5afc4;--marker:#f0d458;--marker-hl:rgba(240,212,88,.30);--marker-ink:#151b2a;
 --red:#ff8d7e;--blue:#8ab9ff;--green:#86d3a2;--me:#24345a;--them:#262f45;color-scheme:dark}}
:root[data-theme="dark"]{
 --paper:#151b2a;--sheet:#1d2538;--grid:#222b40;--base:#4a2f3a;--grid2:#2e3850;--line:#34405a;
 --ink:#eef1f7;--muted:#a5afc4;--marker:#f0d458;--marker-hl:rgba(240,212,88,.30);--marker-ink:#151b2a;
 --red:#ff8d7e;--blue:#8ab9ff;--green:#86d3a2;--me:#24345a;--them:#262f45;color-scheme:dark}
*{box-sizing:border-box}
body{background-color:var(--paper);color:var(--ink);font-family:var(--f-body);font-weight:500;font-size:15px;line-height:1.75;
 background-image:linear-gradient(to bottom,transparent 8px,var(--grid) 8px 9px,transparent 9px 16px,var(--grid) 16px 17px,transparent 17px 24px,var(--base) 24px 25px,transparent 25px 32px,var(--grid) 32px 33px,transparent 33px);
 background-size:100% 48px}
button{font:inherit;color:inherit;cursor:pointer}
input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:6px}
h1,h2,h3{text-wrap:balance;margin:0;line-height:1.35}
small{color:var(--muted);font-size:.86em}
b{font-weight:900}
.en{font-family:var(--f-en);font-weight:500;letter-spacing:.005em}
.mk{background:linear-gradient(transparent 58%,var(--marker-hl) 58%);padding:0 .1em}

body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:21;background:var(--sheet)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--sheet);border-bottom:1px solid var(--line);
 padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px}
.top-in{max-width:880px;margin:0 auto;display:flex;align-items:center;gap:12px}
.logo{font-family:var(--f-disp);font-size:18px;letter-spacing:.02em;display:flex;align-items:center;gap:8px;background:none;border:0;padding:0;white-space:nowrap}
.logo i{display:inline-grid;place-items:center;width:28px;height:28px;border:2px solid var(--ink);border-radius:6px;font-style:normal;font-family:var(--f-en);font-size:13px;font-weight:700;
 background:linear-gradient(to bottom,transparent 15px,var(--red) 15px 16.5px,transparent 16.5px)}
.chip-lv{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:13px}
.chip-lv .lv{font-family:var(--f-num);font-weight:600}
.xpbar{width:110px;height:8px;border-radius:99px;background:var(--grid2);overflow:hidden}
.xpbar>span{display:block;height:100%;background:var(--blue);transition:width .5s}
.iconbtn{border:1.5px solid var(--line);background:var(--sheet);border-radius:10px;width:36px;height:36px;display:grid;place-items:center;flex:0 0 auto}
.iconbtn svg{width:18px;height:18px}

.wrap{max-width:880px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 60px;display:flex;flex-direction:column;gap:26px}
.sheet{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r)}
.pad{padding:20px 22px}
.eyebrow{font-size:12px;letter-spacing:.12em;color:var(--muted);font-weight:700}
.btn{border:2px solid var(--ink);background:var(--ink);color:var(--sheet);border-radius:999px;padding:9px 18px;font-weight:700;font-size:14px;display:inline-flex;align-items:center;gap:8px;transition:transform .12s}
.btn:hover{transform:translateY(-1px)}
.btn.hl{background:var(--marker);border-color:var(--marker);color:var(--marker-ink)}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.sm{padding:5px 12px;font-size:13px}
.btn:disabled{opacity:.45;cursor:default;transform:none}
.btn svg{width:16px;height:16px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sp{flex:1}
.back{background:none;border:0;padding:0;color:var(--muted);font-weight:700}
.gtag{display:inline-block;border:1.5px solid var(--ink);border-radius:6px;padding:0 8px;font-size:12px;font-weight:700;line-height:1.6}
.gtag.l1{border-color:var(--green);color:var(--green)}.gtag.l2{border-color:var(--blue);color:var(--blue)}
.gtag.l3{border-color:#b26a00;color:#b26a00}.gtag.l4{border-color:var(--red);color:var(--red)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .gtag.l3{border-color:#f0b35a;color:#f0b35a}}
:root[data-theme="dark"] .gtag.l3{border-color:#f0b35a;color:#f0b35a}
.uhead h1{font-family:var(--f-disp);font-weight:400;font-size:clamp(24px,5vw,34px);margin-top:4px}
.sec h2{font-family:var(--f-disp);font-weight:400;font-size:20px;margin-bottom:10px}

/* hero */
.hero{padding:22px;display:grid;grid-template-columns:auto 1fr;gap:22px;align-items:center}
.lvbig{width:118px;height:118px;border-radius:50%;display:grid;place-items:center;text-align:center;position:relative}
.lvbig svg{position:absolute;inset:0}
.lvbig .n{font-family:var(--f-disp);font-size:40px;line-height:1}
.lvbig .s{font-size:11px;color:var(--muted);letter-spacing:.1em}
.hero h1{font-family:var(--f-disp);font-size:clamp(22px,4vw,30px);font-weight:400}
.stats{display:flex;gap:18px;flex-wrap:wrap;margin:8px 0 14px;font-size:13px;color:var(--muted)}
.stats b{font-family:var(--f-num);font-size:20px;color:var(--ink);margin-right:3px}
@media (max-width:560px){.hero{grid-template-columns:1fr;justify-items:start}.lvbig{width:96px;height:96px}.lvbig .n{font-size:32px}}

/* mode cards */
.modes{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media (max-width:560px){.modes{grid-template-columns:1fr}}
.mode{text-align:left;padding:16px 18px;border:1.5px solid var(--line);background:var(--sheet);border-radius:var(--r);display:grid;grid-template-columns:52px 1fr;gap:14px;align-items:center;transition:transform .12s,border-color .12s}
.mode:hover{transform:translateY(-2px);border-color:var(--ink)}
.mode .ic{width:52px;height:52px;border-radius:14px;border:2px solid var(--ink);display:grid;place-items:center;font-family:var(--f-en);font-weight:700;font-size:18px}
.mode .ic svg{width:26px;height:26px}
.mode .tt{font-weight:900;font-size:17px;display:block}
.mode .tg{font-size:13px;color:var(--muted);display:block;line-height:1.55}
.mode .pg{font-family:var(--f-num);font-size:11.5px;color:var(--muted);margin-top:3px;display:block}
.today{display:flex;flex-direction:column;gap:8px}
.todo{display:grid;grid-template-columns:28px 1fr auto;gap:12px;align-items:center;padding:10px 4px;border-bottom:1px dashed var(--line)}
.todo:last-child{border-bottom:0}
.todo .ck{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:13px;color:var(--sheet)}
.todo.done .ck{border-color:var(--red);background:var(--red)}
.todo.done .tx{text-decoration:line-through;text-decoration-color:var(--red);color:var(--muted)}

/* lists */
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;scrollbar-width:thin}
.tab{flex:0 0 auto;border:1.5px solid var(--line);background:var(--sheet);border-radius:10px;padding:6px 12px 8px;font-weight:700;min-width:64px;text-align:center;line-height:1.3}
.tab small{display:block;font-family:var(--f-num);font-size:11px}
.tab[aria-selected="true"]{background:var(--ink);color:var(--sheet);border-color:var(--ink)}
.tab[aria-selected="true"] small{color:var(--sheet);opacity:.75}
.units{display:flex;flex-direction:column}
.unit{display:grid;grid-template-columns:40px 1fr auto;gap:14px;align-items:center;padding:14px 16px;border:0;border-bottom:1px dashed var(--line);background:transparent;text-align:left;width:100%}
.unit:last-child{border-bottom:0}
.unit:hover{background:color-mix(in srgb,var(--marker-hl) 45%,transparent)}
.unit .no{font-family:var(--f-num);font-weight:600;font-size:13px;color:var(--muted);width:40px;height:40px;border:1.5px solid var(--line);border-radius:50%;display:grid;place-items:center}
.unit.done .no{border-color:var(--red);color:var(--red)}
.unit .tt{font-weight:900;font-size:16px}
.unit .tg{font-size:13px;color:var(--muted);display:block;line-height:1.5}
.stars{font-size:18px;letter-spacing:1px;color:var(--grid2);white-space:nowrap}
.stars .on{color:#e0ad00}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .stars .on{color:var(--marker)}}
:root[data-theme="dark"] .stars .on{color:var(--marker)}

/* steps */
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.step{border:1.5px solid var(--line);background:var(--sheet);border-radius:12px;padding:8px 10px;text-align:left;font-weight:700;line-height:1.35;font-size:14px}
.step small{display:block;font-family:var(--f-num);font-size:11px}
.step[aria-selected="true"]{border-color:var(--ink);box-shadow:inset 0 -4px 0 var(--marker)}
.step .ck{color:var(--green);float:right}
.panel{padding:22px}
@media (max-width:520px){.panel{padding:18px 16px}}
.one{font-size:clamp(18px,3.4vw,22px);font-weight:900;line-height:1.6}
.blk{margin-top:20px}
.blk h3{font-size:13px;letter-spacing:.12em;color:var(--muted);margin-bottom:6px}
.keybox{border:2px solid var(--ink);border-radius:10px;padding:12px 16px;font-size:16px;line-height:1.9}
.keybox ul{margin:0;padding-left:1.2em}
.trap::before{content:"赤ペン";display:inline-block;font-size:11px;font-weight:900;color:var(--red);border:1.5px solid var(--red);border-radius:4px;padding:0 5px;margin-right:8px;transform:rotate(-4deg)}
.next{margin-top:22px;display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap}
.exs{display:flex;flex-direction:column;gap:2px}
.ex{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;padding:8px 0;border-bottom:1px dashed var(--line)}
.ex:last-child{border-bottom:0}
.ex .e{font-size:16.5px;line-height:1.55}
.ex .j{font-size:13.5px;color:var(--muted)}
.ex .n{font-size:12.5px;color:var(--red);font-weight:700}
.say{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--line);background:var(--sheet);display:grid;place-items:center;flex:0 0 auto}
.say svg{width:16px;height:16px}
.say.on{border-color:var(--blue);color:var(--blue);animation:pulse 1s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 6px color-mix(in srgb,var(--blue) 18%,transparent)}}

/* builder */
.slot{min-height:64px;border:2px dashed var(--line);border-radius:12px;padding:10px;display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start;
 background:linear-gradient(to bottom,transparent 30px,var(--base) 30px 31px,transparent 31px) 0 6px/100% 44px}
.slot.ok{border-style:solid;border-color:var(--green)}
.slot.ng{border-style:solid;border-color:var(--red);animation:shake .35s}
.pool{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;min-height:44px}
.tile{font-family:var(--f-en);font-weight:500;font-size:16px;border:1.5px solid var(--ink);background:var(--sheet);border-radius:9px;padding:5px 12px;box-shadow:0 2px 0 var(--ink);transition:transform .1s}
.tile:active{transform:translateY(2px);box-shadow:none}
.tile.used{visibility:hidden}
.bq{font-weight:900;font-size:17px;margin-bottom:10px}

/* quiz */
.pips{display:flex;gap:6px}
.pips i{flex:1;height:6px;border-radius:9px;background:var(--grid2)}
.pips i.ok{background:var(--green)}.pips i.ng{background:var(--red)}.pips i.cur{background:var(--ink)}
.qhead{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted);margin:12px 0 6px;gap:8px}
.combo{font-family:var(--f-num);font-weight:600;color:var(--red)}
.q{font-size:clamp(17px,3.4vw,21px);font-weight:500;line-height:1.75;margin:6px 0 16px}
.q .blank{display:inline-block;min-width:4.5em;border-bottom:2.5px solid var(--ink);margin:0 .15em}
.q .ja{display:block;font-family:var(--f-body);font-size:14px;color:var(--muted);margin-top:4px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opts.one-col{grid-template-columns:1fr}
@media (max-width:520px){.opts{grid-template-columns:1fr}}
.opt{border:2px solid var(--line);background:var(--sheet);border-radius:12px;padding:10px 14px;font-size:16.5px;font-weight:500;text-align:left;display:flex;gap:12px;align-items:center;min-height:54px}
.opt .k{font-family:var(--f-num);font-size:12px;color:var(--muted);border:1.5px solid var(--line);border-radius:6px;width:24px;height:24px;display:grid;place-items:center;flex:0 0 auto}
.opt:hover:not(:disabled){border-color:var(--ink)}
.opt:disabled{cursor:default}
.opt.ok{border-color:var(--green);background:color-mix(in srgb,var(--green) 12%,var(--sheet))}
.opt.ng{border-color:var(--red);background:color-mix(in srgb,var(--red) 10%,var(--sheet));animation:shake .35s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.fb{margin-top:16px;padding:14px 16px;border-radius:12px;border:1.5px solid var(--line);display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center}
.fb .verdict{font-family:var(--f-disp);font-size:20px;font-weight:400}
.fb.ok .verdict{color:var(--red)}
.fb.ng .verdict{color:var(--blue)}
.hana{width:60px;height:60px}
.hana path{fill:none;stroke:var(--red);stroke-width:4;stroke-linecap:round;stroke-dasharray:330;stroke-dashoffset:330;animation:draw .7s ease-out forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.tr{margin-top:10px;font-size:13.5px;color:var(--muted)}
.result{text-align:center;padding:30px 20px}
.result .big{font-family:var(--f-disp);font-size:56px;line-height:1}
.result .rst{font-size:44px;letter-spacing:6px;color:var(--grid2)}
.result .rst .on{color:var(--marker)}
.result .rst span{display:inline-block;animation:pop .45s backwards}
@keyframes pop{0%{transform:scale(0)}70%{transform:scale(1.3)}}
.gain{display:inline-flex;gap:16px;margin:12px 0;font-size:14px;color:var(--muted);flex-wrap:wrap;justify-content:center}
.gain b{font-family:var(--f-num);color:var(--ink);font-size:20px}

/* chat */
.chat{display:flex;flex-direction:column;gap:12px}
.bub{max-width:86%;padding:10px 14px;border-radius:16px;line-height:1.55;animation:tin .3s}
.bub .e{font-family:var(--f-en);font-size:16.5px}
.bub .j{font-size:13px;color:var(--muted);margin-top:2px}
.bub.p{align-self:flex-start;background:var(--them);border:1px solid var(--line);border-bottom-left-radius:4px}
.bub.me{align-self:flex-end;background:var(--me);border:1px solid color-mix(in srgb,var(--blue) 35%,var(--line));border-bottom-right-radius:4px}
.who{font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.06em;display:flex;gap:6px;align-items:center}
.bub .say{width:28px;height:28px}
.turn{border:2px solid var(--ink);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px;animation:tin .3s}
.turn .want{font-weight:900}
.turn .want::before{content:"言いたいこと";font-size:11px;color:var(--blue);border:1.5px solid var(--blue);border-radius:4px;padding:0 6px;margin-right:8px;vertical-align:2px}
.mic{display:flex;flex-direction:column;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:12px;background:color-mix(in srgb,var(--marker-hl) 45%,transparent)}
.micbtn{width:56px;height:56px;border-radius:50%;border:0;background:var(--red);color:#fff;display:grid;place-items:center;box-shadow:0 3px 0 color-mix(in srgb,var(--red) 60%,#000)}
.micbtn svg{width:24px;height:24px}
.micbtn.on{animation:pulse2 1s infinite}
@keyframes pulse2{50%{box-shadow:0 0 0 10px color-mix(in srgb,var(--red) 25%,transparent)}}
.heard{font-family:var(--f-en);font-size:15px}
.heard .hit{color:var(--green);font-weight:700}.heard .miss{color:var(--red);text-decoration:underline wavy}
.meter{height:10px;border-radius:99px;background:var(--grid2);overflow:hidden;width:100%;max-width:320px}
.meter span{display:block;height:100%;background:var(--green);transition:width .6s}

/* flashcard */
.card{perspective:1000px;height:240px;cursor:pointer;border:0;background:none;padding:0;width:100%}
.card .in{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
.card.flip .in{transform:rotateY(180deg)}
.card .f,.card .b{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border:2px solid var(--ink);border-radius:18px;background:var(--sheet);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:18px;text-align:center;gap:6px}
.card .b{transform:rotateY(180deg)}
.card .w{font-family:var(--f-en);font-size:clamp(26px,6vw,38px);font-weight:600;line-height:1.2}
.card .m{font-size:20px;font-weight:900}
.card .ee{font-family:var(--f-en);font-size:15px}
.card .jj{font-size:13px;color:var(--muted)}
.boxes{display:flex;gap:6px;align-items:flex-end;height:60px}
.boxes div{flex:1;background:var(--blue);border-radius:4px 4px 0 0;min-height:3px;opacity:.85;position:relative}
.boxes div span{position:absolute;top:-18px;left:0;right:0;text-align:center;font-family:var(--f-num);font-size:11px;color:var(--muted)}
.boxl{display:flex;gap:6px;font-size:11px;color:var(--muted)}
.boxl span{flex:1;text-align:center}
.wl{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px}
.wi{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:10px}
.wi .w{font-family:var(--f-en);font-weight:600}
.wi .m{font-size:13px;color:var(--muted);display:block;line-height:1.45}
.dots{display:flex;gap:2px}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--grid2)}
.dots i.on{background:var(--green)}
.search{width:100%;border:1.5px solid var(--line);background:var(--sheet);border-radius:10px;padding:8px 12px}

/* toeic */
.passage{border:1.5px solid var(--line);border-radius:12px;padding:16px;font-family:var(--f-en);font-size:15px;line-height:1.7;white-space:pre-wrap;background:var(--sheet);max-height:46vh;overflow:auto}
.passage .gap{font-family:var(--f-num);font-weight:600;background:var(--marker-hl);padding:0 4px;border-radius:4px}
.lis{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.trn{font-size:13.5px;color:var(--muted);border-left:3px solid var(--line);padding-left:12px;margin-top:10px}
details.more summary{cursor:pointer;font-weight:700;color:var(--blue);font-size:14px}
table.fmt{border-collapse:collapse;width:100%;font-size:14px}
table.fmt td,table.fmt th{border:1px solid var(--line);padding:6px 10px;text-align:left}
table.fmt th{background:color-mix(in srgb,var(--marker-hl) 40%,transparent)}

/* stamps */
.stamps{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:12px;margin-top:12px}
.stamp{text-align:center;font-size:11.5px;line-height:1.4;color:var(--muted)}
.stamp .seal{width:68px;height:68px;margin:0 auto 6px;border-radius:50%;border:2px dashed var(--grid2);display:grid;place-items:center;font-family:var(--f-disp);font-size:12px;line-height:1.15;color:var(--grid2)}
.stamp.got{color:var(--ink)}
.stamp.got .seal{border:3px double var(--red);color:var(--red);transform:rotate(-8deg)}

/* settings */
.set{display:grid;grid-template-columns:max-content 1fr;gap:12px 16px;align-items:center}
.set label{font-weight:700;font-size:14px}
.set select,.set input[type=range]{width:100%;max-width:320px}
.set select{border:1.5px solid var(--line);background:var(--sheet);border-radius:8px;padding:6px 8px}
input[type=range]{accent-color:var(--blue)}
@media (max-width:480px){.set{grid-template-columns:1fr;gap:4px}.set>*:nth-child(2n){margin-bottom:10px}}

#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:50;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:max-content;max-width:calc(100% - 32px)}
#toast div{background:var(--ink);color:var(--sheet);padding:9px 18px;border-radius:999px;font-weight:700;font-size:14px;animation:tin .3s}
#toast div.lvup{background:var(--marker);color:var(--marker-ink)}
@keyframes tin{from{opacity:0;transform:translateY(10px)}}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:40}
.foot{font-size:12.5px;color:var(--muted);line-height:1.7}
.jh{filter:blur(5px);cursor:pointer;user-select:none}
.jh::after{content:''}
.note{font-size:13px;color:var(--muted);padding:10px 14px;border-radius:10px;border:1px dashed var(--line)}
@media (max-width:520px){.chip-lv{gap:6px;font-size:12px}.xpbar{width:44px}.logo{font-size:15px}.logo i{width:24px;height:24px;font-size:11px;background:linear-gradient(to bottom,transparent 13px,var(--red) 13px 14.5px,transparent 14.5px)}.chip-lv .xpt{display:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.hana path{stroke-dashoffset:0}}
</style>

  {"s":"Mr. Tanaka usually ____ to work by bus.","c":["go","going","goes","is go"],"a":2,"why":"usually(ふだん)は習慣のサインなので現在形。主語 Mr. Tanaka は3人称単数なので goes です。"},
  {"s":"Please be quiet. The manager ____ a phone call right now.","c":["is taking","takes","took","take"],"a":0,"why":"right now(今まさに)は進行中の動作のサイン。現在進行形 is taking が正解です。"},
  {"s":"Ms. Rivera ____ the answer to your question.","c":["is knowing","are knowing","knowing","knows"],"a":3,"why":"know(知っている)は状態を表す動詞なので、ふつう進行形にしません。3人称単数の現在形 knows が正解です。"},
  {"s":"The shuttle bus ____ every 20 minutes from the hotel.","c":["is leave","leaves","leaving","are leaving"],"a":1,"why":"every 20 minutes(20分ごと)は決まったくり返しなので現在形。主語 bus は単数なので leaves です。"},
  {"s":"Our team ____ on a new marketing plan at the moment.","c":["work","is working","works","have work"],"a":1,"why":"at the moment(今のところ・ちょうど今)は進行形のサイン。team は1つのまとまりとして is で受け、is working となります。"},
  {"s":"This laptop ____ to the IT department, so please don't take it home.","c":["belong","is belonging","are belonging","belongs"],"a":3,"why":"belong to(〜のものである)は状態の動詞なので進行形にしません。主語 laptop は単数なので belongs です。"},
  {"s":"Water ____ at 100 degrees Celsius.","c":["boils","is boiling","boiling","boil"],"a":0,"why":"「水は100度で沸騰する」はいつでも変わらない事実なので現在形。主語 water は単数扱いなので boils です。"},
  {"s":"Look! It ____ outside. Take an umbrella.","c":["rains","rain","is raining","rained"],"a":2,"why":"Look!(見て!)は、今目の前で起きていることのサイン。現在進行形 is raining が正解です。"}
 ]
},
{"id":"g03","lv":1,"t":"過去形と過去進行形","sub":"終わった出来事の写真と、過去で一時停止した動画","cat":"時制",
 "img":"過去形は<b>もう終わった出来事を1枚の写真に撮ったもの</b>です。過去進行形(was / were + -ing)は、<span class=\"mk\">過去のある瞬間で動画を一時停止</span>した場面。「電話が鳴った(写真)とき、私はシャワーを浴びていた(一時停止した動画)」のように、2つを組み合わせると場面が生き生きします。",
 "rule":["過去形: 過去に終わったこと。yesterday, last week, 〜 ago, in 2020 などがサイン。","規則動詞は -ed(worked)、不規則動詞は形が変わります(go → went, buy → bought)。","過去進行形: was / were + -ing で「(その時)〜している最中だった」。","when + 過去形(短い出来事)と、while + 過去進行形(続いていた動作)の組み合わせがよく出ます。"],
 "ex":[
  {"en":"I visited my grandmother last Sunday.","ja":"先週の日曜日に祖母を訪ねました。","note":"last Sunday = 終わった過去"},
  {"en":"We were having lunch when the boss called.","ja":"上司から電話があったとき、私たちは昼食を食べていました。","note":"続いていた動作 + 短い出来事"},
  {"en":"The company opened its first store ten years ago.","ja":"その会社は10年前に1号店を開きました。","note":"〜 ago は過去形のサイン"},
  {"en":"While I was waiting for the bus, it started to rain.","ja":"バスを待っている間に雨が降り出しました。","note":"while + 過去進行形"}
 ],
 "trap":"「〜前に」の ago を現在完了と一緒に使う間違い(I have visited it two years ago.)が多いです。ago, yesterday, last 〜 など「過去の一点」を示す語があれば過去形にしましょう。",
 "talk":{"en":"What did you do last weekend?","ja":"先週末は何をしましたか?"},
 "build":[
  {"ja":"私は昨日、新しいかばんを買いました。","en":"I bought a new bag yesterday."},
  {"ja":"彼女はそのときテレビを見ていました。","en":"She was watching TV at that time."},
  {"ja":"私たちは3年前に出会いました。","en":"We met three years ago."}
 ],
 "q":[
  {"s":"Ms. Kim ____ the report to her manager yesterday afternoon.","c":["sends","sent","has sent","will send"],"a":1,"why":"yesterday afternoon(昨日の午後)は過去の一点なので過去形 sent。現在完了 has sent は yesterday と一緒に使えません。"},
  {"s":"When I arrived at the office, my coworkers ____ a meeting.","c":["have","are having","has","were having"],"a":3,"why":"When I arrived(私が着いたとき)という過去の瞬間に「会議をしている最中だった」ので過去進行形 were having です。"},
  {"s":"The factory ____ production two weeks ago.","c":["stopped","stops","has stopped","is stopping"],"a":0,"why":"two weeks ago(2週間前)は過去形のサイン。ago は現在完了と一緒に使えないので stopped です。"},
  {"s":"Mr. Silva hurt his back while he ____ some heavy boxes.","c":["carries","carry","was carrying","is carrying"],"a":2,"why":"hurt(痛めた)は過去の出来事。while(〜している間)の中は、その時続いていた動作なので過去進行形 was carrying です。"},
  {"s":"Greenfield Corp. ____ its new product line at a trade show last month.","c":["introduces","has introduced","will introduce","introduced"],"a":3,"why":"last month(先月)は過去の一点なので過去形 introduced。has introduced は last month と一緒に使えません。"},
  {"s":"I ____ dinner when you called me last night, so I couldn't answer.","c":["was cooking","am cooking","cook","have cooked"],"a":0,"why":"when you called me last night(昨夜電話をくれたとき)という過去の瞬間に「料理している最中だった」ので過去進行形です。"},
  {"s":"Our sales ____ by 15 percent in 2023.","c":["increase","have increased","increased","are increasing"],"a":2,"why":"in 2023 は終わった過去の年なので過去形 increased。現在完了は「in + 過去の年」と一緒に使えません。"},
  {"s":"At 3 p.m. yesterday, the staff ____ for the client's visit.","c":["prepare","were preparing","are preparing","have prepared"],"a":1,"why":"At 3 p.m. yesterday(昨日の午後3時に)は過去の一瞬。その瞬間に進行中だった動作なので過去進行形 were preparing です。"}
 ]
},
{"id":"g04","lv":1,"t":"未来の言い方(will / be going to / 現在進行形の予定)","sub":"未来は「気持ちの温度」で選ぶ","cat":"時制",
 "img":"未来の言い方は<b>「気持ちの温度」</b>で選びます。will は<span class=\"mk\">その場で決めた未来・予想</span>(「じゃあ、私がやります!」)。be going to は<span class=\"mk\">前から心が向かっている未来</span>で、もう矢印が未来に向いているイメージ。現在進行形は、手帳にもう書き込んである予定です。",
 "rule":["will + 動詞の原形: その場で決めたこと・予想・申し出。","be going to + 動詞の原形: 前から決めていた予定・はっきりした兆しがある予想。","現在進行形(be + -ing)+ 未来の時: 日時や相手まで決まっている予定。","時や条件を表す when / if / as soon as / until の中では、未来のことでも現在形を使います。"],
 "ex":[
  {"en":"It's cold. I'll close the window.","ja":"寒いですね。窓を閉めますね。","note":"その場で決めた → will"},
  {"en":"I'm going to study abroad next year.","ja":"来年、留学するつもりです。","note":"前から決めていた計画"},
  {"en":"We're meeting the client at two tomorrow.","ja":"明日2時にお客様と会う予定です。","note":"手帳に書いた予定 → 進行形"},
  {"en":"I'll call you as soon as I arrive.","ja":"着いたらすぐに電話します。","note":"as soon as の中は現在形"}
 ],
 "trap":"「明日雨が降ったら」を If it will rain tomorrow とするのはよくある間違いです。if や when の中は現在形で If it rains tomorrow とします。「未来なのに現在形」と覚えておきましょう。",
 "talk":{"en":"I'll have the same, please.","ja":"私も同じものをお願いします。"},
 "build":[
  {"ja":"週末に映画を見に行くつもりです。","en":"I'm going to see a movie this weekend."},
  {"ja":"私があなたのかばんを持ちますよ。","en":"I'll carry your bag for you."},
  {"ja":"彼女は来週パリへ飛ぶ予定です。","en":"She is flying to Paris next week."}
 ],
 "q":[
  {"s":"Please wait here until Mr. Brown ____ back from lunch.","c":["comes","will come","came","coming"],"a":0,"why":"until(〜まで)は時を表す接続詞。その中では未来のことでも現在形を使うので comes です。"},
  {"s":"Look at those dark clouds. It ____ rain.","c":["is","will be","is going to","has"],"a":2,"why":"dark clouds(黒い雲)というはっきりした兆しがある予想なので be going to。後ろが原形 rain なので is going to rain となります。"},
  {"s":"If the weather ____ good tomorrow, the outdoor event will be held as planned.","c":["will be","was","being","is"],"a":3,"why":"if(もし〜なら)の中は、tomorrow の話でも現在形を使います。主語 weather は単数なので is です。"},
  {"s":"A: The printer is out of paper. B: I ____ get some from the supply room.","c":["am","will","was","have"],"a":1,"why":"紙切れを聞いて「じゃあ私が取ってきます」とその場で決めた申し出なので will。後ろの get が原形なのもヒントです。"},
  {"s":"We ____ the Greenfield Corp. team at 10 a.m. tomorrow.","c":["met","have met","are meeting","meets"],"a":2,"why":"tomorrow の10時と日時が決まった予定は、現在進行形で表せます。met や have met は過去・完了なので tomorrow と合いません。"},
  {"s":"As soon as the contract ____ signed, we will start the project.","c":["will be","is","was","being"],"a":1,"why":"as soon as(〜したらすぐに)は時を表す接続詞なので、中は未来のことでも現在形。「契約が署名される」は受動態 is signed です。"},
  {"s":"Ms. Patel ____ give a presentation at next week's conference.","c":["is going to","is going","going to","goes to"],"a":0,"why":"next week's conference の予定。be going to + 動詞の原形の形がそろっているのは is going to だけです。"},
  {"s":"The sales report ____ ready by the end of the day.","c":["is being","was","has been","will be"],"a":3,"why":"by the end of the day(今日の終わりまでに)は未来の話なので will be。was や has been は過去・完了で未来を表せません。"}
 ]
},
{"id":"g05","lv":2,"t":"現在完了","sub":"過去から今までつながる矢印","cat":"時制",
 "img":"現在完了(have + 過去分詞)は<b>過去から今までつながる矢印</b>です。過去形が「過去にポツンと置いた点」なのに対し、現在完了は<span class=\"mk\">矢印の先が今に届いている</span>のがポイント。「経験(今までに〜したことがある)」「完了(ちょうど・もう〜した)」「継続(ずっと〜している)」は、どれも今の自分とつながった話です。",
 "rule":["形: have / has + 過去分詞。否定は have not、疑問は Have you 〜?","経験: ever, never, before, once, 〜 times がサイン。","完了: just, already, yet(疑問文・否定文で)がサイン。","継続: for + 期間、since + 始まった時点 がサイン。","現在完了進行形 have been + -ing: 「ずっと〜し続けている」と動作の継続を強調します。"],
 "ex":[
  {"en":"I have lived in Osaka for ten years.","ja":"大阪に10年住んでいます。","note":"for + 期間で「継続」"},
  {"en":"Have you ever tried Thai food?","ja":"タイ料理を食べたことはありますか?","note":"ever で「経験」"},
  {"en":"The train has just left.","ja":"電車はちょうど出たところです。","note":"just で「完了」"},
  {"en":"She has been working on the report since this morning.","ja":"彼女は今朝からずっと報告書に取り組んでいます。","note":"動作が今も続いている → 現在完了進行形"}
 ],
 "trap":"yesterday や last year、〜 ago など「過去の一点」を示す語とは一緒に使えません。I have seen him yesterday. は誤りで、I saw him yesterday. が正解です。矢印ではなく「点」の話だからです。",
 "talk":{"en":"Have you ever been to Kyoto?","ja":"京都に行ったことはありますか?"},
 "build":[
  {"ja":"このメールをもう読みましたか?","en":"Have you read this email yet?"},
  {"ja":"私は一度も海外に行ったことがありません。","en":"I have never been abroad."},
  {"ja":"彼は2015年からここで働いています。","en":"He has worked here since 2015."}
 ],
 "q":[
  {"s":"Mr. Kato ____ at this company since 2018.","c":["works","worked","has worked","is working"],"a":2,"why":"since 2018(2018年から今まで)は「継続」のサインなので現在完了 has worked です。"},
  {"s":"The client ____ already approved the budget.","c":["has","is","was","does"],"a":0,"why":"already(もう)は「完了」のサイン。approved(過去分詞)の前に置いて現在完了を作れるのは has だけです。"},
  {"s":"Ms. Lee ____ to Singapore three times on business.","c":["is","has been","was been","have been"],"a":1,"why":"three times(3回)は「経験」のサイン。have been to で「〜へ行ったことがある」。主語は3人称単数なので has been です。"},
  {"s":"We ____ for the bus for 30 minutes, and it still hasn't come.","c":["wait","are waiting","waited","have been waiting"],"a":3,"why":"for 30 minutes(30分間)待ち続けて、今も待っている状態なので現在完了進行形 have been waiting です。"},
  {"s":"Sales of the product ____ steadily over the past five years.","c":["have risen","rise","raise","are rising"],"a":0,"why":"over the past five years(この5年間で)は、過去から今までの期間を表すので現在完了。主語 Sales は複数なので have risen です。"},
  {"s":"Mr. Wong ____ the company two years ago.","c":["has joined","has been joining","joins","joined"],"a":3,"why":"two years ago(2年前)は過去の一点。ago は現在完了と一緒に使えないので過去形 joined です。"},
  {"s":"This is the most exciting movie I ____.","c":["ever see","was seeing","have ever seen","am seeing"],"a":2,"why":"「今までに見た中でいちばん」は、過去から今までの経験の話。最上級 + I have ever seen の形がよく使われます。"},
  {"s":"How long ____ you known Ms. Garcia?","c":["are","have","did","do"],"a":1,"why":"known は過去分詞。How long(どのくらいの間)と合わせて「継続」をたずねる現在完了の疑問文なので have です。"}
 ]
},
{"id":"g06","lv":3,"t":"過去完了と未来完了","sub":"矢印を過去や未来にずらす","cat":"時制",
 "img":"過去完了(had + 過去分詞)は、現在完了の矢印を<b>まるごと過去にずらしたもの</b>です。「駅に着いたとき(過去の基準点)、電車はもう出ていた(それより前)」のように、<span class=\"mk\">過去のある時点より前</span>を表します。未来完了(will have + 過去分詞)は逆に矢印のゴールを未来に置き、「その時までには〜し終えているだろう」を表します。",
 "rule":["過去完了: had + 過去分詞。過去の基準点より前に起きたこと、その時までの経験や継続。","when + 過去形 / by the time + 過去形 と組み合わせることが多いです。","未来完了: will have + 過去分詞。「(未来のある時)までに〜し終えているだろう」。","by + 未来の時(by next Friday)や by the time + 現在形 が未来完了のサイン。","had been + -ing / will have been + -ing で、動作の継続を強調できます。"],
 "ex":[
  {"en":"When I got to the station, the train had already left.","ja":"駅に着いたとき、電車はもう出ていました。","note":"着いた時点より前に出発"},
  {"en":"She had never seen snow before she moved to Hokkaido.","ja":"北海道に引っ越すまで、彼女は雪を見たことがありませんでした。","note":"過去の時点までの経験"},
  {"en":"I will have finished the report by noon.","ja":"正午までには報告書を書き終えているでしょう。","note":"by noon = 未来の締め切り"},
  {"en":"By next April, he will have worked here for 20 years.","ja":"来年の4月で、彼はここに20年勤めたことになります。","note":"未来の時点までの継続"}
 ],
 "trap":"過去完了は「過去の基準点」があってはじめて使えます。また by the time の後ろは、未来のことでも現在形です(By the time you arrive, ...)。will を入れないよう注意しましょう。",
 "talk":{"en":"I had never heard of it until today.","ja":"今日まで聞いたこともありませんでした。"},
 "build":[
  {"ja":"私が起きたとき、彼はもう出かけていました。","en":"He had already left when I woke up."},
  {"ja":"金曜日までにはそれを終えているでしょう。","en":"I will have finished it by Friday."},
  {"ja":"彼女は以前にその映画を見たことがありました。","en":"She had seen the movie before."}
 ],
 "q":[
  {"s":"By the time the manager arrived, the meeting ____.","c":["already starts","has already started","is already starting","had already started"],"a":3,"why":"By the time the manager arrived(部長が着いた時までに)は過去の基準点。それより前に始まっていたので過去完了 had already started です。"},
  {"s":"By the end of next month, we ____ all the new equipment.","c":["installed","will have installed","have installed","had installed"],"a":1,"why":"By the end of next month(来月末までに)は未来の締め切り。その時までに終えているので未来完了 will have installed です。"},
  {"s":"Ms. Ito ____ in sales for ten years before she became a manager.","c":["had worked","has worked","works","will have worked"],"a":0,"why":"before she became a manager(部長になる前)という過去の時点までの10年間の継続なので、過去完了 had worked です。"},
  {"s":"By the time you ____ this email, I will have left the office.","c":["will read","will have read","read","had read"],"a":2,"why":"by the time(〜する時までに)は時を表す接続詞なので、未来のことでも中は現在形。read(現在形)が正解です。"},
  {"s":"The client said that he ____ our proposal the day before.","c":["receives","had received","has received","will receive"],"a":1,"why":"said(言った)という過去の時点より前の「前日に」受け取っていたので、過去完了 had received です。"},
  {"s":"By 2030, the company ____ its business to ten countries.","c":["expanded","had expanded","has expanded","will have expanded"],"a":3,"why":"By 2030(2030年までに)は未来の時点。それまでに完了しているはずのことなので未来完了 will have expanded です。"},
  {"s":"I didn't recognize Mr. Hall because I ____ him before.","c":["never meet","have never met","had never met","will never meet"],"a":2,"why":"didn't recognize(わからなかった)という過去の時点までに「一度も会ったことがなかった」経験なので過去完了 had never met です。"},
  {"s":"By the time the construction is completed, the city ____ more than $5 million on the project.","c":["will have spent","had spent","spent","has spent"],"a":0,"why":"By the time the construction is completed(工事が終わる時までに)は未来の時点(中は現在形)。それまでに使い終えている額なので未来完了です。"}
 ]
},
{"id":"g07","lv":1,"t":"助動詞(can / must / have to / should / may / will・would)","sub":"動詞に気持ちのスパイスをふりかける","cat":"助動詞",
 "img":"助動詞は動詞に<b>「気持ちのスパイス」</b>をふりかけるものです。can は「できる」、must は「絶対!」、should は「〜したほうがいいよ」というアドバイス、may は「〜してもよい・〜かもしれない」。<span class=\"mk\">助動詞の後ろは必ず動詞の原形</span>というルールさえ守れば、あとは味付けを選ぶだけです。",
 "rule":["助動詞 + 動詞の原形。主語が he / she でも -s はつけません(He can swim.)。","must = 「〜しなければならない」(話し手の強い気持ち)。have to = 「(ルールや状況で)〜しなければならない」。","must not = 「〜してはいけない」(禁止)。don't have to = 「〜しなくてもよい」(不要)。意味がまったく違います。","should = 「〜したほうがいい・〜すべき」。may = 「〜してもよい・〜かもしれない」。","Will you 〜? より Would you 〜? / Could you 〜? のほうが丁寧なお願いになります。"],
 "ex":[
  {"en":"Can you speak Chinese?","ja":"中国語を話せますか?","note":"can = 能力"},
  {"en":"You must not use your phone during the test.","ja":"試験中に携帯電話を使ってはいけません。","note":"must not = 禁止"},
  {"en":"You don't have to bring anything.","ja":"何も持ってこなくて大丈夫ですよ。","note":"don't have to = 不要"},
  {"en":"Could you check this document for me?","ja":"この書類を確認していただけますか?","note":"Could you 〜? で丁寧なお願い"}
 ],
 "trap":"must not(禁止)と don't have to(しなくてよい)を同じ意味だと思いがちです。「しなくていいよ」と言いたいのに must not を使うと「してはいけない」になってしまいます。また He can swims. のように -s をつけないようにしましょう。",
 "talk":{"en":"Could you say that again, please?","ja":"もう一度言っていただけますか?"},
 "build":[
  {"ja":"あなたは医者に診てもらったほうがいいです。","en":"You should see a doctor."},
  {"ja":"ここで写真を撮ってもいいですか?","en":"May I take a picture here?"},
  {"ja":"明日は早く起きなければなりません。","en":"I have to get up early tomorrow."}
 ],
 "q":[
  {"s":"Mr. Davis can ____ three languages.","c":["speaks","speak","speaking","to speak"],"a":1,"why":"助動詞 can の後ろは必ず動詞の原形。主語が3人称単数でも -s はつけないので speak です。"},
  {"s":"Employees ____ wear their ID badges at all times in the building.","c":["has to","must to","must","musts"],"a":2,"why":"主語 Employees は複数なので has to は不可。must の後ろは to なしの原形で、must に -s もつきません。"},
  {"s":"The event is free, so you ____ pay anything.","c":["don't have to","must not","have to","must"],"a":0,"why":"free(無料)なので「払わなくてよい」という不要の意味。don't have to です。must not だと「払ってはいけない」になります。"},
  {"s":"____ you please tell me the way to the station?","c":["Could","Are","May","Have"],"a":0,"why":"「〜していただけますか」と相手に丁寧に頼むときは Could you 〜?。May は May I 〜? のように自分が許可を求めるときに使います。"},
  {"s":"Smoking is strictly prohibited. Visitors ____ smoke anywhere on the factory grounds.","c":["don't have to","need","may","must not"],"a":3,"why":"strictly prohibited(厳しく禁止)とあるので「吸ってはいけない」。禁止を表す must not が正解です。"},
  {"s":"You look tired. You ____ go home and get some rest.","c":["must not","should","cannot","had not"],"a":1,"why":"You look tired(疲れているね)に続くのは「帰って休んだほうがいい」というアドバイス。should が正解です。"},
  {"s":"The weather report says it ____ snow tonight, so drive carefully.","c":["may","will to","should to","can to"],"a":0,"why":"天気予報の内容なので「降るかもしれない」という推量の may。will・should・can などの助動詞の後ろに to はつきません。"},
  {"s":"____ I use this meeting room this afternoon?","c":["Am","Have","May","Does"],"a":2,"why":"後ろが原形 use なので助動詞が必要。「使ってもいいですか」と許可を求める May I 〜? が正解です。"}
 ]
},
{"id":"g08","lv":3,"t":"助動詞 + have + 過去分詞","sub":"タイムマシンで過去をふり返る","cat":"助動詞",
 "img":"助動詞 + have + 過去分詞は、<b>タイムマシンで過去をふり返る形</b>です。今の自分が過去を見て、「〜すべきだったのに(後悔)」「〜したにちがいない(確信)」「〜したかもしれない(推測)」と気持ちをつけます。<span class=\"mk\">have + 過去分詞が「過去へのワープ」</span>の役目をしていると考えましょう。",
 "rule":["should have + 過去分詞: 〜すべきだったのに(実際はしなかった)。後悔・非難。","must have + 過去分詞: 〜したにちがいない。強い確信。","may / might have + 過去分詞: 〜したかもしれない。","can't / couldn't have + 過去分詞: 〜したはずがない。","could have + 過去分詞: 〜できたのに(しなかった)。"],
 "ex":[
  {"en":"I should have left home earlier.","ja":"もっと早く家を出るべきでした。","note":"後悔"},
  {"en":"He must have missed the train.","ja":"彼は電車に乗り遅れたにちがいありません。","note":"強い確信"},
  {"en":"She might have forgotten about the meeting.","ja":"彼女は会議のことを忘れたのかもしれません。","note":"推測"},
  {"en":"You can't have seen Mr. Ford yesterday. He was in London.","ja":"昨日フォードさんを見たはずがありません。彼はロンドンにいたのです。","note":"ありえない"}
 ],
 "trap":"should have + 過去分詞には「実際にはしなかった」という意味が隠れています。「(これから)〜したほうがいい」は should + 原形、「〜すべきだった」は should have + 過去分詞と、時間の向きで使い分けましょう。会話では should've(シュダヴ)と縮まって聞こえます。",
 "talk":{"en":"You should have told me earlier!","ja":"もっと早く言ってくれればよかったのに!"},
 "build":[
  {"ja":"私はもっと一生懸命勉強すべきでした。","en":"I should have studied harder."},
  {"ja":"彼は道に迷ったにちがいありません。","en":"He must have gotten lost."},
  {"ja":"彼女はそのことを知っていたかもしれません。","en":"She may have known about it."}
 ],
 "q":[
  {"s":"The streets are wet. It ____ rained last night.","c":["must have","should","must","can't have"],"a":0,"why":"道がぬれている(今の証拠)から「昨夜雨が降ったにちがいない」と過去を確信しています。must have + 過去分詞です。should rained や must rained は形がまちがいです。"},
  {"s":"I failed the test. I ____ more.","c":["should studied","must have studied","can't have studied","should have studied"],"a":3,"why":"failed(落ちた)とあるので「もっと勉強すべきだった」という後悔。should have + 過去分詞 です。should studied は形がまちがいです。"},
  {"s":"Ms. Diaz ____ the report by herself. It is 200 pages long, and she only started this morning.","c":["must have written","should have written","has written","can't have written"],"a":3,"why":"200ページもあり今朝始めたばかりなので「一人で書いたはずがない」。can't have + 過去分詞 が正解です。"},
  {"s":"We ____ the earlier flight, but we decided to stay one more night.","c":["can't have taken","could have taken","must have taken","should take"],"a":1,"why":"but we decided to stay(でも泊まることにした)とあるので「早い便に乗ることもできたのに(乗らなかった)」。could have + 過去分詞 です。"},
  {"s":"Mr. Ross isn't at his desk. He ____ gone home early.","c":["should","must","may have","can't"],"a":2,"why":"空所の後ろが gone(過去分詞)なので、助動詞 + have の形が必要。選択肢でこの形は may have だけで「早退したのかもしれない」となります。"},
  {"s":"You ____ the client so many personal questions. She looked uncomfortable.","c":["shouldn't have asked","must have asked","can't have asked","should ask"],"a":0,"why":"She looked uncomfortable(居心地が悪そうだった)とあるので「あんなに聞くべきではなかった」という非難。shouldn't have + 過去分詞 です。"},
  {"s":"I can't find my key. I ____ left it in the taxi.","c":["can","might have","must","would"],"a":1,"why":"鍵が見つからない状況で「タクシーに置き忘れたかもしれない」という推測。後ろが left(過去分詞)なので might have が入ります。"},
  {"s":"The package ____ arrived yet. I sent it only this morning from Osaka.","c":["must have","should have","may","can't have"],"a":3,"why":"今朝送ったばかりなので「まだ届いたはずがない」。否定の推量 can't have + 過去分詞 です。yet は否定の文で使うので、肯定の must have や should have とは合いません。"}
 ]
},
{"id":"g09","lv":2,"t":"受動態","sub":"カメラを「される側」に向ける","cat":"態",
 "img":"受動態(be + 過去分詞)は<b>カメラの向きを変える</b>ことです。能動態は「する側」にカメラを向け、受動態は<span class=\"mk\">「される側」を主役にして撮る</span>。「多くの人がこの歌を歌う」を「この歌は多くの人に歌われている」と言いかえると、主役が歌に変わります。だれがしたかが重要でないときに特に便利です。",
 "rule":["形: be動詞 + 過去分詞 で「〜される・〜されている」。","する人を言うときは by 〜。言う必要がなければ省略します。","時制は be動詞で表します: is made / was made / will be made / has been made / is being made。","by 以外の前置詞: be interested in, be known for, be covered with, be satisfied with など。","TOEICのコツ: 空所の後ろに目的語(名詞)があれば能動態、なければ受動態が基本です。"],
 "ex":[
  {"en":"English is spoken in many countries.","ja":"英語は多くの国で話されています。","note":"する人(人々)は言わなくてもわかる"},
  {"en":"This bridge was built in 1990.","ja":"この橋は1990年に建てられました。","note":"過去の受動態は was + 過去分詞"},
  {"en":"The meeting room is being cleaned now.","ja":"会議室は今、掃除されているところです。","note":"is being + 過去分詞 = 進行形の受動態"},
  {"en":"The mountain is covered with snow.","ja":"その山は雪でおおわれています。","note":"by 以外の前置詞"}
 ],
 "trap":"「される側」が主語なのに能動態のままにしてしまうミスが多いです。The package delivered yesterday. ではなく The package was delivered yesterday. のように、be動詞を忘れないようにしましょう。",
 "talk":{"en":"Is this seat taken?","ja":"この席は空いていますか?(だれか座っていますか?)"},
 "build":[
  {"ja":"この写真は私の父が撮りました。","en":"This photo was taken by my father."},
  {"ja":"私はアートに興味があります。","en":"I am interested in art."},
  {"ja":"その会議は延期されました。","en":"The meeting was postponed."}
 ],
 "q":[
  {"s":"The new software ____ by our IT team last week.","c":["installed","installs","was installed","was installing"],"a":2,"why":"ソフトは「インストールされる」側で、後ろに by our IT team(する人)があります。last week なので過去の受動態 was installed です。"},
  {"s":"All employees are required to ____ the training session.","c":["be attended","attend","attending","attended"],"a":1,"why":"to の後ろは動詞の原形。後ろに目的語 the training session があり、社員が「出席する」側なので能動の attend です。"},
  {"s":"The museum is well known ____ its collection of modern art.","c":["by","to","with","for"],"a":3,"why":"be known for 〜 で「〜で有名だ」。有名な理由を表すときは for を使います。"},
  {"s":"Ms. Grant ____ the new marketing plan at yesterday's meeting.","c":["presented","is presented","is presenting","has been presented"],"a":0,"why":"後ろに目的語 the new marketing plan があり、グラントさんが「発表する」側なので能動態。yesterday's meeting なので過去形 presented です。"},
  {"s":"Your order ____ within three business days.","c":["will deliver","will be delivered","delivers","is delivering"],"a":1,"why":"注文品は「配達される」側で、後ろに目的語がありません。これからのことなので未来の受動態 will be delivered です。"},
  {"s":"The conference room ____ right now, so we'll meet in the lobby.","c":["is cleaning","cleans","cleaned","is being cleaned"],"a":3,"why":"部屋は「掃除される」側で、right now(今まさに)進行中。進行形の受動態 is being cleaned です。"},
  {"s":"Customers who are not satisfied ____ the product can return it within 30 days.","c":["with","at","on","by"],"a":0,"why":"be satisfied with 〜 で「〜に満足している」。by ではなく with を使う決まった組み合わせです。"},
  {"s":"Several new employees ____ since the beginning of the year.","c":["hired","have hired","have been hired","were hiring"],"a":2,"why":"社員は「雇われる」側で、後ろに目的語がありません。since(〜以来)があるので現在完了の受動態 have been hired です。"}
 ]
},
{"id":"g10","lv":2,"t":"不定詞(to + 動詞の原形)","sub":"to は「これからやること」への矢印","cat":"準動詞",
 "img":"to + 動詞の原形は<b>「→(矢印)これからやること」</b>のイメージです。to はもともと「〜へ向かう」という意味。I want to go. は「行くことに気持ちが向かっている」ということ。<span class=\"mk\">to の矢印は名詞・形容詞・副詞のどこにでもつなげられる</span>ので、3つの用法があるのです。",
 "rule":["名詞的用法「〜すること」: I want to travel. / My goal is to pass the test.","形容詞的用法「〜するための・〜すべき」: something to drink, time to go。","副詞的用法「〜するために(目的)」「〜して(感情の原因)」: I came here to study. / I'm glad to see you.","形容詞 + enough to 〜「〜するのに十分…」、too … to 〜「…すぎて〜できない」。","want / ask / tell + 人 + to 〜「人に〜してほしい・〜するよう頼む・言う」。"],
 "ex":[
  {"en":"I want to learn English for my job.","ja":"仕事のために英語を学びたいです。","note":"名詞的用法: 学ぶこと"},
  {"en":"Do you have anything to drink?","ja":"何か飲み物はありますか?","note":"形容詞的用法: 飲むための何か"},
  {"en":"She is old enough to drive.","ja":"彼女は運転できる年齢です。","note":"形容詞 + enough to"},
  {"en":"My boss asked me to check the data.","ja":"上司は私にデータを確認するよう頼みました。","note":"ask + 人 + to"}
 ],
 "trap":"「彼に来てほしい」を I want that he comes. としがちですが、英語では I want him to come. が自然です。また enough は形容詞の後ろ(old enough)に置く点に注意しましょう。",
 "talk":{"en":"Nice to meet you.","ja":"はじめまして。(お会いできてうれしいです)"},
 "build":[
  {"ja":"私は医者になりたいです。","en":"I want to be a doctor."},
  {"ja":"このスープは熱すぎて飲めません。","en":"This soup is too hot to eat."},
  {"ja":"彼女は私に窓を開けるように頼みました。","en":"She asked me to open the window."}
 ],
 "q":[
  {"s":"Ms. Okada went to the bank ____ some money.","c":["withdraw","withdrew","withdrawing","to withdraw"],"a":3,"why":"銀行に行った「目的」は「お金を引き出すため」。目的を表す副詞的用法の to withdraw です。"},
  {"s":"The manager asked all staff members ____ the survey by Friday.","c":["to complete","completing","complete","completed"],"a":0,"why":"ask + 人 + to 〜 で「人に〜するよう頼む」。all staff members が「人」なので to complete です。"},
  {"s":"This box is too heavy for me ____.","c":["carry","carrying","to carry","carried"],"a":2,"why":"too … to 〜 で「…すぎて〜できない」。too heavy があるので to carry です。"},
  {"s":"We don't have enough time ____ every item on the agenda.","c":["discuss","to discuss","discussed","discussing"],"a":1,"why":"enough time to 〜 で「〜するのに十分な時間」。time を後ろから説明する形容詞的用法の to discuss です。"},
  {"s":"Mr. Park was surprised ____ that the project had been canceled.","c":["to hear","hear","heard","hears"],"a":0,"why":"surprised(驚いた)という感情の原因を表すのは副詞的用法の to + 原形。「聞いて驚いた」で to hear です。"},
  {"s":"The new office is large ____ 200 employees.","c":["too to hold","to enough hold","enough to hold","enough holding"],"a":2,"why":"形容詞 + enough to 〜 で「〜するのに十分…」。enough は形容詞 large の後ろに置き、後ろは to + 原形です。"},
  {"s":"Our goal this year is ____ sales by 10 percent.","c":["increase","increased","increases","to increase"],"a":3,"why":"is の後ろで「目標 = 売上を増やすこと」を表す名詞的用法。「〜すること」になる to increase です。"},
  {"s":"Please let me know if you need anything ____ for the trip.","c":["prepares","to prepare","to preparing","prepare"],"a":1,"why":"anything を後ろから説明する形容詞的用法で「準備すべき何か」。to の後ろは原形なので to prepare。to preparing は形がまちがいです。"}
 ]
},
{"id":"g11","lv":2,"t":"動名詞(-ing)と不定詞の使い分け","sub":"-ing は「手ざわりのある動作カード」","cat":"準動詞",
 "img":"動名詞(-ing)は<b>動作を「名詞のカード」にしたもの</b>です。to が「これから向かう矢印」なのに対して、-ing は<span class=\"mk\">実際にしている・したことがある、手ざわりのある動作</span>。だから enjoy(楽しむ)や finish(終える)のように、実際の動作を相手にする動詞は -ing と相性がいいのです。",
 "rule":["動名詞 = 動詞の -ing 形で「〜すること」。主語・目的語・前置詞の後ろに置けます。","-ing だけを目的語にとる動詞: enjoy, finish, avoid, consider, mind, suggest など。","前置詞の後ろは -ing: look forward to -ing, be used to -ing, thank you for -ing。この to は前置詞です。","stop -ing「〜するのをやめる」/ stop to 〜「〜するために立ち止まる」。","remember / forget -ing「(過去に)〜したことを」/ remember / forget to 〜「(これから)〜することを」。"],
 "ex":[
  {"en":"I enjoy cooking on weekends.","ja":"週末は料理を楽しんでいます。","note":"enjoy + -ing"},
  {"en":"We are considering moving to a bigger office.","ja":"もっと大きなオフィスへの移転を検討しています。","note":"consider + -ing"},
  {"en":"I'm looking forward to seeing you.","ja":"お会いできるのを楽しみにしています。","note":"前置詞 to の後ろは -ing"},
  {"en":"Please remember to lock the door.","ja":"忘れずにドアの鍵をかけてください。","note":"これからすること → to"}
 ],
 "trap":"look forward to の to を不定詞だと思って look forward to see としてしまうミスが定番です。この to は前置詞なので、後ろは名詞か -ing。「to の後ろは必ず原形」ではない、と覚えておきましょう。",
 "talk":{"en":"Would you mind opening the window?","ja":"窓を開けていただけませんか?"},
 "build":[
  {"ja":"彼は去年たばこをやめました。","en":"He stopped smoking last year."},
  {"ja":"あなたに会えるのを楽しみにしています。","en":"I look forward to seeing you."},
  {"ja":"宿題をやり終えましたか?","en":"Have you finished doing your homework?"}
 ],
 "q":[
  {"s":"We enjoyed ____ with the clients at the dinner party.","c":["to talk","talking","talk","talked"],"a":1,"why":"enjoy は -ing だけを目的語にとる動詞。「話すことを楽しんだ」で talking です。to talk は使えません。"},
  {"s":"The company is considering ____ a new branch in Fukuoka.","c":["open","to open","opened","opening"],"a":3,"why":"consider(検討する)は -ing を目的語にとる動詞。consider opening で「開設を検討する」です。"},
  {"s":"I look forward to ____ from you soon.","c":["hearing","hear","heard","be heard"],"a":0,"why":"look forward to の to は前置詞なので、後ろは -ing。hear from 〜(〜から連絡をもらう)で hearing です。"},
  {"s":"Would you mind ____ the door for me?","c":["to close","close","closing","closed"],"a":2,"why":"mind(気にする)は -ing を目的語にとる動詞。Would you mind -ing? で「〜していただけませんか」というお願いになります。"},
  {"s":"Drivers should avoid ____ this road during rush hour.","c":["use","to use","using","used"],"a":2,"why":"avoid(避ける)は -ing を目的語にとる動詞。avoid using で「使うのを避ける」です。"},
  {"s":"Thank you for ____ me with the project.","c":["helping","to help","help","helped"],"a":0,"why":"for は前置詞なので、後ろの動詞は -ing。Thank you for helping me. で「手伝ってくれてありがとう」です。"},
  {"s":"Please remember ____ the lights before you leave the office.","c":["turning off","turned off","turn off","to turn off"],"a":3,"why":"before you leave(帰る前に)とあり、これからすることなので remember to 〜「忘れずに〜する」。remember -ing は「(過去に)〜したことを覚えている」です。"},
  {"s":"On the way to the airport, Mr. Hill stopped ____ some gas.","c":["buying","to buy","buy","bought"],"a":1,"why":"空港へ向かう途中で「ガソリンを買うために止まった」場面。stop to 〜 は「〜するために立ち止まる」。stop buying だと「買うのをやめた」になり場面に合いません。"}
 ]
},
{"id":"g12","lv":2,"t":"分詞(-ing / -ed で名詞を説明する)","sub":"動詞が形容詞に変身する","cat":"修飾",
 "img":"分詞は動詞を<b>形容詞に変身させたもの</b>です。-ing は<span class=\"mk\">「〜している・〜させる(する側)」</span>、-ed(過去分詞)は<span class=\"mk\">「〜された・〜させられた(される側)」</span>。感情なら、映画が人を退屈させる → a boring movie、人が退屈させられる → I'm bored。「気持ちを生み出す側か、受け取る側か」で選びます。",
 "rule":["現在分詞(-ing): 「〜している」。a sleeping baby(眠っている赤ちゃん)。","過去分詞(-ed など): 「〜された」。a broken window(割れた窓)。","感情の分詞: 人やモノが感情を与える側なら -ing(exciting)、人が感情を受ける側なら -ed(excited)。","分詞1語なら名詞の前に、ほかの語がつくと名詞の後ろから説明します: the man standing over there / a car made in Japan。"],
 "ex":[
  {"en":"Who is the girl talking with Ken?","ja":"ケンと話している女の子はだれですか?","note":"talking with Ken が後ろから説明"},
  {"en":"The movie was so boring that I fell asleep.","ja":"その映画はとても退屈で、寝てしまいました。","note":"映画は退屈させる側 → -ing"},
  {"en":"I was surprised at the news.","ja":"その知らせに驚きました。","note":"人は驚かされる側 → -ed"},
  {"en":"This is a watch made in Switzerland.","ja":"これはスイス製の腕時計です。","note":"made in 〜 が後ろから説明"}
 ],
 "trap":"「私はわくわくしている」を I'm exciting. と言うと「私は(人を)わくわくさせる人だ」という意味になってしまいます。自分の気持ちは I'm excited. と -ed を使いましょう。",
 "talk":{"en":"I'm so excited about the trip!","ja":"旅行がすごく楽しみです!"},
 "build":[
  {"ja":"その知らせはとても衝撃的でした。","en":"The news was very shocking."},
  {"ja":"あそこで踊っている男の人を知っていますか?","en":"Do you know the man dancing over there?"},
  {"ja":"私は自分の仕事に満足しています。","en":"I am satisfied with my job."}
 ],
 "q":[
  {"s":"The results of the survey were very ____.","c":["surprising","surprised","surprise","to surprise"],"a":0,"why":"主語は results(結果)で、人を驚かせる側。感情を与える側は -ing なので surprising です。"},
  {"s":"Please read the ____ document before the meeting.","c":["attach","attaching","attached","attaches"],"a":2,"why":"書類はメールなどに「添付された」側なので過去分詞 attached。the attached document(添付の書類)はビジネスの定番表現です。"},
  {"s":"The employees ____ in the new project will receive extra training.","c":["involve","involved","involving","are involved"],"a":1,"why":"文の動詞は will receive。employees を後ろから説明する「プロジェクトに関わっている(be involved in)」で、過去分詞 involved が入ります。"},
  {"s":"Ms. Hayes was ____ with the quality of the service.","c":["satisfying","satisfy","satisfaction","satisfied"],"a":3,"why":"人(ヘイズさん)が満足させられる側なので -ed。be satisfied with 〜 で「〜に満足している」です。"},
  {"s":"The man ____ next to Mr. Kent is our new CEO.","c":["stand","stood","stands","standing"],"a":3,"why":"文の動詞は is。The man を後ろから説明する「ケントさんの隣に立っている」なので、現在分詞 standing です。"},
  {"s":"Many people were ____ by the speaker's inspiring story.","c":["moving","moved","move","to move"],"a":1,"why":"人々は話によって「感動させられた」側で、後ろに by もあります。過去分詞 moved です。"},
  {"s":"The museum has a large collection of paintings ____ by local artists.","c":["paint","painting","painted","paints"],"a":2,"why":"絵は地元の画家に「描かれた」側。by local artists をともなって paintings を後ろから説明する過去分詞 painted です。"},

 ],
 "q":[
  {"s":"The meeting will start ____ 9 A.M.","c":["in","on","at","for"],"a":2,"why":"時刻(9 A.M.)は時計の一点なので at。"},
  {"s":"Our office is closed ____ Sundays.","c":["on","in","at","by"],"a":0,"why":"曜日には on。Sundays と複数形にすると「毎週日曜日」の意味になります。"},
  {"s":"Please submit the report ____ Friday.","c":["until","by","during","since"],"a":1,"why":"提出は1回で終わる動作なので、締め切りを表す by。until は動作が続くときに使います。"},
  {"s":"The store will be closed ____ the holidays.","c":["while","since","among","during"],"a":3,"why":"後ろが名詞(the holidays)で「休暇の間」なので during。while は後ろに文が来ます。"},
  {"s":"Mr. Ford has worked here ____ ten years.","c":["for","during","since","in"],"a":0,"why":"ten years は期間の長さなので for。since は始まった時点(since 2015 など)に使います。"},
  {"s":"The new branch will open ____ March.","c":["at","on","in","to"],"a":2,"why":"月(March)は大きな箱なので in。"},
  {"s":"The printer is located ____ the copy machine and the window.","c":["among","through","across","between"],"a":3,"why":"A and B の2つの「間」なので between。among は3つ以上のものの中に使います。"},
  {"s":"You can keep the book ____ next Monday.","c":["by","until","within","at"],"a":1,"why":"keep(持っておく)は続く動作なので、「〜までずっと」の until。"}
 ]},

{"id":"g19","lv":2,"t":"接続詞と前置詞の区別","sub":"文を引っぱる連結車両か、名詞を乗せる荷台か","cat":"前置詞・接続詞",
 "img":"接続詞は後ろに<b>文(主語 + 動詞)</b>を引っぱる<b>「連結車両」</b>、前置詞は後ろに<b>名詞</b>だけを乗せる<b>「荷台」</b>です。意味が同じでも、<span class=\"mk\">乗せられる形がちがう</span>ので、まず空所の後ろを見ます。",
 "rule":["後ろに主語 + 動詞 → 接続詞(although, because, while)","後ろが名詞のカタマリ → 前置詞(despite, in spite of, because of, due to, during)","意味のペア: although = despite / because = because of / while = during","TOEIC: 意味より先に「空所の後ろに動詞があるか」を確認"],
 "ex":[
  {"en":"Although it was raining, we went out.","ja":"雨が降っていたけれど、私たちは出かけました。","note":"although + 文"},
  {"en":"Despite the rain, we went out.","ja":"雨にもかかわらず、私たちは出かけました。","note":"despite + 名詞"},
  {"en":"I stayed home because I had a cold.","ja":"風邪をひいていたので、家にいました。","note":"because + 文"},
  {"en":"I fell asleep during the movie.","ja":"映画の間に眠ってしまいました。","note":"during + 名詞"}
 ],
 "trap":"despite of とは言いません(in spite of と混ざったまちがい)。TOEICでは選択肢の意味がそっくりなので、意味で迷わず、空所の後ろが文か名詞かで決めましょう。",
 "talk":{"en":"Sorry, I'm busy because of a deadline.","ja":"すみません、締め切りのせいで忙しいんです。"},
 "build":[
  {"ja":"雨にもかかわらず、彼らは試合をしました。","en":"They played the game despite the rain."},
  {"ja":"疲れていたけれど、私は勉強しました。","en":"Although I was tired, I studied."},
  {"ja":"会議の間は電話の電源を切ってください。","en":"Please turn off your phone during the meeting."}
 ],
 "q":[
  {"s":"____ the heavy rain, the event was held as scheduled.","c":["Despite","Although","Even though","Because"],"a":0,"why":"後ろが名詞(the heavy rain)だけなので前置詞 Despite。ほかは後ろに文が必要な接続詞です。"},
  {"s":"The flight was delayed ____ bad weather.","c":["because","since","because of","so"],"a":2,"why":"後ろが名詞(bad weather)なので前置詞の because of。because と since は後ろに文が来ます。"},
  {"s":"____ the prices are high, the product sells well.","c":["Despite","In spite of","Because of","Although"],"a":3,"why":"後ろに主語 + 動詞(the prices are)があるので接続詞 Although。"},
  {"s":"Please do not use your phone ____ the presentation.","c":["while","during","although","when"],"a":1,"why":"後ろが名詞(the presentation)なので前置詞の during。while と when は後ろに文が来ます。"},
  {"s":"Ms. Patel checked her email ____ she was waiting for the train.","c":["during","despite","while","because of"],"a":2,"why":"後ろに主語 + 動詞(she was waiting)があり、「〜している間」なので接続詞 while。"},
  {"s":"The project was completed on time ____ a shortage of staff.","c":["although","despite","even if","though"],"a":1,"why":"後ろが名詞(a shortage of staff)なので前置詞の despite。ほかは接続詞です。"},
  {"s":"We will start the meeting ____ everyone arrives.","c":["once","by","during","despite"],"a":0,"why":"後ろに主語 + 動詞(everyone arrives)があるので接続詞。「全員がそろったらすぐ」という意味の once。"},
  {"s":"____ his lack of experience, Mr. Ford was hired as a team leader.","c":["Though","Although","Even though","In spite of"],"a":3,"why":"後ろが名詞(his lack of experience)なので前置詞の In spite of。ほかは後ろに文が必要です。"}
 ]},

{"id":"g20","lv":2,"t":"品詞の見分け","sub":"空所の「席」で入る品詞が決まる","cat":"品詞",
 "img":"品詞は、文の中の<b>「席(ポジション)」</b>です。サッカーでゴールキーパーの位置にはキーパーしか立てないように、<span class=\"mk\">空所の位置を見れば入る品詞が決まります</span>。語尾(-tion, -ly など)は選手の<b>背番号</b>のようなものです。",
 "rule":["名詞の語尾: -tion, -ment, -ness, -ity, -ance","形容詞の語尾: -ful, -ous, -ive, -able, -al / 副詞: 形容詞 + -ly","a / the / 所有格 + ____ → 名詞(形容詞をはさむこともある)","be動詞の後ろ、名詞の前 → 形容詞","動詞の前後、形容詞の前、文の最後 → 副詞 / to や助動詞の後ろ → 動詞の原形"],
 "ex":[
  {"en":"She gave a clear explanation.","ja":"彼女はわかりやすい説明をしました。","note":"-tion = 名詞 / 名詞の前 = 形容詞"},
  {"en":"He explained the plan clearly.","ja":"彼はその計画をわかりやすく説明しました。","note":"-ly = 副詞は動詞を説明"},
  {"en":"This product is very popular.","ja":"この商品はとても人気があります。","note":"be動詞の後ろ = 形容詞"},
  {"en":"We need to decide soon.","ja":"私たちはすぐに決める必要があります。","note":"to の後ろ = 動詞の原形"}
 ],
 "trap":"friendly や lovely は -ly で終わっても形容詞です。語尾だけで決めず、位置で判断しましょう。TOEIC Part 5 の品詞問題は、文の意味を全部読まなくても位置だけで解けることが多く、時間の節約になります。",
 "talk":{"en":"That's a great idea.","ja":"それはすばらしいアイデアですね。"},
 "build":[
  {"ja":"彼はとても上手に英語を話します。","en":"He speaks English very well."},
  {"ja":"その説明はとてもわかりやすかったです。","en":"The explanation was very clear."},
  {"ja":"私たちは慎重に決める必要があります。","en":"We need to decide carefully."}
 ],
 "q":[
  {"s":"The manager made an important ____ about the budget.","c":["announce","announced","announcing","announcement"],"a":3,"why":"an important(冠詞 + 形容詞)の後ろは名詞の席。-ment で終わる announcement。"},
  {"s":"Ms. Patel ____ reviewed the contract before signing it.","c":["carefully","careful","care","carefulness"],"a":0,"why":"主語と動詞(reviewed)の間は、動詞を説明する副詞の席。carefully。"},
  {"s":"The new software is very ____ to use.","c":["ease","easily","easy","easiness"],"a":2,"why":"be動詞 is + very の後ろは形容詞の席。easy。"},
  {"s":"We need to ____ our customer service.","c":["improvement","improve","improving","improved"],"a":1,"why":"to の後ろで、目的語 our customer service をとるので動詞の原形 improve。"},
  {"s":"The hotel offers ____ rooms at reasonable prices.","c":["space","spacious","spaciously","spaciousness"],"a":1,"why":"名詞 rooms の前は、名詞を説明する形容詞の席。-ous で終わる spacious。"},
  {"s":"Sales increased ____ after the advertising campaign.","c":["significant","significance","signify","significantly"],"a":3,"why":"動詞 increased を説明するのは副詞。significantly(大きく)。"},
  {"s":"Applicants must submit their ____ by May 31.","c":["apply","applied","applications","applicable"],"a":2,"why":"所有格 their の後ろは名詞の席で、submit の目的語になります。-tion で終わる applications。"},
  {"s":"The results of the survey were ____ positive.","c":["surprisingly","surprising","surprise","surprised"],"a":0,"why":"形容詞 positive の前で、それを説明するのは副詞。surprisingly(意外にも)。"}
 ]},

{"id":"g21","lv":2,"t":"代名詞","sub":"立つ場所で衣装を替える「代役」","cat":"名詞・代名詞",
 "img":"代名詞は名詞の<b>「代役」</b>です。代役は<span class=\"mk\">立つ場所で衣装(形)を替えます</span>: 主語の席は I、目的語の席は me、持ち主は my、「〜のもの」は mine。one / another / the other は<b>「残りがいくつあるか」</b>で決まり、最後の1つなら特定できるので the が付きます。",
 "rule":["主格 I / 目的格 me / 所有格 my / 所有代名詞 mine(she / her / her / hers)","主語と目的語が同じ人 → -self(by oneself = 一人で)","each other = お互い(動詞や前置詞の後ろに置く)","those who ~ = 〜する人々 / 前に出た複数名詞のくり返しは those","2つなら one と the other / 3つ以上なら one, another, the other(最後の1つ)"],
 "ex":[
  {"en":"Please call me tomorrow.","ja":"明日私に電話してください。","note":"動詞の後ろ = 目的格 me"},
  {"en":"I taught myself to cook.","ja":"私は独学で料理を覚えました。","note":"-self = 自分自身"},
  {"en":"They help each other.","ja":"彼らはお互いに助け合っています。","note":"each other = お互い"},
  {"en":"I have two pens. One is red, and the other is blue.","ja":"ペンを2本持っています。1本は赤で、もう1本は青です。","note":"2つなら one と the other"}
 ],
 "trap":"between you and I はまちがいです。前置詞の後ろは目的格なので between you and me が正しい形です。and でつながると迷いやすいので、1人ずつに分けて考えましょう。",
 "talk":{"en":"Help yourself to some coffee.","ja":"コーヒーをご自由にどうぞ。"},
 "build":[
  {"ja":"私たちはお互いを知っています。","en":"We know each other."},
  {"ja":"彼女は一人でその仕事を終えました。","en":"She finished the work by herself."},
  {"ja":"これは私のものではなく、彼のものです。","en":"This is not mine but his."}
 ],
 "q":[
  {"s":"Mr. Lee asked ____ to join the project team.","c":["I","me","my","mine"],"a":1,"why":"動詞 asked の後ろは目的語の席なので目的格 me。"},
  {"s":"Ms. Patel finished the report by ____.","c":["she","her","herself","hers"],"a":2,"why":"by oneself で「一人で」。主語が Ms. Patel なので herself。"},
  {"s":"The two companies have worked with ____ for many years.","c":["each other","themselves","other","the other"],"a":0,"why":"2つの会社が「お互いに」協力してきたので each other。"},
  {"s":"This laptop is not mine. It is ____.","c":["her","she","herself","hers"],"a":3,"why":"「彼女のもの」は所有代名詞 hers。her だけでは後ろに名詞が必要です。"},
  {"s":"____ who wish to attend the seminar should register online.","c":["That","Them","These","Those"],"a":3,"why":"those who ~ で「〜する人々」。Them は主語になれません。"},
  {"s":"I have two brothers. One lives in Osaka, and ____ lives in Tokyo.","c":["another","the other","other","others"],"a":1,"why":"2人のうち残りの1人は特定できるので the other。another は残りが2つ以上あるときに使います。"},
  {"s":"The sales figures for this year are better than ____ for last year.","c":["those","that","these","them"],"a":0,"why":"くり返しをさける the sales figures は複数なので those。that は単数の名詞のくり返しに使います。"},
  {"s":"Our team has three new members. One is from Canada, another is from Brazil, and ____ is from India.","c":["other","others","the other","each"],"a":2,"why":"3人のうち最後に残った1人は特定できるので the other。"}
 ]},

{"id":"g22","lv":2,"t":"主語と動詞の一致・数えられる名詞","sub":"サイズをそろえるペアと、形のない「水や砂」","cat":"名詞・代名詞",
 "img":"主語と動詞は<b>「サイズをそろえるペア」</b>です。主語が1つなら動詞も単数サイズ(has, is, -s)。each / every は<span class=\"mk\">1人ずつスポットライトを当てる</span>ので単数です。information や advice のような数えられない名詞は、<b>形が決まっていない水や砂</b>のようなもので、a も -s も付きません。",
 "rule":["each / every + 単数名詞 → 単数の動詞(Every student has ~)","a number of + 複数名詞 → 複数の動詞 / the number of ~ → 単数の動詞","many / few = 数えられる名詞、much / little = 数えられない名詞","a few / a little = 少しある、few / little = ほとんどない","information, advice, equipment, furniture, baggage は数えられない"],
 "ex":[
  {"en":"Every student has a tablet.","ja":"すべての生徒がタブレットを持っています。","note":"every + 単数名詞 + 単数の動詞"},
  {"en":"A number of people are waiting outside.","ja":"たくさんの人が外で待っています。","note":"a number of = たくさんの → 複数"},
  {"en":"The number of cars is increasing.","ja":"車の数が増えています。","note":"the number = 「数」1つ → 単数"},
  {"en":"Can you give me some advice?","ja":"アドバイスをもらえますか。","note":"advice は数えられない"}
 ],
 "trap":"The list of names ____ のように主語が長いと、すぐ前の names につられて are を選びがちです。本当の主語(list)を見つけてから動詞を選びましょう。",
 "talk":{"en":"How much time do we have?","ja":"時間はどれくらいありますか。"},
 "build":[
  {"ja":"それぞれの部屋にテレビがあります。","en":"Each room has a TV."},
  {"ja":"私たちにはもうほとんど時間が残っていません。","en":"We have very little time left."},
  {"ja":"たくさんの人がそのイベントに来ました。","en":"A number of people came to the event."}
 ],
 "q":[
  {"s":"Each employee ____ a security card.","c":["have","are having","has","having"],"a":2,"why":"each + 単数名詞は単数あつかいなので has。"},
  {"s":"A number of customers ____ complained about the delay.","c":["has","is","was","have"],"a":3,"why":"a number of ~ は「たくさんの〜」で複数あつかい。後ろが過去分詞 complained なので have。"},
  {"s":"The number of visitors ____ increasing every year.","c":["are","is","have","were"],"a":1,"why":"主語の中心は the number(数)で単数。後ろが increasing なので is。"},
  {"s":"We don't have ____ information about the new product yet.","c":["much","many","a few","several"],"a":0,"why":"information は数えられない名詞なので much。many, a few, several は数えられる名詞に使います。"},
  {"s":"Very ____ people attended the meeting because of the snow.","c":["few","little","much","less"],"a":0,"why":"people は数えられる名詞で、「ほとんどいない」なので few。little と much は数えられない名詞に使います。"},
  {"s":"The office needs some new ____.","c":["furnitures","furniture's","furniture","a furniture"],"a":2,"why":"furniture は数えられない名詞なので、-s も a も付けない furniture。"},
  {"s":"There is ____ time left before the deadline, so we must hurry.","c":["few","a few","many","little"],"a":3,"why":"time(時間)は数えられない名詞で、「急がなければ」とあるので「ほとんどない」の little。"},
  {"s":"Every manager and employee ____ invited to the year-end party.","c":["are","is","were","have"],"a":1,"why":"every A and B は「一人ひとり」を見るので単数あつかい。is。"}
 ]},

{"id":"g23","lv":1,"t":"疑問文の作り方","sub":"語順の入れかえゲーム","cat":"文の基本",
 "img":"疑問文は<b>「語順の入れかえゲーム」</b>です。主語と be動詞・助動詞をひっくり返すと質問になります。ただし Could you tell me ~ のように文の中に入れると、<span class=\"mk\">質問の箱に入ったので、もう入れかえない(普通の文の順番に戻る)</span>のがポイントです。",
 "rule":["疑問詞(what, where, when, who, why, how)は文の先頭","be動詞・助動詞は主語の前へ。一般動詞は do / does / did を使う","間接疑問: Do you know + 疑問詞 + 主語 + 動詞(where the station is)","Yes / No の間接疑問は if / whether(I wonder if ~)","付加疑問: 前が肯定なら否定、否定なら肯定の短い疑問を付ける(~, isn't it?)"],
 "ex":[
  {"en":"Where do you live?","ja":"どこに住んでいますか。","note":"疑問詞 + do + 主語 + 動詞"},
  {"en":"Could you tell me where the station is?","ja":"駅がどこか教えていただけますか。","note":"間接疑問は 主語 + 動詞 の順"},
  {"en":"You're from Osaka, aren't you?","ja":"大阪出身ですよね。","note":"付加疑問 = 確認"},
  {"en":"Sorry, could you say that again?","ja":"すみません、もう一度言っていただけますか。","note":"聞き返しの定番"}
 ],
 "trap":"Could you tell me where is the station? としがちですが、文の中に入ったら where the station is の順です。付加疑問は前の動詞に合わせます(She hasn't ~ → has she?)。",
 "talk":{"en":"Sorry, what did you say?","ja":"すみません、何とおっしゃいましたか。"},
 "build":[
  {"ja":"会議が何時に始まるか知っていますか。","en":"Do you know what time the meeting starts?"},
  {"ja":"あなたはどれくらい英語を勉強していますか。","en":"How long have you studied English?"},
  {"ja":"今日は寒いですよね。","en":"It's cold today, isn't it?"}
 ],
 "q":[
  {"s":"____ is the meeting room? — It's on the third floor.","c":["Where","When","Who","What"],"a":0,"why":"答えが「3階です」という場所なので Where。"},
  {"s":"Could you tell me where ____?","c":["is the station","the station is","does the station","the station does"],"a":1,"why":"Could you tell me の後ろは間接疑問なので、主語 + 動詞の順(the station is)。"},
  {"s":"You work in the sales department, ____ you?","c":["do","aren't","are","don't"],"a":3,"why":"前の文が一般動詞 work の肯定文なので、付加疑問は否定の don't you。"},
  {"s":"____ long have you worked for this company?","c":["What","Which","How","When"],"a":2,"why":"How long で「どれくらいの期間」。"},
  {"s":"Do you know when ____?","c":["will the shipment arrive","the shipment will arrive","does the shipment arrive","arrives the shipment"],"a":1,"why":"Do you know の後ろは間接疑問なので、主語 + 動詞の順(the shipment will arrive)。"},
  {"s":"____ bag is this? — It's Ms. Patel's.","c":["Whose","Who's","Whom","Who"],"a":0,"why":"答えが「パテルさんのもの」なので、「誰の」をたずねる Whose。後ろに名詞 bag を置けるのも Whose だけです。"},
  {"s":"Ms. Patel hasn't arrived yet, ____ she?","c":["is","isn't","has","hasn't"],"a":2,"why":"前が hasn't の否定文なので、付加疑問は肯定の has she。"},
  {"s":"I wonder ____ the client will accept our proposal.","c":["what","that","which","whether"],"a":3,"why":"後ろが完全な文で「受け入れるかどうか」なので whether。what や which だと後ろに抜けている語が必要です。"}
 ]},

{"id":"g24","lv":4,"t":"倒置・強調・省略","sub":"スポットライト演出と、あうんの呼吸","cat":"特殊構文",
 "img":"倒置は<b>「スポットライト演出」</b>です。言いたい言葉(Never, Only after など)を舞台の最前列に出すと、<span class=\"mk\">後ろは疑問文の語順にひっくり返ります</span>。強調構文 It is ~ that は「〜こそが」と<b>額縁で囲む</b>演出。省略は、言わなくてもわかる部分をカットする<b>「あうんの呼吸」</b>です。",
 "rule":["否定語(Never, Rarely, Little, Not only)が文頭 → 助動詞 + 主語 + 動詞","Only + 時・条件(Only after ~, Only if ~)が文頭 → 後ろの文が倒置","It is A that ~ = 〜なのはAだ(Aが人なら who も可)","if necessary / if possible: 主語 + be動詞(it is)を省略","while staying ~: 接続詞の後ろの 主語 + be動詞 を省略(While I was staying)"],
 "ex":[
  {"en":"Never have I seen such a beautiful view.","ja":"こんなに美しい景色は見たことがありません。","note":"否定語が先頭 → 疑問文の語順"},
  {"en":"Only after the meeting did I understand the plan.","ja":"会議の後になって初めて、その計画がわかりました。","note":"Only + 時 → 後ろが倒置"},
  {"en":"It was Tom that broke the window.","ja":"窓を割ったのはトムでした。","note":"It was ~ that = 〜こそが"},
  {"en":"Call me if necessary.","ja":"必要なら電話してください。","note":"if (it is) necessary の省略"}
 ],
 "trap":"Never I have seen はまちがいです。倒置になるのは否定語が文頭に来たときだけで、I have never seen ~ と普通の位置に置くときは倒置しません。",
 "talk":{"en":"Let me know by Friday, if possible.","ja":"できれば金曜日までに知らせてください。"},
 "build":[
  {"ja":"こんなに疲れたことはありません。","en":"Never have I been so tired."},
  {"ja":"窓を割ったのはケンでした。","en":"It was Ken who broke the window."},
  {"ja":"必要ならお手伝いできます。","en":"I can help you if necessary."}
 ],
 "q":[
  {"s":"Never ____ such a successful product launch.","c":["I have seen","I saw","have seen I","have I seen"],"a":3,"why":"否定語 Never が文頭にあるので、疑問文の語順(have + I + seen)に倒置します。"},
  {"s":"Only after the contract was signed ____ the project begin.","c":["it did","does","did","was"],"a":2,"why":"Only after ~ が文頭なので後ろは倒置。過去の話で、後ろが原形 begin なので did。"},
