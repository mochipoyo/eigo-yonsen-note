const NUMW=['zero','one','two','three','four','five','six','seven','eight','nine','ten','eleven','twelve','thirteen','fourteen','fifteen','sixteen','seventeen','eighteen','nineteen','twenty'];
function normWords(s){
 s=s.toLowerCase().replace(/[’‘]/g,"'")
  .replace(/\bwon't\b/g,'will not').replace(/\bcan't\b/g,'can not').replace(/\bcannot\b/g,'can not').replace(/\bshan't\b/g,'shall not')
  .replace(/n't\b/g,' not').replace(/'re\b/g,' are').replace(/'m\b/g,' am').replace(/'ll\b/g,' will').replace(/'ve\b/g,' have').replace(/'d\b/g,' would')
  .replace(/\b(\d+)\b/g,(m,d)=>NUMW[+d]||d).replace(/%/g,' percent').replace(/&/g,' and ')
  .replace(/[^a-z0-9' ]+/g,' ').replace(/'s\b/g,'s').replace(/'/g,'');
 return s.split(/\s+/).filter(Boolean);
}
function lcsMatch(a,b){// a=expected words, b=heard words -> [lcsLen, hit flags for a]
 const n=a.length,m=b.length,dp=Array.from({length:n+1},()=>new Array(m+1).fill(0));
 for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)dp[i][j]=a[i]===b[j]?dp[i+1][j+1]+1:Math.max(dp[i+1][j],dp[i][j+1]);
 const hit=new Array(n).fill(false);let i=0,j=0;
 while(i<n&&j<m){if(a[i]===b[j]){hit[i]=true;i++;j++}else if(dp[i+1][j]>=dp[i][j+1])i++;else j++}
 return [dp[0][0],hit];
}
function scoreSpeech(expected,alts){
 const ew=normWords(expected);let best={score:0,heard:alts[0]||'',hit:ew.map(()=>false)};
 for(const h of alts){const hw=normWords(h);const [l,hit]=lcsMatch(ew,hw);const sc=Math.round(200*l/(ew.length+hw.length||1));if(sc>best.score)best={score:sc,heard:h,hit}}
 // 表示用: 元の単語ごとに当否(短縮形の展開で語数がずれる場合は全体スコアのみ)
 const ow=expected.split(/\s+/);let k=0;
 best.marks=ow.map(w=>{const n=normWords(w).length;const ok=n===0||best.hit.slice(k,k+n).every(Boolean);k+=n;return `<span class="${ok?'hit':'miss'}">${esc(w)}</span>`}).join(' ');
 return best;
}

function confetti(){const cv=document.getElementById('fx');if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;const c=cv.getContext('2d');cv.width=innerWidth;cv.height=innerHeight;
 const cols=['#d9473b','#2a63c4','#1f8455','#ffe04a'];const P=Array.from({length:90},()=>({x:innerWidth/2,y:innerHeight*.35,vx:(Math.random()-.5)*12,vy:Math.random()*-12-3,r:Math.random()*6+3,c:cols[Math.floor(Math.random()*4)],a:Math.random()*6}));
 let f=0;(function tick(){c.clearRect(0,0,cv.width,cv.height);P.forEach(p=>{p.vy+=.35;p.x+=p.vx;p.y+=p.vy;p.a+=.2;c.save();c.translate(p.x,p.y);c.rotate(p.a);c.fillStyle=p.c;c.fillRect(-p.r/2,-p.r/4,p.r,p.r/2);c.restore()});if(++f<110)requestAnimationFrame(tick);else c.clearRect(0,0,cv.width,cv.height)})()}

function buildView(P,u){

  wireSay(P);

  const upd=()=>{slot.innerHTML=picked.map((j,x)=>`<button class="tile" data-x="${x}">${esc(pool[j].w)}</button>`).join('');
   poolEl.querySelectorAll('.tile').forEach(t=>t.classList.toggle('used',picked.includes(+t.dataset.j)));
   slot.querySelectorAll('.tile').forEach(t=>t.onclick=()=>{picked.splice(+t.dataset.x,1);slot.className='slot';upd()});
   chk.disabled=picked.length!==words.length};
  poolEl.querySelectorAll('.tile').forEach(t=>t.onclick=()=>{const j=+t.dataset.j;if(picked.includes(j))return;picked.push(j);upd()});
  P.querySelector('#clr').onclick=()=>{picked=[];slot.className='slot';upd()};
  chk.onclick=()=>{const s=picked.map(j=>pool[j].w).join(' ');const ok=s===b.en;
   if(!ok){tries++;slot.className='slot ng';
    P.querySelector('#bfb').innerHTML=`<p class="bad" style="margin-top:10px">${tries>=2?`正解は <span class="en good">${esc(b.en)}</span>`:'語順がちがうようです。もう一度!'}</p>`;
    if(tries>=2){chk.textContent='つぎへ';chk.disabled=false;chk.onclick=next}return}
   slot.className='slot ok';S.answered++;S.correct++;addXP(tries?5:10);
   P.querySelector('#bfb').innerHTML=`<div class="fb ok" style="margin-top:12px">${hana}<div><div class="verdict">正解!</div><div class="en">${esc(b.en)}</div></div></div>`;
   speak(b.en);chk.textContent=k+1<u.build.length?'つぎへ →':'チャレンジへ →';chk.onclick=next;
  };
  upd();
 };

}

function vocabSet(n){
 const due=vDue().filter(w=>w.lv<=Math.max(S.vlv,1)+1).slice(0,n);
 const fresh=shuffle(VOC.filter(w=>w.lv===S.vlv&&!vState(w))).slice(0,n-due.length);
 let set=[...due,...fresh];
 if(set.length<n)set=set.concat(shuffle(VOC.filter(w=>w.lv===S.vlv&&!set.includes(w))).slice(0,n-set.length));
 return shuffle(set);

  const vf=app.querySelector('#vf');

   <div class="next"><button class="btn hl" id="vn">つぎへ →</button></div>`;
  wireSay(vf);if(!ok)speak(w.w);
  vf.querySelector('#vn').onclick=()=>{R.i++;render()};vf.querySelector('#vn').scrollIntoView({block:'nearest',behavior:'smooth'});
 });
};
function vEnd(app){const R=RT.v;if(!R.ended){R.ended=true;checkBadges();save()}
 const n=R.set.length+R.again.length;
 app.innerHTML=`<div class="row">${backBtn('単語メニュー',{name:'vocab'})}</div>
 <section class="sheet result"><div class="eyebrow">VOCABULARY</div><div class="big" style="margin-top:10px">${R.ok}<small style="font-size:22px"> / ${n}</small></div>
  <div class="gain"><span>獲得 <b>${S.xp-R.xp0}</b> XP</span><span>定着した単語 <b>${vMastered()}</b> 語</span><span>次に復習する単語 <b>${vDue().length}</b> 語</span></div>
  <div class="row" style="justify-content:center"><button class="btn hl" id="again">${IC.redo}もう10語</button><button class="btn ghost" data-go='{"name":"vocab"}'>単語メニュー</button></div></section>
 <section class="sheet panel"><h3 class="eyebrow">今回の単語</h3><div class="wl" style="margin-top:8px">${R.set.map(w=>`<div class="wi">${sayBtn(w.w)}<div><span class="w">${esc(w.w)}</span><span class="m">${esc(w.m)}</span></div>${dots(w)}</div>`).join('')}</div></section>`;
 wireGo(app);wireSay(app);app.querySelector('#again').onclick=()=>startVocab(R.mode);
}
const dots=w=>{const b=(vState(w)||{b:0}).b;return `<span class="dots" title="箱${b}">${[1,2,3,4,5].map(i=>`<i class="${i<=b?'on':''}"></i>`).join('')}</span>`};
VIEWS.vlist=function(app){
 const q=(V.q||'').toLowerCase();const lv=V.lv||S.vlv;
 const list=VOC.filter(w=>(q?(w.w.toLowerCase().includes(q)||w.m.includes(q)):w.lv===lv));
 app.innerHTML=`<div class="row">${backBtn('単語メニュー',{name:'vocab'})}</div>
 <div class="uhead"><h1>単語リスト</h1></div>
 <input class="search" id="sq" placeholder="英語か日本語で検索" value="${esc(V.q||'')}" aria-label="単語を検索">
 <div class="tabs">${LV.map(l=>`<button class="tab" data-lv="${l.n}" aria-selected="${!q&&lv===l.n}">${l.k}<small>${l.s}</small></button>`).join('')}</div>
 <section class="sheet panel"><small>${list.length} 件</small><div class="wl" style="margin-top:8px">${list.map(w=>`<div class="wi">${sayBtn(w.w)}<div><span class="w">${esc(w.w)}</span> <small>${PN[w.p]||''}</small><span class="m">${esc(w.m)}</span><span class="m en">${esc(w.e)}</span></div>${dots(w)}</div>`).join('')||'<p>見つかりませんでした。</p>'}</div></section>`;
 wireGo(app);wireSay(app);
 const sq=app.querySelector('#sq');let tm;sq.oninput=()=>{clearTimeout(tm);tm=setTimeout(()=>{V={...V,q:sq.value};history.replaceState(V,'');render();const n=document.getElementById('sq');n.focus();n.setSelectionRange(n.value.length,n.value.length)},300)};
 app.querySelectorAll('[data-lv]').forEach(b=>b.onclick=()=>go({name:'vlist',lv:+b.dataset.lv},true));
};

// ===== TOEIC形式の演習 =====
const VC={W:'f',M:'m',W2:'f',M2:'m'};
function p2Item(q,i){return {s:'<span style="font-family:var(--f-body);font-size:15px">音声を聞いて、問いかけに対する最も適切な応答を (A)(B)(C) から選んでください。</span>',jaQ:true,
 c:q.o,a:q.a,keep:true,hideOpts:true,label:'Part 2 ・ '+q.type,ref:{t:'p2',i},
 audio:[{text:q.q,g:i%2?'m':'f',gap:700},...q.o.map((o,k)=>({text:'('+'ABC'[k]+') '+o,g:i%2?'f':'m',gap:500}))],
 why:q.why,ja:`<span class="en">Q: ${esc(q.q)}</span>`,review:`<span class="en">${esc(q.q)}</span>`}}
function p5Item(q,i){return {s:blankify(q.s),c:q.c,a:q.a,why:q.why,label:'Part 5 ・ '+q.k,ref:{t:'p5',i},review:blankify(q.s)}}
function rec(part,r){S.tc[part][0]+=r.ok;S.tc[part][1]+=r.n}
const PARTS=[
 {id:'p2',n:'Part 2',t:'応答問題',d:'問いかけを聞いて、自然な返事を3つから選ぶ。会話の瞬発力がつく',cnt:()=>P2.length+'問',run:()=>{const qs=pick(P2.map((q,i)=>({q,i})),10);startQuiz({title:'Part 2 応答問題',back:{name:'toeic'},backLabel:'TOEIC形式',items:qs.map(({q,i})=>p2Item(q,i)),onEnd:r=>rec('p2',r),retry:PARTS[0].run})}},
 {id:'p3',n:'Part 3',t:'会話問題',d:'2〜3人の会話を聞いて、設問に答える',cnt:()=>P3.length+'会話',run:()=>{const cs=pick(P3,2);const items=[];
  cs.forEach(c=>{const audio=c.lines.map(l=>({text:l.en,g:VC[l.s]||'f'}));const script=`<details class="more"><summary>スクリプトと訳を見る</summary><div class="passage" style="margin-top:8px;max-height:none">${c.lines.map(l=>`<b>${l.s.replace(/2$/,'')}:</b> ${esc(l.en)}`).join('\n')}</div><div class="trn">${esc(c.ja)}</div></details>`;
   c.qs.forEach((q,k)=>items.push({s:esc(q.q),c:q.o,a:q.a,why:q.why,label:'Part 3 ・ '+c.title,audio:k===0?audio:audio,autoplay:k===0,audioNote:k===0?'会話は1回だけ流れます(練習なので何度でも聞き直せます)':'',after:script,oneCol:true}))});
  startQuiz({title:'Part 3 会話問題',back:{name:'toeic'},backLabel:'TOEIC形式',items,onEnd:r=>rec('p3',r),retry:PARTS[1].run})}},
 {id:'p5',n:'Part 5',t:'短文穴埋め',d:'文法と語彙の4択。空所の前後だけで解ける問題を素早く',cnt:()=>P5.length+'問',run:lv=>{const pool=P5.map((q,i)=>({q,i})).filter(x=>!lv||x.q.lv===lv);const qs=pick(pool,10);startQuiz({title:'Part 5 短文穴埋め'+(lv?`(${LV[lv-1].k})`:''),back:{name:'toeic'},backLabel:'TOEIC形式',items:qs.map(({q,i})=>p5Item(q,i)),onEnd:r=>rec('p5',r),retry:()=>PARTS[2].run(lv)})}},
 {id:'p6',n:'Part 6',t:'長文穴埋め',d:'メールや告知の空所を埋める。文を選ぶ問題は前後の流れがカギ',cnt:()=>P6.length+'文書',run:()=>{const d=pick(P6,1)[0];
  const ctx=`<div class="eyebrow">${esc(d.kind)}</div><div class="passage">${esc(d.title)}\n\n${esc(d.text).replace(/\[(\d)\]/g,'<span class="gap">[$1]</span>')}</div>`;
  startQuiz({title:'Part 6 長文穴埋め',back:{name:'toeic'},backLabel:'TOEIC形式',items:d.qs.map(q=>({s:`空所 <b>[${q.n}]</b> に入る最も適切なものは?`,jaQ:true,c:q.o,a:q.a,why:q.why,ctx,label:'Part 6',oneCol:true,after:`<details class="more"><summary>日本語訳を見る</summary><div class="trn">${esc(d.ja)}</div></details>`})),onEnd:r=>rec('p6',r),retry:PARTS[3].run})}},
 {id:'p7',n:'Part 7',t:'読解',d:'メール・広告・チャットなどを読んで答える。言いかえを見抜く力',cnt:()=>P7.length+'文書',run:()=>{const ds=pick(P7,2);const items=[];
  ds.forEach(d=>{const ctx=`<div class="eyebrow">${esc(d.kind)}</div><div class="passage">${d.title?esc(d.title)+'\n\n':''}${esc(d.text)}</div>`;
   d.qs.forEach(q=>items.push({s:esc(q.q),c:q.o,a:q.a,why:q.why,ctx,label:'Part 7 ・ '+d.kind,oneCol:true,after:`<details class="more"><summary>日本語訳を見る</summary><div class="trn">${esc(d.ja)}</div></details>`}))});
  startQuiz({title:'Part 7 読解',back:{name:'toeic'},backLabel:'TOEIC形式',items,onEnd:r=>rec('p7',r),retry:PARTS[4].run})}}];
VIEWS.toeic=function(app){
 app.innerHTML=`
 <div class="row">${backBtn('ホーム',{name:'home'})}</div>
 <div class="uhead"><span class="eyebrow">TOEIC L&amp;R STYLE</span><h1>TOEIC形式 演習</h1><p>本番と同じ形式のオリジナル問題です。音声はブラウザの読み上げなので、本番の録音とは聞こえ方が違う点に注意してください。</p></div>
 <section class="sheet"><div class="units">${PARTS.map((p,k)=>{const c=S.tc[p.id];return `<button class="unit" data-p="${k}"><span class="no" style="font-size:11px">${p.n.slice(5)}</span><span><span class="tt">${p.n} ${p.t}</span><span class="tg">${p.d} ・ ${p.cnt()}</span></span><small class="en">${c[1]?Math.round(c[0]/c[1]*100)+'%':'—'}</small></button>`}).join('')}</div></section>
 <section class="sheet panel"><h3 class="eyebrow">Part 5 をレベル別に</h3><div class="row" style="margin-top:8px">${LV.map(l=>`<button class="btn ghost sm" data-l="${l.n}">${l.k} ${l.s}</button>`).join('')}</div></section>
 <section class="sheet panel">
  <h2 style="font-family:var(--f-disp);font-weight:400;font-size:20px">TOEIC L&amp;R の形式と、900点への道すじ</h2>
  <div class="blk"><h3>本番の形式(公開テスト)</h3>
  <div style="overflow-x:auto"><table class="fmt"><tr><th>パート</th><th>内容</th><th>問題数</th></tr>
   <tr><td colspan="3"><b>リスニング</b> 約45分・100問</td></tr>
   <tr><td>Part 1</td><td>写真描写</td><td>6</td></tr><tr><td>Part 2</td><td>応答問題</td><td>25</td></tr><tr><td>Part 3</td><td>会話問題(1会話3問)</td><td>39</td></tr><tr><td>Part 4</td><td>説明文問題(1トーク3問)</td><td>30</td></tr>
   <tr><td colspan="3"><b>リーディング</b> 75分・100問</td></tr>
   <tr><td>Part 5</td><td>短文穴埋め</td><td>30</td></tr><tr><td>Part 6</td><td>長文穴埋め(1文書4問)</td><td>16</td></tr><tr><td>Part 7</td><td>読解(1つの文書29問・複数の文書25問)</td><td>54</td></tr></table></div>
  <p><small>合計 約2時間・200問、スコアは10〜990点(5点刻み)。出典:IIBC公式サイト「TOEIC Listening &amp; Reading Test」の出題形式ページ(2026年10月確認)。形式は変わることがあるので、受験前に公式サイトで確認してください。このアプリには、写真が必要な Part 1 と、Part 4 はまだありません。</small></p></div>
  <div class="blk"><h3>900点を目指すときの考え方(一般的な学習法)</h3>
  <ul style="margin:0;padding-left:1.2em">
   <li><b>語彙と文法は「速く」解けるまで</b>:リーディングは時間が足りなくなりやすい試験です。Part 5 は1問あたり短い時間で解く練習を。</li>
   <li><b>言いかえ(パラフレーズ)に慣れる</b>:Part 3・7 の正解は本文と同じ言葉ではなく、別の表現で書かれていることが多いです。</li>
   <li><b>声に出す練習はリスニングにも効く</b>:自分で言える表現は聞き取りやすくなります。会話ロールプレイの発話練習も活用してください。</li>
   <li><b>本番形式の模試で時間配分を確認</b>:このアプリは練習用です。仕上げは公式問題集など本番と同じ分量の問題で、時間を計って解きましょう。</li>
  </ul>
  <p class="note" style="margin-top:12px">必要な学習時間やスコアの伸びは、今の実力・学習時間・やり方によって大きく変わります。このアプリだけで特定のスコアを保証するものではありません。</p></div>
 </section>`;
 wireGo(app);
 app.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>PARTS[+b.dataset.p].run());
 app.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>PARTS[2].run(+b.dataset.l));
};

// ===== main =====
applyTheme();
document.getElementById('home').onclick=()=>go({name:'home'});
document.getElementById('gear').onclick=()=>go({name:'settings'});
try{history.replaceState(V,'')}catch(e){}
render();

</script>
