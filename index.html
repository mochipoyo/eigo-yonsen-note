   {"en":"Hi! Nice to meet you, too.","ok":true,"fb":"相手が名乗ったら Nice to meet you, too. と返し、自分の名前を続けましょう。"}]},
  {"who":"p","en":"So, what do you do?","ja":"それで、お仕事は何をしているんですか?"},
  {"who":"me","ja":"IT企業でソフトウェアエンジニアをしていると伝えたい","opts":[
   {"en":"I'm a software engineer at a tech company.","ok":true,"fb":"I'm a 職業 at 会社の種類. の形で簡単に言えます。I work in IT. でもOKです。"},
   {"en":"I'm doing now engineer.","ok":false,"fb":"文法がくずれています。I'm an engineer. で十分です。"},
   {"en":"I do my best every day.","ok":false,"fb":"「毎日がんばってます」という答えで、仕事の内容が伝わりません。"}]},
  {"who":"p","en":"Oh, cool! That must keep you busy.","ja":"へえ、すごい!忙しいでしょうね。"},
  {"who":"me","ja":"忙しいけど楽しい、と言って、相手の趣味を聞きたい","opts":[
   {"en":"Yes. What is your hobby?","ok":false,"fb":"文法は正しいですが、面接のような堅い聞き方です。雑談なら What do you do for fun? が自然です。"},
   {"en":"It does, but I love it. What do you do for fun?","ok":true,"fb":"It does は That must keep you busy への返事。質問を返すと会話が続きます。"},
   {"en":"Yes, I'm very busy. Goodbye.","ok":false,"fb":"会話をいきなり終わらせてしまいます。相手がびっくりします。"}]},
  {"who":"p","en":"I'm really into rock climbing. I just started last month.","ja":"最近ロッククライミングにはまってるんです。先月始めたばかりで。"},
  {"who":"me","ja":"楽しそう!ずっとやってみたかった","opts":[
   {"en":"It sounds funny!","ok":false,"fb":"funny は「おかしい・笑える」です。「楽しい」は fun を使います。"},
   {"en":"I want to try it always.","ok":false,"fb":"「いつも試したい」と意味がずれています。「ずっと~したかった」は I've always wanted to ~ です。"},
   {"en":"That sounds like fun! I've always wanted to try it.","ok":true,"fb":"I've always wanted to ~ で「ずっと~してみたかった」。相手もうれしくなる返事です。"}]},
  {"who":"p","en":"Really? You should come with us next Saturday! Beginners are welcome.","ja":"本当?今度の土曜日、一緒に来なよ!初心者大歓迎だよ。"},
  {"who":"me","ja":"ぜひ行きたい!(落ちても笑わないでね)","opts":[
   {"en":"I'd love to! Just don't laugh if I fall.","ok":true,"fb":"I'd love to! は「ぜひ!」という前向きな返事。ちょっとした冗談で距離も縮まります。"},
   {"en":"I'll think about it maybe.","ok":false,"fb":"「考えておきます」は遠回しな断りに聞こえます。行きたい気持ちが伝わりません。"},
   {"en":"Yes, I go!","ok":false,"fb":"未来の予定なので I go は不自然です。I'll go! か I'd love to! と言います。"}]},
  {"who":"p","en":"Ha ha, deal! Let's swap numbers.","ja":"あはは、約束ね!連絡先を交換しよう。"}],
 "wrap":"What do you do? と What do you do for fun? は雑談の二本柱です。答えたあとに質問を返すと、会話が自然に続きます。"},

{"id":"t06","lv":2,"t":"レストランで注文とトラブル","place":"Restaurant","partner":"Server","pv":"m",
 "goal":"おすすめを聞いて注文し、料理がまちがっていたらやんわり伝えましょう。",
 "phrases":[
  {"en":"What do you recommend?","ja":"おすすめは何ですか?","tip":"迷ったらこれ。お店の人も喜んで答えてくれます。"},
  {"en":"I'll have the salmon.","ja":"サーモンにします。","tip":"<b>I'll have ~</b> は注文の定番です。"},
  {"en":"Excuse me, I think there's a mistake.","ja":"すみません、間違いがあるようです。","tip":"<b>I think</b> を付けると、角が立たずにやわらかく伝わります。"},
  {"en":"No worries at all.","ja":"全然気にしないでください。","tip":"謝られたときの、やさしい返事です。"},
  {"en":"Could I get the check, please?","ja":"お会計をお願いします。","tip":"アメリカでは check、イギリスでは bill と言います。"}],
 "lines":[
  {"who":"p","en":"Good evening! Are you ready to order, or do you need a few more minutes?","ja":"こんばんは!ご注文はお決まりですか、それとももう少しお時間が必要ですか?"},
  {"who":"me","ja":"だいたい決まったけど、おすすめを聞きたい","opts":[
   {"en":"I'm almost ready. What do you recommend?","ok":true,"fb":"What do you recommend? は自然で感じのいい聞き方です。"},
   {"en":"Which is delicious?","ok":false,"fb":"「どれがおいしいの?」は、ほかがまずいと言っているようで失礼に聞こえることがあります。"},
   {"en":"Please recommend me.","ok":false,"fb":"「私を推薦して」という意味になってしまいます。"}]},
  {"who":"p","en":"The grilled chicken is really popular, and the mushroom pasta is my personal favorite.","ja":"グリルチキンがとても人気で、マッシュルームのパスタは僕の一番のお気に入りです。"},
  {"who":"me","ja":"じゃあ、マッシュルームのパスタにする","opts":[
   {"en":"I'm the pasta.","ok":false,"fb":"「私はパスタです」になってしまいます。日本語の「私はパスタ」の直訳に注意です。"},
   {"en":"I'll have the chicken.","ok":false,"fb":"注文したいのはパスタなので、内容がちがいます。"},
   {"en":"Then I'll have the mushroom pasta, please.","ok":true,"fb":"I'll have ~ は注文の基本形。I'd like the mushroom pasta. も丁寧です。"}]},
  {"who":"p","en":"Great choice! Coming right up. Here you go, one grilled chicken. Enjoy!","ja":"いい選択です!すぐお持ちします。お待たせしました、グリルチキンです。どうぞ!"},
  {"who":"me","ja":"頼んだのはパスタなので、やんわり伝えたい","opts":[
   {"en":"This is wrong! Change it.","ok":false,"fb":"命令文で強く、怒っているように聞こえます。"},
   {"en":"Excuse me, I think I ordered the mushroom pasta.","ok":true,"fb":"I think を入れると、やわらかく間違いを伝えられます。"},
   {"en":"I can't eat this chicken.","ok":false,"fb":"アレルギーや好き嫌いの話に聞こえて、注文ミスだと伝わりません。"}]},
  {"who":"p","en":"Oh no, I'm so sorry! I'll fix that right away. Here's your pasta, and dessert is on us tonight.","ja":"大変申し訳ありません!すぐにお取り替えします。こちらパスタです。今夜のデザートはお店からのサービスです。"},
  {"who":"me","ja":"気にしないで、デザートうれしい!と伝えたい","opts":[
   {"en":"Dessert is service? Lucky!","ok":false,"fb":"「サービス(無料)」は和製英語です。英語では free や on the house と言います。"},
   {"en":"It's not a problem for me, okay.","ok":false,"fb":"最後の okay が不自然で、気持ちがうまく伝わりません。"},
   {"en":"No worries at all. Free dessert sounds great!","ok":true,"fb":"No worries. は「気にしないで」。ポジティブな一言で場がなごみます。"}]},
  {"who":"p","en":"Ha ha, glad to hear it. Just let me know when you're ready for the check.","ja":"あはは、よかったです。お会計の準備ができたら声をかけてください。"},
  {"who":"me","ja":"(食べ終わって)お会計をお願いしたい","opts":[
   {"en":"Could I get the check, please?","ok":true,"fb":"アメリカでは check が一般的です。Check, please. だけでも通じます。"},
   {"en":"Can I pay the money?","ok":false,"fb":"文法は合っていますが、「お金を払えますか?」と不自然な聞き方です。"},
   {"en":"Bill, quickly.","ok":false,"fb":"「早く会計して」と急かしていて、失礼に聞こえます。"}]},
  {"who":"p","en":"Of course. I'll bring it right over.","ja":"かしこまりました。すぐお持ちします。"}],
 "wrap":"トラブルのときは Excuse me, I think ~ で始めると、やわらかく伝えられます。謝られたら No worries. で笑顔で返しましょう。"},

{"id":"t07","lv":2,"t":"買い物で返品・交換","place":"Clothing store","partner":"Store clerk","pv":"f",
 "goal":"サイズの合わなかったセーターを、レシートを見せて交換してもらいましょう。",
 "phrases":[
  {"en":"I'd like to exchange this.","ja":"これを交換したいです。","tip":"exchange = 交換。返品なら return を使います。"},
  {"en":"It doesn't fit.","ja":"サイズが合いません。","tip":"<b>fit</b> は「サイズが合う」。似合うは look good on me です。"},
  {"en":"Here's my receipt.","ja":"レシートはこちらです。","tip":"receipt の p は読みません。「リシート」と発音します。"},
  {"en":"Could I try on a medium?","ja":"Mサイズを試着してもいいですか?","tip":"<b>try on</b> = 試着する。試着室は fitting room です。"},
  {"en":"Can I get a refund?","ja":"返金してもらえますか?","tip":"refund = 返金。交換ではなくお金を返してほしいときに使います。"}],
 "lines":[
  {"who":"p","en":"Hi, how can I help you?","ja":"こんにちは、どうされましたか?"},
  {"who":"me","ja":"このセーターを交換したいと伝えたい","opts":[
   {"en":"I bought this sweater. It's bad.","ok":false,"fb":"「悪い」だけでは何が問題か伝わらず、少し失礼に聞こえます。"},
   {"en":"I'd like to buy this sweater.","ok":false,"fb":"「このセーターを買いたい」になってしまいます。もう買ってありますね。"},
   {"en":"Hi, I'd like to exchange this sweater.","ok":true,"fb":"exchange で「交換」とはっきり伝わります。返品なら return です。"}]},
  {"who":"p","en":"Sure. Is there something wrong with it?","ja":"かしこまりました。何か問題がありましたか?"},
  {"who":"me","ja":"サイズが少し大きすぎて合わない","opts":[
   {"en":"It doesn't fit. It's a little too big.","ok":true,"fb":"It doesn't fit. で「サイズが合わない」。理由まで言うと話が早いです。"},
   {"en":"It's not fitting my size.","ok":false,"fb":"英語では不自然な言い方です。It doesn't fit me. と言います。"},
   {"en":"It's too small for me.","ok":false,"fb":"「小さすぎる」と逆の意味になっています。"}]},
  {"who":"p","en":"I see. Do you have the receipt?","ja":"わかりました。レシートはお持ちですか?"},
  {"who":"me","ja":"はい、どうぞ。先週買ったと伝えたい","opts":[
   {"en":"Yes, receipt is this. I buy last week.","ok":false,"fb":"last week なので過去形 bought が必要です。レシートは Here it is. で渡せます。"},
   {"en":"Yes, here it is. I bought it last week.","ok":true,"fb":"Here it is. は物を渡すときの定番。過去形 bought も正しく使えています。"},
   {"en":"No, I threw it away.","ok":false,"fb":"「捨てちゃいました」になってしまいます。交換が難しくなるかも!"}]},
  {"who":"p","en":"Thanks. What size would you like instead? We have small and medium.","ja":"ありがとうございます。代わりに何サイズにしますか?SとMがあります。"},
  {"who":"me","ja":"まずMサイズを試着してもいいか聞きたい","opts":[
   {"en":"Could I try on a medium first?","ok":true,"fb":"try on で「試着する」。first を付けると「まず」の気持ちが出ます。"},
   {"en":"Can I challenge the medium?","ok":false,"fb":"challenge は「挑戦する・異議を唱える」。日本語の「チャレンジ」とはちがいます。"},
   {"en":"Can I try in medium?","ok":false,"fb":"「試着する」は try on です。前置詞に注意しましょう。"}]},
  {"who":"p","en":"Of course! The fitting room is right over there.","ja":"もちろんです!試着室はあちらです。"},
  {"who":"me","ja":"(試着後)ぴったり!これにする","opts":[
   {"en":"It's just fit!","ok":false,"fb":"「サイズが合う」の fit は動詞なので It's fit とは言いません。It fits perfectly! が正しい形です。"},
   {"en":"It's too perfect, so no.","ok":false,"fb":"「完璧すぎるからいらない」という謎の答えになっています。"},
   {"en":"This one fits perfectly. I'll take it.","ok":true,"fb":"fits perfectly で「ぴったり」。I'll take it. は「これにします」の決まり文句です。"}]},
  {"who":"p","en":"Wonderful. I'll swap it for you. There's no extra charge!","ja":"よかったです。お取り替えしますね。追加料金はかかりません!"}],
 "wrap":"exchange(交換)、return(返品)、refund(返金)を使い分けましょう。I'll take it. は買い物を決めるときの最強フレーズです。"},

{"id":"t08","lv":2,"t":"週末の予定を話す","place":"Office break room","partner":"Jake","pv":"m",
 "goal":"友だちと週末の予定を話して、ハイキングの誘いに乗りましょう。",
 "phrases":[
  {"en":"Do you have any plans this weekend?","ja":"今週末、何か予定ある?","tip":"金曜日の定番の話題です。Any plans for the weekend? と短くも言えます。"},
  {"en":"I'm going to relax at home.","ja":"家でゆっくりするつもり。","tip":"<b>be going to ~</b> で「~するつもり」と予定を言えます。"},
  {"en":"Do you want to come?","ja":"一緒に来る?","tip":"気軽な誘い方です。Do you want to join us? もよく使います。"},
  {"en":"What time are we meeting?","ja":"何時に集合?","tip":"決まっている予定は現在進行形で言えます。"},
  {"en":"I'm looking forward to it.","ja":"楽しみにしています。","tip":"<b>look forward to</b> のあとは名詞か ~ing。to see ではなく to seeing です。"}],
 "lines":[
  {"who":"p","en":"Hey, any plans for the weekend?","ja":"ねえ、週末なにか予定ある?"},
  {"who":"me","ja":"特にないかな。家でゆっくりするつもり","opts":[
   {"en":"No plan. I'm relax at home.","ok":false,"fb":"I'm relax は文法がまちがいです。I'm going to relax か I'll relax と言います。"},
   {"en":"Not really. I'm just going to relax at home.","ok":true,"fb":"Not really. は「特には」というやわらかい答え。be going to で予定を言えています。"},
   {"en":"Yes, I'm very busy all weekend.","ok":false,"fb":"「週末ずっと忙しい」と逆の意味になっています。"}]},
  {"who":"p","en":"Nice. Actually, a few of us are going hiking on Sunday. Do you want to come?","ja":"いいね。実は日曜日に何人かでハイキングに行くんだ。来る?"},
  {"who":"me","ja":"いいね!何時に集合か聞きたい","opts":[
   {"en":"I want! When meeting?","ok":false,"fb":"I want だけでは文が終わっていません。単語の並べ方も不自然です。"},
   {"en":"Sorry, I can't make it.","ok":false,"fb":"「ごめん、行けない」と断っています。行きたい気持ちと逆です。"},
   {"en":"Sounds great! What time are we meeting?","ok":true,"fb":"Sounds great! で乗り気が伝わります。決まった予定は are we meeting の形で聞けます。"}]},
  {"who":"p","en":"We're meeting at the station at seven in the morning.","ja":"朝7時に駅集合だよ。"},
  {"who":"me","ja":"7時!?日曜日にしては早いね、と冗談まじりに","opts":[
   {"en":"Seven? Wow, that's early for a Sunday!","ok":true,"fb":"early は「(時刻が)早い」。for a Sunday で「日曜日にしては」です。"},
   {"en":"Seven is very fast!","ok":false,"fb":"fast は「(スピードが)速い」です。時刻が早いのは early です。"},
   {"en":"I'm early person, no.","ok":false,"fb":"文法がくずれていて意味が通りません。朝型の人は a morning person と言います。"}]},
  {"who":"p","en":"Ha ha, I know. But the view from the top is totally worth it.","ja":"あはは、だよね。でも頂上からの景色は本当にその価値があるよ。"},
  {"who":"me","ja":"わかった、行く!何を持っていけばいい?","opts":[
   {"en":"What should I bring my?","ok":false,"fb":"最後の my が余分で、文が成り立っていません。"},
   {"en":"What do I bring you?","ok":false,"fb":"「あなたに何を持っていけばいい?」とおみやげの話に聞こえます。"},
   {"en":"Okay, I'm in. What should I bring?","ok":true,"fb":"I'm in. は「乗った、参加する」という気軽な一言。What should I bring? は準備の質問の定番です。"}]},
  {"who":"p","en":"Just water, snacks, and good shoes. Oh, and maybe a jacket. It gets cold up there.","ja":"水とおやつと歩きやすい靴だけでいいよ。あ、上着もあるといいかも。上は寒くなるから。"},
  {"who":"me","ja":"了解!日曜日、楽しみにしてる","opts":[
   {"en":"I'm looking forward to see you.","ok":false,"fb":"look forward to のあとは ~ing です。to seeing you が正しい形です。"},
   {"en":"Got it. I'm looking forward to Sunday!","ok":true,"fb":"look forward to + 名詞 で「~を楽しみにする」。Can't wait! もカジュアルで使えます。"},
   {"en":"I'm waiting Sunday.","ok":false,"fb":"wait には for が必要で、「楽しみ」という気持ちも伝わりません。"}]},
  {"who":"p","en":"Me too. See you there!","ja":"僕も。じゃあ現地で!"}],
 "wrap":"予定は be going to、誘いへの返事は Sounds great! や I'm in.。早い時刻は early、速いスピードは fast と使い分けましょう。"},

{"id":"t09","lv":3,"t":"職場で同僚に頼みごと","place":"Office","partner":"Lisa (coworker)","pv":"f",
 "goal":"同僚に、プレゼン資料のチェックを感じよくお願いしましょう。",
 "phrases":[
  {"en":"Do you have a minute?","ja":"ちょっと時間ありますか?","tip":"頼みごとの前の声かけ。Do you have <b>the</b> time? だと「今何時?」になるので注意。"},
  {"en":"Would you mind taking a look at this?","ja":"これを見てもらえませんか?","tip":"<b>Would you mind ~ing?</b> は丁寧なお願い。OKのときの返事は Not at all.(全然かまわない)です。"},
  {"en":"I'm a little nervous.","ja":"ちょっと緊張しています。","tip":"nervous = 緊張している。気持ちを言うと相手も協力しやすくなります。"},
  {"en":"I really appreciate it.","ja":"本当に感謝します。","tip":"Thank you. よりも感謝の気持ちが強く伝わります。"},
  {"en":"Coffee's on me.","ja":"コーヒーおごるよ。","tip":"<b>~ is on me</b> で「~は私のおごり」。"}],
 "lines":[
  {"who":"p","en":"Hey, what's up? You look a little stressed.","ja":"どうしたの?ちょっとストレスたまってそうだね。"},
  {"who":"me","ja":"ちょっと時間ある?と聞きたい","opts":[
   {"en":"Do you have a minute?","ok":true,"fb":"a minute は「少しの時間」。頼みごとの前の自然な声かけです。"},
   {"en":"Do you have the time?","ok":false,"fb":"the time を付けると「今何時ですか?」という意味になります。"},
   {"en":"Please give me your time.","ok":false,"fb":"直訳で大げさに聞こえ、かなり重いお願いのようになります。"}]},
  {"who":"p","en":"Sure. What do you need?","ja":"いいよ。どうしたの?"},
  {"who":"me","ja":"プレゼンのスライドを見てもらえないか頼みたい","opts":[
   {"en":"Look at this slides.","ok":false,"fb":"slides は複数なので these slides です。命令文なので頼み方としても強めです。"},
   {"en":"You must check my slides.","ok":false,"fb":"must は「~しなければならない」。同僚に命令しているように聞こえます。"},
   {"en":"Would you mind taking a look at my slides?","ok":true,"fb":"Would you mind ~ing? は丁寧なお願い。Could you take a look at my slides? もOKです。"}]},
  {"who":"p","en":"Not at all. When's your presentation?","ja":"全然いいよ。プレゼンはいつ?"},
  {"who":"me","ja":"明日の朝。ちょっと緊張してる","opts":[
   {"en":"It's in tomorrow morning.","ok":false,"fb":"tomorrow morning の前に in は付けません。"},
   {"en":"It's tomorrow morning. I'm a little nervous.","ok":true,"fb":"気持ちを一言そえると、相手も応援したくなります。"},
   {"en":"It was yesterday.","ok":false,"fb":"「昨日だった」では、もう終わっています!"}]},
  {"who":"p","en":"Okay, I'll look at them after lunch. I'll send you my comments by three.","ja":"わかった、お昼のあとに見るね。3時までにコメント送るよ。"},
  {"who":"me","ja":"本当に助かる、と感謝したい","opts":[
   {"en":"Thank you so much. I really appreciate it.","ok":true,"fb":"I really appreciate it. は感謝がしっかり伝わる大人の言い方です。"},
   {"en":"Thank you for your hard work.","ok":false,"fb":"「お疲れさまです」の直訳で、まだ何もしてもらっていない場面では不自然です。"},
   {"en":"You're so kind person.","ok":false,"fb":"a が抜けています。You're so kind. か You're such a kind person. と言います。"}]},
  {"who":"p","en":"No problem. You'd do the same for me.","ja":"いいって。あなたも同じことしてくれるでしょ。"},
  {"who":"me","ja":"もちろん。お礼に今週はコーヒーをおごるね","opts":[
   {"en":"I'll treat coffee for you.","ok":false,"fb":"treat の使い方がちがいます。I'll treat you to coffee. が正しい形です。"},
   {"en":"I'll pay you money.","ok":false,"fb":"お金を払うと言うと、親切な相手に失礼に聞こえます。"},
   {"en":"Of course. Coffee's on me this week!","ok":true,"fb":"~ is on me は「~はおごり」。気軽にお礼の気持ちを伝えられます。"}]},
  {"who":"p","en":"Deal! I'll hold you to that.","ja":"決まり!忘れないでね。"}],
 "wrap":"頼みごとは Do you have a minute? で声をかけ、Would you mind ~ing? でお願いし、I really appreciate it. で感謝。職場で何度も使える流れです。"},

{"id":"t10","lv":3,"t":"電話で予約の変更","place":"Phone call","partner":"Restaurant staff","pv":"f",
 "goal":"レストランに電話して、今夜の予約の時間を変更しましょう。",
 "phrases":[
  {"en":"I'd like to change my reservation.","ja":"予約を変更したいです。","tip":"取り消しなら cancel my reservation です。"},
  {"en":"It's for two people tonight at seven.","ja":"今夜7時、2名の予約です。","tip":"予約の内容は <b>for + 人数 + 日時</b> の順で言うとスムーズです。"},
  {"en":"Could we move it to eight?","ja":"8時に変更できますか?","tip":"<b>move it to ~</b> で「~にずらす」。"},
  {"en":"Eight thirty works for us.","ja":"8時半で大丈夫です。","tip":"<b>work</b> には「都合がいい」という意味があります。"},
  {"en":"Sorry, could you speak a little more slowly?","ja":"すみません、もう少しゆっくり話してもらえますか?","tip":"電話は聞き取りにくいもの。遠慮なく使いましょう。"}],
 "lines":[
  {"who":"p","en":"Thank you for calling Sunny Table. How can I help you?","ja":"お電話ありがとうございます、サニーテーブルです。ご用件をどうぞ。"},
  {"who":"me","ja":"予約を変更したいと伝えたい","opts":[
   {"en":"I want to cancel my reservation.","ok":false,"fb":"cancel は「取り消し」です。変更したいなら change を使います。"},
   {"en":"I changed my reservation.","ok":false,"fb":"過去形なので「もう変更しました」になってしまいます。"},
   {"en":"Hi, I'd like to change my reservation, please.","ok":true,"fb":"I'd like to ~ で丁寧に用件を伝えられます。電話の第一声にぴったりです。"}]},
  {"who":"p","en":"Sure. Can you tell me the date and time of your reservation?","ja":"かしこまりました。ご予約の日にちと時間を教えていただけますか?"},
  {"who":"me","ja":"今夜7時、2名で予約している","opts":[
   {"en":"It's for two people tonight at seven.","ok":true,"fb":"for + 人数 + 日時 の順で、必要な情報がすっきり伝わります。"},
   {"en":"It's two person, seven tonight.","ok":false,"fb":"two のあとは複数形 people です。語順も不自然です。"},
   {"en":"I'm reserved for seven.","ok":false,"fb":"I'm reserved は「私はひかえめな性格です」という意味にもなります。"}]},
  {"who":"p","en":"Got it. What time would you like to change it to?","ja":"承知しました。何時に変更されますか?"},
  {"who":"me","ja":"8時に変えられるか聞きたい","opts":[
   {"en":"Eight o'clock, change.","ok":false,"fb":"単語を並べただけで、お願いの形になっていません。"},
   {"en":"Could we move it to eight o'clock?","ok":true,"fb":"move it to ~ で「~にずらす」。Could we ~? で丁寧にお願いできます。"},
   {"en":"Could we move it to eight days?","ok":false,"fb":"eight days は「8日間」。8日後にずらすことになってしまいます!"}]},
  {"who":"p","en":"Let me check. I'm sorry, eight is fully booked. We do have a table at eight thirty, though.","ja":"確認します。申し訳ありません、8時は満席です。8時半ならお席がありますが。"},
  {"who":"me","ja":"8時半で大丈夫です","opts":[
   {"en":"Eight thirty is no problem for you.","ok":false,"fb":"for you だと「あなたにとって問題ない」になり、意味がずれます。"},
   {"en":"Eight thirty? I can't wait that long.","ok":false,"fb":"「そんなに待てない」と断っているように聞こえます。"},
   {"en":"Eight thirty works for us. Thank you.","ok":true,"fb":"work は「都合がいい」。That works for us. はビジネスでもよく使います。"}]},
  {"who":"p","en":"Perfect. So that's a table for two, tonight at eight thirty.","ja":"かしこまりました。では今夜8時半、2名様ですね。"},
  {"who":"me","ja":"そうです、ありがとう、と電話を終えたい","opts":[
   {"en":"No, that's right.","ok":false,"fb":"No と that's right が矛盾していて、相手が混乱します。"},
   {"en":"Yes, that's right. Thanks for your help!","ok":true,"fb":"確認に Yes, that's right. と答え、お礼で気持ちよく電話を終えられます。"},
   {"en":"Yes, it was correct.","ok":false,"fb":"過去形 was が不自然です。今の確認なので that's right と言います。"}]},
  {"who":"p","en":"You're welcome. We'll see you tonight!","ja":"どういたしまして。今夜お待ちしております!"}],
 "wrap":"電話の予約変更は「用件→今の予約内容→希望→確認」の順で進みます。~ works for us.(~で大丈夫です)は日程調整の万能フレーズです。"},

{"id":"t11","lv":3,"t":"オンライン会議の始まり","place":"Online meeting","partner":"Team leader","pv":"m",
 "goal":"オンライン会議の音声や画面のトラブルを英語で伝えて、会議を始めましょう。",
 "phrases":[
  {"en":"I can hear you fine.","ja":"よく聞こえています。","tip":"fine を付けると「問題なく」の意味になります。"},
  {"en":"You're on mute.","ja":"ミュートになっていますよ。","tip":"オンライン会議で一番よく聞く一言かもしれません。"},
  {"en":"Can everyone see my screen?","ja":"皆さん、画面が見えていますか?","tip":"画面共有のときの決まり文句です。"},
  {"en":"Sorry, you're breaking up.","ja":"すみません、音声が途切れています。","tip":"<b>break up</b> は「(音声が)途切れる」。恋人と別れる意味もあります。"},
  {"en":"Shall we get started?","ja":"始めましょうか?","tip":"Shall we ~? は「~しましょうか?」というやわらかい提案です。"}],
 "lines":[
  {"who":"p","en":"Hi, everyone. Can you hear me okay?","ja":"皆さん、こんにちは。声は聞こえていますか?"},
  {"who":"me","ja":"はい、よく聞こえます","opts":[
   {"en":"Yes, I'm listening your voice.","ok":false,"fb":"listen には to が必要です。また「聞こえる」は hear を使います。"},
   {"en":"Yes, I can hear you fine.","ok":true,"fb":"hear は「(自然に)聞こえる」。Loud and clear! もよく使います。"},
   {"en":"No, I can't hear you.","ok":false,"fb":"聞こえていないなら答えられないはず。ちょっとしたジョークになってしまいます。"}]},
  {"who":"p","en":"Great. Before we start, I'll share my screen. Can everyone see it?","ja":"よかった。始める前に画面を共有しますね。皆さん見えていますか?"},
  {"who":"me","ja":"まだ黒い画面しか見えない","opts":[
   {"en":"Not yet. I can only see a black screen.","ok":true,"fb":"Not yet. は「まだです」。何が見えているかも伝えると親切です。"},
   {"en":"No, I don't look.","ok":false,"fb":"「私は見ません」という意味になってしまいます。見えるかどうかは see を使います。"},
   {"en":"Yes, it looks great!","ok":false,"fb":"見えていないのに「いいですね!」と言うと、話が進まなくなります。"}]},
  {"who":"p","en":"Oh, sorry about that. How about now?","ja":"あ、すみません。これでどうですか?"},
  {"who":"me","ja":"今は見える、と伝えたい","opts":[
   {"en":"Now I saw it.","ok":false,"fb":"now と過去形 saw が合いません。今のことは can see で言います。"},
   {"en":"I see what you mean.","ok":false,"fb":"「おっしゃることはわかります」という意味で、画面の話になりません。"},
   {"en":"Yes, now I can see it.","ok":true,"fb":"can see で「見える」。Yes, it's showing now. とも言えます。"}]},
  {"who":"p","en":"Perfect. So today... talk about... the new... schedule...","ja":"よかった。それで今日は……話す……新しい……スケジュール……(音声が途切れています)"},
  {"who":"me","ja":"音声が途切れていると伝えたい","opts":[
   {"en":"Your voice is broken.","ok":false,"fb":"「あなたの声は壊れている」と聞こえて、ちょっと失礼です。"},
   {"en":"Sorry, you're breaking up a little.","ok":true,"fb":"break up は音声が途切れること。Sorry を付けるとやわらかく伝わります。"},
   {"en":"Your internet is bad, fix it.","ok":false,"fb":"命令文で、上司に対してかなり失礼に聞こえます。"}]},
  {"who":"p","en":"Oh, is this better? I just switched to my other headset.","ja":"あ、これでどうですか?別のヘッドセットに替えました。"},
  {"who":"me","ja":"ずっとよくなった。始めましょうか","opts":[
   {"en":"Much better, thanks. Shall we get started?","ok":true,"fb":"Much better. は「ずっとよくなった」。Shall we ~? で自然に会議を進められます。"},
   {"en":"Clear! Let's beginning.","ok":false,"fb":"Let's のあとは動詞の原形です。Let's begin. と言います。"},
   {"en":"It's clean now.","ok":false,"fb":"clean は「きれいな・清潔な」。音がはっきりは clear です。"}]},
  {"who":"p","en":"Yes, let's. Thanks for your patience, everyone.","ja":"そうしましょう。皆さん、お待たせしました。"}],
 "wrap":"「聞こえる」は hear、「見える」は see。音声が途切れたら You're breaking up. と伝えましょう。Shall we get started? で会議を前に進められます。"},

{"id":"t12","lv":3,"t":"体調不良で病院・薬局","place":"Pharmacy","partner":"Pharmacist","pv":"m",
 "goal":"薬局で症状を説明して、自分に合う風邪薬と飲み方を確認しましょう。",
 "phrases":[
  {"en":"Do you have anything for a cold?","ja":"風邪に効く薬はありますか?","tip":"<b>anything for ~</b> で「~に効くもの」。頭痛なら for a headache です。"},
  {"en":"I have a sore throat.","ja":"のどが痛いです。","tip":"sore = ひりひり痛い。鼻水は a runny nose です。"},
  {"en":"I've had a fever since last night.","ja":"昨夜から熱があります。","tip":"<b>have had ~ since</b> で「~からずっと」。"},
  {"en":"Will it make me sleepy?","ja":"眠くなりますか?","tip":"make me ~ で「私を~にする」。仕事や運転の前に大事な確認です。"},
  {"en":"How many times a day should I take it?","ja":"1日何回飲めばいいですか?","tip":"薬を「飲む」は drink ではなく <b>take</b> です。"}],
 "lines":[
  {"who":"p","en":"Hi there. What can I do for you today?","ja":"こんにちは。今日はどうされましたか?"},
  {"who":"me","ja":"風邪に効く薬がほしい","opts":[
   {"en":"Give me cold medicine now.","ok":false,"fb":"命令文に now まで付いていて、かなり失礼に聞こえます。"},
   {"en":"I want medicine of cold.","ok":false,"fb":"medicine of cold という言い方はしません。medicine for a cold です。"},
   {"en":"Hi, do you have anything for a cold?","ok":true,"fb":"anything for ~ で「~に効くもの」。薬局でとても便利な形です。"}]},
  {"who":"p","en":"Sure. What symptoms do you have?","ja":"わかりました。どんな症状がありますか?"},
  {"who":"me","ja":"のどが痛くて、鼻水が出る","opts":[
   {"en":"My throat is painful and nose is running water.","ok":false,"fb":"直訳で不自然です。a sore throat と a runny nose をセットで覚えましょう。"},
   {"en":"I have a sore throat and a runny nose.","ok":true,"fb":"症状は I have ~ で言えます。風邪の二大症状のセットです。"},
   {"en":"I have a sore stomach.","ok":false,"fb":"stomach は「おなか」です。痛いのはのどですね。"}]},
  {"who":"p","en":"I see. Do you have a fever?","ja":"なるほど。熱はありますか?"},
  {"who":"me","ja":"昨夜から少し熱がある","opts":[
   {"en":"Yes, I've had a slight fever since last night.","ok":true,"fb":"have had ~ since で「~からずっと」。slight は「少しの」です。"},
   {"en":"Yes, I have fever from last night.","ok":false,"fb":"a fever と a が必要です。「~からずっと」は from ではなく since を使います。"},
   {"en":"Yes, I'm hot.","ok":false,"fb":"I'm hot. は「暑い」という意味で、熱があることは伝わりません。熱は have a fever で言います。"}]},
  {"who":"p","en":"Okay. This one should help. It works for a sore throat and a stuffy nose.","ja":"わかりました。これが効くと思います。のどの痛みと鼻づまりに効きますよ。"},
  {"who":"me","ja":"眠くなるか聞きたい(明日仕事がある)","opts":[
   {"en":"Will I sleep forever?","ok":false,"fb":"「永遠に眠るの?」とこわい質問になってしまいます。"},
   {"en":"Is it sleepy?","ok":false,"fb":"「その薬は眠いですか?」と、薬が眠がっていることになります。"},
   {"en":"Will it make me sleepy? I have work tomorrow.","ok":true,"fb":"make me sleepy で「眠くさせる」。理由も言うと、合う薬を選んでもらえます。"}]},
  {"who":"p","en":"It might, a little. Try taking it after dinner, and get some rest.","ja":"少し眠くなるかもしれません。夕食後に飲んで、ゆっくり休んでください。"},
  {"who":"me","ja":"1日何回飲めばいいか聞きたい","opts":[
   {"en":"How many times I drink?","ok":false,"fb":"薬を飲むは take です。疑問文の語順にもなっていません。"},
   {"en":"How many times a day should I take it?","ok":true,"fb":"a day で「1日に」。薬は take で「飲む」です。"},
   {"en":"How long should I take a rest?","ok":false,"fb":"「どのくらい休めばいい?」と、薬の回数とは別の質問です。"}]},
  {"who":"p","en":"Twice a day, after breakfast and dinner. If you don't feel better in three days, please see a doctor.","ja":"1日2回、朝食後と夕食後です。3日たってもよくならなければ、医師に診てもらってください。"}],
 "wrap":"症状は I have a ~ で言えます。薬を「飲む」は take。Do you have anything for ~? は頭痛や腹痛など、どんな症状にも使えます。"},

{"id":"t13","lv":4,"t":"会議で意見を言う・反対する","place":"Meeting room","partner":"Ms. Patel (manager)","pv":"f",
 "goal":"会議で上司の案にていねいに反対し、代わりの案を出して合意しましょう。",
 "phrases":[
  {"en":"Could I add something here?","ja":"ここで少し付け加えてもいいですか?","tip":"発言の前に許可を取ると、会議でスムーズに話し始められます。"},
  {"en":"I see your point, but...","ja":"おっしゃることはわかりますが…","tip":"反対する前に、まず相手の意見を受け止めるのがコツです。"},
  {"en":"That might be a bit early.","ja":"それは少し早いかもしれません。","tip":"<b>might</b> や <b>a bit</b> で言い方をやわらげます(ヘッジ)。"},
  {"en":"What if we tried a different approach?","ja":"別の方法を試してみてはどうでしょう?","tip":"<b>What if we ~?</b> は押しつけない提案の形です。"},
  {"en":"I'll put together a plan.","ja":"計画をまとめます。","tip":"put together = まとめる・作成する。"}],
 "lines":[
  {"who":"p","en":"So, I'm thinking we should launch the new app next month. Any thoughts?","ja":"新しいアプリは来月リリースしようと考えています。何か意見はありますか?"},
  {"who":"me","ja":"少し付け加えてもいいか聞きたい","opts":[
   {"en":"Could I add something here?","ok":true,"fb":"発言の許可を取る丁寧な言い方です。If I may, ~ という切り出し方もあります。"},
   {"en":"I have opinion. Listen.","ok":false,"fb":"an opinion と a が必要です。Listen. は命令で、上司に失礼です。"},
   {"en":"Can I plus one thing?","ok":false,"fb":"plus は動詞として使いません。add を使います。"}]},
  {"who":"p","en":"Of course. Go ahead.","ja":"もちろん。どうぞ。"},
  {"who":"me","ja":"おっしゃることはわかりますが、来月は少し早いかもしれません","opts":[
   {"en":"You're wrong. Next month is too early.","ok":false,"fb":"You're wrong. は直接的すぎて、会議の空気が悪くなります。"},
   {"en":"I agree, next month is perfect.","ok":false,"fb":"賛成していて、言いたいことと逆です。"},
   {"en":"I see your point, but next month might be a bit early.","ok":true,"fb":"受け止める→might と a bit でやわらげる、というていねいな反対の形です。"}]},
  {"who":"p","en":"Hmm. Why do you think so?","ja":"うーん。どうしてそう思いますか?"},
  {"who":"me","ja":"まだユーザーテストが終わっていないから","opts":[
   {"en":"Because user test is not finish.","ok":false,"fb":"is not finish は文法がまちがいです。finished にする必要があります。"},
   {"en":"We haven't finished user testing yet.","ok":true,"fb":"haven't ~ yet で「まだ~していない」。理由をはっきり言えています。"},
   {"en":"Because I don't like testing.","ok":false,"fb":"個人の好き嫌いになっていて、ビジネスの理由になりません。"}]},
  {"who":"p","en":"That's true. But our competitors are moving fast.","ja":"確かに。でも競合はどんどん動いていますよ。"},
  {"who":"me","ja":"テストを2週間だけ延ばすのはどうか提案したい","opts":[
   {"en":"What if we extended testing by just two weeks?","ok":true,"fb":"What if we ~? は押しつけない提案です。by just two weeks で「たった2週間」と小ささを強調しています。"},
   {"en":"We must test two weeks more, okay?","ok":false,"fb":"must と okay? で、上司に命令して押しつけているように聞こえます。"},
   {"en":"How about we test for two weeks ago?","ok":false,"fb":"ago は過去を表します。未来の提案には使えません。"}]},
  {"who":"p","en":"Two weeks... That could work. It's better than fixing bugs after launch.","ja":"2週間……それならいけるかも。リリース後にバグを直すよりいいですね。"},
  {"who":"me","ja":"ありがとうございます。今日中にテスト計画をまとめて送ります","opts":[
   {"en":"I'll send you the plan maybe someday.","ok":false,"fb":"maybe someday は「いつか、たぶん」。ビジネスでは頼りなく聞こえます。"},
   {"en":"Please make the test plan for me.","ok":false,"fb":"上司に計画を作らせることになり、話が逆です。"},
   {"en":"Thanks. I'll put together a testing plan and send it today.","ok":true,"fb":"put together は「まとめる」。期限まで言うと信頼されます。"}]},
  {"who":"p","en":"Great. Let's discuss it again on Friday.","ja":"いいですね。金曜日にもう一度話し合いましょう。"}],
 "wrap":"反対は「受け止める(I see your point)→やわらげる(might, a bit)→提案する(What if we ~?)」の3ステップ。はっきり言っても角が立ちません。"},

{"id":"t14","lv":4,"t":"取引先との値段交渉","place":"Business meeting","partner":"Supplier sales rep","pv":"m",
 "goal":"仕入れ先と単価を交渉して、お互いに納得できる条件で合意しましょう。",
 "phrases":[
  {"en":"That's a bit higher than we expected.","ja":"予想より少し高いです。","tip":"「高すぎる」と言わず、<b>a bit higher than expected</b> でやわらかく伝えます。"},
  {"en":"We were hoping for something closer to ten dollars.","ja":"10ドルに近い金額を希望していました。","tip":"過去進行形 <b>were hoping</b> にすると、さらに控えめな言い方になります。"},
  {"en":"Is there any flexibility on the price?","ja":"価格に融通はききますか?","tip":"flexibility = 柔軟性。値下げを直接頼まずに交渉を始められます。"},
  {"en":"That could work if shipping is included.","ja":"送料込みならそれで進められそうです。","tip":"<b>could work if ~</b> で条件つきの「OK」を出せます。"},
  {"en":"I'll get back to you tomorrow.","ja":"明日までにご連絡します。","tip":"get back to ~ = 折り返し連絡する。"}],
 "lines":[
  {"who":"p","en":"So, for an order of five hundred units, the price would be twelve dollars per unit.","ja":"500個のご注文ですと、1個あたり12ドルになります。"},
  {"who":"me","ja":"予想より少し高いと伝えたい","opts":[
   {"en":"It's too expensive! No way.","ok":false,"fb":"No way. は「ありえない」。交渉の最初から相手を突き放してしまいます。"},
   {"en":"That's a bit higher than we expected.","ok":true,"fb":"a bit と than we expected で、失礼にならずに「高い」と伝えられます。"},
   {"en":"That's a bit cheaper than we expected.","ok":false,"fb":"「思ったより安い」と言っています。それでは値下げしてもらえません。"}]},
  {"who":"p","en":"I understand. What price did you have in mind?","ja":"わかります。どのくらいの価格をお考えでしたか?"},
  {"who":"me","ja":"10ドルくらいを希望していた","opts":[
   {"en":"We are thinking ten dollars, final.","ok":false,"fb":"final(これで最終)と言い切ると、交渉の余地がなくなります。"},
   {"en":"Ten dollars is your price.","ok":false,"fb":"「あなたの価格は10ドルです」と決めつけていて、失礼に聞こえます。"},
   {"en":"We were hoping for something closer to ten dollars.","ok":true,"fb":"were hoping で控えめに希望を伝え、closer to で幅を持たせています。"}]},
  {"who":"p","en":"Ten is difficult for us. Our material costs have gone up this year.","ja":"10ドルは厳しいですね。今年は材料費が上がっていまして。"},
  {"who":"me","ja":"注文数を倍にしたら、割引できるか聞きたい","opts":[
   {"en":"If we doubled our order, could you offer a discount?","ok":true,"fb":"If we ~, could you ~? は条件を出して交渉する基本の形です。"},
   {"en":"If we order more, you discount?","ok":false,"fb":"文が不完全で、ぶっきらぼうに聞こえます。could you offer a discount? と言いましょう。"},
   {"en":"Can you discount our order to double?","ok":false,"fb":"「注文を倍に値引きする」という意味の通らない文です。"}]},
  {"who":"p","en":"If you double the order to one thousand units, we could do eleven dollars.","ja":"1,000個に倍増していただけるなら、11ドルにできます。"},
  {"who":"me","ja":"送料込みなら11ドルでいけそう、と伝えたい","opts":[
   {"en":"Shipping is service, right?","ok":false,"fb":"「サービス(無料)」は和製英語です。英語の service は無料という意味になりません。"},
   {"en":"Eleven could work if shipping is included.","ok":true,"fb":"could work if ~ で「~なら成立しそう」。条件つきで前向きに返せます。"},
   {"en":"Eleven, and you pay shipping. Decide now.","ok":false,"fb":"Decide now. は命令で、相手に圧力をかけています。関係が悪くなります。"}]},
  {"who":"p","en":"Hmm... Okay. Eleven dollars, including shipping. I think we have a deal.","ja":"うーん……わかりました。送料込みで11ドル。合意ですね。"},
  {"who":"me","ja":"ありがとう。チームに確認して明日連絡します","opts":[
   {"en":"Thanks. I'll answer you sometime.","ok":false,"fb":"sometime は「いつか」。期限があいまいで、ビジネスでは不安を与えます。"},
   {"en":"Thank you. I'll ask my boss about my salary.","ok":false,"fb":"自分の給料の話になっています。今は関係ありません!"},
   {"en":"Great. I'll confirm with my team and get back to you tomorrow.","ok":true,"fb":"confirm with ~ で「~に確認する」、get back to you で「折り返し連絡する」です。"}]},
  {"who":"p","en":"Sounds good. I'll send over a revised quote this afternoon.","ja":"承知しました。午後に修正した見積もりをお送りします。"}],
 "wrap":"交渉は「やわらかく高いと伝える→控えめに希望を言う→条件を出す(If we ~, could you ~?)」の流れ。could や were hoping が大人の交渉を作ります。"},

{"id":"t15","lv":4,"t":"プレゼン後の質疑応答","place":"Conference room","partner":"Audience member","pv":"m",
 "goal":"プレゼン後の質問に落ち着いて答え、わからないことは後で対応すると伝えましょう。",
 "phrases":[
  {"en":"That's a great question.","ja":"いい質問ですね。","tip":"答える前のひと呼吸に使えます。考える時間もかせげます。"},
  {"en":"Just to clarify, do you mean ~?","ja":"確認ですが、~という意味でしょうか?","tip":"<b>clarify</b> = はっきりさせる。質問がわかりにくいときに使います。"},
  {"en":"I don't have the exact number with me.","ja":"今、正確な数字は手元にありません。","tip":"知らないことを無理に答えず、正直に言うのがプロです。"},
  {"en":"I'll follow up with you by email.","ja":"後ほどメールでご連絡します。","tip":"follow up = あとで追加の対応をする。"},
  {"en":"Does that answer your question?","ja":"これでご質問の答えになっていますか?","tip":"答えのあとに確認すると、ていねいな印象になります。"}],
 "lines":[
  {"who":"p","en":"Thanks for the presentation. I have a question about the budget.","ja":"プレゼンありがとうございました。予算について質問があります。"},
  {"who":"me","ja":"どうぞ、と促したい","opts":[
   {"en":"Question? Okay, say it.","ok":false,"fb":"say it は「言ってみろ」のように聞こえ、失礼です。"},
   {"en":"No questions, please.","ok":false,"fb":"「質問はお断り」と言っています。質疑応答の時間なのに!"},
   {"en":"Of course. Please go ahead.","ok":true,"fb":"go ahead は「どうぞ(話してください)」。Sure, go ahead. もOKです。"}]},
  {"who":"p","en":"You said the project will cost less next year. Why is that?","ja":"来年はプロジェクトの費用が下がるとおっしゃいましたね。それはなぜですか?"},
  {"who":"me","ja":"いい質問です。主にソフトウェアの費用が下がるからです","opts":[
   {"en":"Great question. It's mainly because software costs will go down.","ok":true,"fb":"mainly because で「主な理由は」。答えの前に Great question. を入れると落ち着いて話せます。"},
   {"en":"Good question. Software costs will go up.","ok":false,"fb":"go up は「上がる」で、説明と逆です。"},
   {"en":"Your question is difficult, so pass.","ok":false,"fb":"「難しいのでパス」は、プレゼンターとして信頼を失います。"}]},
  {"who":"p","en":"I see. And do you know exactly how much we'll save?","ja":"なるほど。正確にいくら節約できるかわかりますか?"},
  {"who":"me","ja":"今は正確な数字が手元にないので、後でメールします","opts":[
   {"en":"I don't know. Ask someone else.","ok":false,"fb":"突き放す答えで、相手を困らせてしまいます。"},
   {"en":"I don't have the exact number with me, but I'll email it to you.","ok":true,"fb":"知らないことは正直に言い、次の行動を約束するのがプロの答え方です。"},
   {"en":"We will save all the money.","ok":false,"fb":"「お金を全部節約します」と、ありえない約束をしています。"}]},
  {"who":"p","en":"That would be great. One more thing. What happens if the launch is delayed?","ja":"助かります。もう一つ。もし立ち上げが遅れたらどうなりますか?"},
  {"who":"me","ja":"確認ですが、予算への影響のことですか?","opts":[
   {"en":"You mean, what is delay?","ok":false,"fb":"「遅れとは何か?」という別の質問になってしまいます。"},
   {"en":"Please ask an easier question.","ok":false,"fb":"「もっと簡単な質問をして」は失礼です。"},
   {"en":"Just to clarify, do you mean the impact on the budget?","ok":true,"fb":"Just to clarify で質問の意味を確認できます。ずれた答えを防げます。"}]},
  {"who":"p","en":"Yes, exactly.","ja":"はい、その通りです。"},
  {"who":"me","ja":"予備の予算があるので大丈夫。答えになっているか確認したい","opts":[
   {"en":"We have a backup budget for that. Does that answer your question?","ok":true,"fb":"Does that answer your question? で、相手が納得したかをていねいに確認できます。"},
   {"en":"No problem, maybe. I hope.","ok":false,"fb":"maybe と I hope で、とても頼りなく聞こえます。"},
   {"en":"We have a backup budget. Do you understand?","ok":false,"fb":"Do you understand? は「わかりましたか?」と上から目線に聞こえます。"}]},
  {"who":"p","en":"Yes, it does. Thank you.","ja":"はい、よくわかりました。ありがとうございます。"}],
 "wrap":"質疑応答では、わからない質問は Just to clarify で確認、答えられないことは I'll follow up で後回しにしてOK。正直さが信頼につながります。"},

{"id":"t16","lv":4,"t":"採用面接(英語)","place":"Job interview","partner":"Ms. Rivera (interviewer)","pv":"f",
 "goal":"英語の面接で、経験・強み・志望動機を伝えて、最後に質問もしましょう。",
 "phrases":[
  {"en":"Thank you for having me.","ja":"本日はお時間をいただきありがとうございます。","tip":"面接や番組に呼ばれたときの定番のあいさつです。"},
  {"en":"I have five years of experience in marketing.","ja":"マーケティングの経験が5年あります。","tip":"<b>~ years of experience in 分野</b> の形をそのまま覚えましょう。"},
  {"en":"I'm good at using data to solve problems.","ja":"データを使って問題を解決するのが得意です。","tip":"be good at ~ing で「~するのが得意」。"},
  {"en":"I'm looking for a chance to grow.","ja":"成長できる機会を探しています。","tip":"志望動機で使える、前向きな表現です。"},
  {"en":"What does a typical day look like in this role?","ja":"この職種の典型的な1日はどんな感じですか?","tip":"逆質問の定番。仕事への関心が伝わります。"}],
 "lines":[
  {"who":"p","en":"Hi, thanks for coming in today. How are you?","ja":"こんにちは、本日はお越しいただきありがとうございます。お元気ですか?"},
  {"who":"me","ja":"元気です。お時間をいただきありがとうございます","opts":[
   {"en":"I'm nervous, so bad.","ok":false,"fb":"「緊張していて最悪です」と聞こえ、第一印象がよくありません。"},
   {"en":"I'm doing well. Thank you for having me.","ok":true,"fb":"I'm doing well. は大人の「元気です」。Thank you for having me. で好印象です。"},
   {"en":"Thank you for inviting yourself.","ok":false,"fb":"invite yourself は「押しかける」という意味。面接官に失礼です!"}]},
  {"who":"p","en":"Great. So, tell me a little about yourself.","ja":"では、簡単に自己紹介をお願いします。"},
  {"who":"me","ja":"マーケティングの経験が5年ある","opts":[
   {"en":"I am marketing for five years.","ok":false,"fb":"「私はマーケティングです」という文になっています。I have worked in marketing for five years. なら正しいです。"},
   {"en":"I have five years experience of marketing.","ok":false,"fb":"five years <b>of</b> experience <b>in</b> marketing が正しい形です。"},
   {"en":"I have five years of experience in marketing.","ok":true,"fb":"経験年数を言う基本の形です。面接で必ず使えます。"}]},
  {"who":"p","en":"Nice. What would you say is your biggest strength?","ja":"いいですね。あなたの一番の強みは何だと思いますか?"},
  {"who":"me","ja":"データを使って問題を解決するのが得意","opts":[
   {"en":"I'm good at using data to solve problems.","ok":true,"fb":"be good at ~ing で強みをはっきり言えます。具体例を続けるとさらに説得力が増します。"},
   {"en":"My strength is my strong body.","ok":false,"fb":"体の強さの話になってしまい、仕事の強みが伝わりません。"},
   {"en":"I can everything with data.","ok":false,"fb":"can のあとに動詞がありません。また「何でもできる」は言いすぎです。"}]},
  {"who":"p","en":"Interesting. And why do you want to work here?","ja":"興味深いですね。では、なぜ当社で働きたいのですか?"},
  {"who":"me","ja":"成長の機会を探していて、御社の製品が大好きだから","opts":[
   {"en":"Because the salary is high.","ok":false,"fb":"正直すぎます!志望動機としては印象がよくありません。"},
   {"en":"Because I want to work here.","ok":false,"fb":"質問をくり返しているだけで、理由になっていません。"},
   {"en":"I'm looking for a chance to grow, and I love your products.","ok":true,"fb":"成長意欲と会社への興味の両方が伝わる、前向きな答えです。"}]},
  {"who":"p","en":"Thank you. Do you have any questions for us?","ja":"ありがとうございます。何か質問はありますか?"},
  {"who":"me","ja":"この職種の典型的な1日について聞きたい","opts":[
   {"en":"No, nothing. Bye.","ok":false,"fb":"質問がないうえに Bye. で終わると、やる気がないように見えます。"},
   {"en":"What does a typical day look like in this role?","ok":true,"fb":"仕事への関心が伝わる逆質問です。What are the biggest challenges in this role? もおすすめです。"},
   {"en":"How many vacation days can I take?","ok":false,"fb":"英語は正しいですが、最初の質問が休暇の話だと仕事への意欲を疑われます。"}]},
  {"who":"p","en":"Great question. Most days start with a short team meeting at nine.","ja":"いい質問ですね。たいていの日は9時の短いチームミーティングから始まります。"}],
 "wrap":"面接は「経験(years of experience in)→強み(I'm good at)→志望動機(a chance to grow)→逆質問」の順で準備しておくと安心です。"}
];

const P2 = [
  {"q":"Where should I put these boxes of brochures?","o":["Next to the reception desk is fine.","About two hundred copies.","Yes, they look great."],"a":0,"why":"Where(どこに)に対して「受付の横」と場所で答えているAが正解です。Bは数(いくつ)の答え、Cは疑問詞の質問にYesで答えているのでダメです。","type":"WH"},
  {"q":"Who's in charge of the client presentation on Friday?","o":["It's on the fifth floor.","I think Ms. Patel is leading it.","The present was wrapped nicely."],"a":1,"why":"Who(だれが担当)に対して人の名前で答えているBが正解です。Aは場所の答え。Cは presentation と音が似た present(プレゼント)を使ったひっかけです。","type":"WH"},
  {"q":"Why was the staff meeting moved to Thursday?","o":["We moved here last year.","For about an hour.","Didn't you see Mr. Okada's memo?"],"a":2,"why":"「岡田さんのメモを見なかったの?(そこに理由が書いてあるよ)」と、理由を直接言わずに答えるCが正解です(遠回しな答え)。Aは同じ単語 moved をくり返したひっかけ、Bは時間の長さの答えです。","type":"WH"},
  {"q":"How long does it take to get to the airport from here?","o":["About forty minutes by taxi.","Yes, it's a long flight.","At Gate 12."],"a":0,"why":"How long(どのくらい時間がかかる)に対して「タクシーで約40分」と答えるAが正解です。Bは疑問詞の質問にYesで答えていて、long をくり返したひっかけ。Cは場所の答えです。","type":"WH"},
  {"q":"What time does the store open on Sundays?","o":["It's on Main Street.","Let me check the schedule online.","I'd like to open an account."],"a":1,"why":"「ネットで営業時間を調べてみます」と、すぐに答えずに対応するBが正解です(遠回しな答え)。Aは場所の答え、Cは open を別の意味(口座を開く)でくり返したひっかけです。","type":"WH"},
  {"q":"Which supplier did we choose for the office chairs?","o":["They're very comfortable.","Please choose any seat.","The one from Lakeside Furniture."],"a":2,"why":"Which supplier(どの業者)に対して「レイクサイド家具のもの」と答えるCが正解です。Aはいすの感想で、どの業者かに答えていません。Bは choose をくり返したひっかけです。","type":"WH"},
  {"q":"How did the product launch go yesterday?","o":["Better than we expected.","It launches next month.","I'll go by train."],"a":0,"why":"How did ~ go(どうだった)に対して「思ったより良かった」と答えるAが正解です。Bは「昨日」の話なのに来月と言っていて合いません。Cは go をくり返したひっかけです。","type":"WH"},
  {"q":"Where can I find the updated sales figures?","o":["They went up by ten percent.","Mr. Chen sent them to everyone this morning.","Fine, thank you."],"a":1,"why":"「チェンさんが今朝みんなに送りましたよ(メールを見て)」と、場所を直接言わずに教えるBが正解です(遠回しな答え)。Aは数字の中身の話で、どこにあるかに答えていません。Cはあいさつへの返事です。","type":"WH"},
  {"q":"Who should I contact about the broken projector?","o":["It was projected to rise.","In Conference Room B.","Call the IT help desk at extension 204."],"a":2,"why":"Who(だれに連絡)に対して「IT ヘルプデスクの内線204へ」と連絡先を答えるCが正解です。Aは projector と音が似た projected(予測された)のひっかけ、Bは場所の答えです。","type":"WH"},
  {"q":"Why is the parking lot closed today?","o":["They're repaving it.","Close to the station.","Until six o'clock."],"a":0,"why":"Why(なぜ)に対して「舗装し直しているから」と理由を答えるAが正解です。Bは closed と音が似た close(近い)のひっかけ、Cはいつまでかの答えです。","type":"WH"},
  {"q":"How many people have signed up for the workshop?","o":["Sign here, please.","I haven't checked the list yet.","It's a two-day workshop."],"a":1,"why":"「まだ名簿を確認していません」と、人数を知らないことを伝えるBが正解です(遠回しな答え)。Aは signed と似た sign、Cは workshop をくり返したひっかけです。","type":"WH"},
  {"q":"When is the deadline for the budget proposal?","o":["About fifty thousand dollars.","I proposed it last week.","It's due at the end of the month."],"a":2,"why":"When(いつ)に対して「月末が締め切り」と時期を答えるCが正解です。Aは金額の答え、Bは proposal と似た proposed のひっかけです。","type":"WH"},
  {"q":"Have you finished reviewing the contract?","o":["Almost. I just have one page left.","The contact list is on my desk.","Yes, a two-year contract."],"a":0,"why":"「もう少し。あと1ページです」と進み具合を答えるAが正解です。Bは contract と音が似た contact のひっかけ。CはYesのあとが「2年契約」で、読み終えたかどうかに答えていません。","type":"YN"},
  {"q":"Is Ms. Rivera coming to the training session?","o":["The train leaves at nine.","She's out of town this week.","Yes, it was a long session."],"a":1,"why":"「今週は出張(町にいない)です」と、来られないことを遠回しに伝えるBが正解です。Aは training と音が似た train、Cは session をくり返し、しかも過去の話なので合いません。","type":"YN"},
  {"q":"Do you know where the spare keys are kept?","o":["Yes, keep the change.","The key point is cost.","In the top drawer of my desk."],"a":2,"why":"「机のいちばん上の引き出しです」と場所を教えるCが正解です。Aは kept と似た keep、Bは key を別の意味(大事な点)で使ったひっかけです。","type":"YN"},
  {"q":"Did the shipment from Denver arrive?","o":["Yes, it came in an hour ago.","No, I've never been to Denver.","It's a large ship."],"a":0,"why":"「はい、1時間前に届きました」と答えるAが正解です。Bは Denver をくり返していますが、荷物の話ではありません。Cは shipment と似た ship(船)のひっかけです。","type":"YN"},
  {"q":"Are we still meeting with the clients at three?","o":["Yes, I met them at the station.","Three copies, please.","They asked to push it back to four."],"a":2,"why":"「先方が4時に遅らせてほしいと言っています」と、予定の変更を伝えるCが正解です(Yes/Noを言わない遠回しな答え)。Aは過去の話、Bは three をくり返したひっかけです。","type":"YN"},
  {"q":"Is there a pharmacy near the hotel?","o":["The hotel has a pool.","There's one right across the street.","Near the end of the year."],"a":1,"why":"「道のすぐ向かいにありますよ」と答えるBが正解です(one = a pharmacy)。Aは hotel、Cは near をくり返したひっかけです。","type":"YN"},
  {"q":"Will you be able to finish the report by tomorrow?","o":["I'll need a couple more days.","Yes, I read the report.","The finish line is over there."],"a":0,"why":"「あと2、3日必要です」と、明日はむずかしいことを遠回しに伝えるAが正解です。Bは過去の話で質問に合わず、Cは finish をくり返したひっかけです。","type":"YN"},
  {"q":"Would you like to sit by the window or near the aisle?","o":["Yes, I'd like that.","The window seat, please.","It was a nice view."],"a":1,"why":"「AかBか」の質問には、どちらかを選ぶBが正解です。選択の質問にYesで答えるAはダメです。Cは景色の感想で、選んでいません。","type":"選択"},
  {"q":"Should we hold the party in the cafeteria or rent a restaurant?","o":["Yes, it was a great party.","I'll have the pasta.","The cafeteria would save us money."],"a":2,"why":"「社員食堂ならお金が節約できます」と理由つきで片方を選ぶCが正解です。Aは選択の質問にYesで答えていて、しかも過去の話。Bは restaurant から連想させる料理の注文です。","type":"選択"},
  {"q":"Are you taking the train or driving to the conference?","o":["I haven't decided yet.","Yes, the conference was useful.","He's a good driver."],"a":0,"why":"「まだ決めていません」と答えるAが正解です。どちらも選ばない答え方もTOEICではよく正解になります。Bは conference をくり返したひっかけ、Cは driving と似た driver で、主語の He もおかしいです。","type":"選択"},
  {"q":"Do you want the report printed, or should I email it to you?","o":["Yes, the printer's fixed.","Email is fine, thanks.","It's a twenty-page report."],"a":1,"why":"「メールでいいです」と片方を選ぶBが正解です。Aは printed と似た printer、Cは report をくり返したひっかけです。","type":"選択"},
  {"q":"Is the seminar on Tuesday or Wednesday?","o":["Yes, I'll be there.","It's a seminar on marketing.","It's listed on the company calendar."],"a":2,"why":"「会社のカレンダーに載っていますよ(見てね)」と、どこで確かめられるかを伝えるCが正解です(遠回しな答え)。Aは選択の質問にYes、Bは seminar と on をくり返していますが曜日に答えていません。","type":"選択"},
  {"q":"Could you help me move these tables after lunch?","o":["Sure, just let me know when.","We had lunch at noon.","The movie was too long."],"a":0,"why":"Could you ~?(〜してくれますか)というお願いに「いいですよ、時間を教えて」と引き受けるAが正解です。Bは lunch をくり返し、Cは move と音が似た movie のひっかけです。","type":"依頼・提案"},
  {"q":"Why don't we order some food for the team tonight?","o":["Because the order was late.","That's a great idea.","The team won the game."],"a":1,"why":"Why don't we ~?は「〜しませんか」という提案です。「いい考えですね」と賛成するBが正解です。Why につられて Because で答えるAは定番のひっかけ。Cは team をくり返しています。","type":"依頼・提案"},
  {"q":"Would you mind reviewing my slides before the meeting?","o":["It was a positive review.","The meeting room is booked.","I'm free after two o'clock."],"a":2,"why":"「2時以降なら空いています(そのときに見ますよ)」と、引き受けることを遠回しに伝えるCが正解です。Aは review、Bは meeting をくり返したひっかけです。","type":"依頼・提案"},
  {"q":"Can you send me the client's phone number?","o":["I'll text it to you right now.","The phone is new.","A number of clients."],"a":0,"why":"「今すぐメッセージで送ります」と引き受けるAが正解です。Bは phone、Cは number と client をくり返したひっかけです。","type":"依頼・提案"},
  {"q":"Let's take a short break before we continue.","o":["It's a long story.","Can we finish this section first?","The brakes were repaired."],"a":1,"why":"「休けいしよう」という提案に「先にこの部分を終わらせませんか」と別の案を返すBが正解です(遠回しな答え)。Aは short の反対の long で連想させるひっかけ、Cは break と同じ音の brakes(ブレーキ)です。","type":"依頼・提案"},
  {"q":"How about meeting at the café across from the office?","o":["I'd like a coffee, please.","It's about two hours.","That works for me."],"a":2,"why":"How about ~?(〜はどう?)という提案に「それでいいですよ」と答えるCが正解です。Aは café から連想させる注文、Bは about をくり返したひっかけです。","type":"依頼・提案"},
  {"q":"The copy machine on the third floor is out of paper again.","o":["I'll bring some from the supply room.","Three copies each.","It's not on the floor."],"a":0,"why":"「紙がない」という報告に「備品室から持ってきます」と対応するAが正解です(some = some paper)。Bは copy と third(three)、Cは floor をくり返したひっかけです。","type":"平叙文"},
  {"q":"I can't find the file for the Harmon account.","o":["I'll open an account.","Kenji was using it this morning.","I'll file a complaint."],"a":1,"why":"「今朝ケンジさんが使っていましたよ」と、ありかのヒントを伝えるBが正解です(遠回しな答え)。Aは account、Cは file を別の意味(苦情を申し立てる)でくり返したひっかけです。","type":"平叙文"},

{"s":"It is essential that every employee ____ the updated safety guidelines.","c":["follows","followed","will follow","follow"],"a":3,"why":"It is essential that ~ のように「必要だ・大切だ」を表す表現の後のthat節では、主語に関係なく動詞の原形を使います(米語の標準)。そのためfollowsではなくfollowが正解です。","k":"時制・態","lv":4},
{"s":"If you have any questions about the event, please contact ____ at 555-0182.","c":["we","us","our","ours"],"a":1,"why":"動詞contactの目的語なので、目的格のus(私たちに)が入ります。weは主語の形、ourは名詞の前に置く形、oursは「私たちのもの」という意味です。","k":"代名詞・関係詞","lv":1},
{"s":"The employees ____ attended the workshop received a certificate.","c":["which","whose","who","whom"],"a":2,"why":"先行詞が人(The employees)で、空所の後ろに主語のない動詞attendedが続くので、主格の関係代名詞whoです。whichは物に使い、whoseは後ろに名詞が必要、whomは目的語の役割のときに使います。","k":"代名詞・関係詞","lv":2},
{"s":"Mr. Novak prefers to review the contracts ____ rather than delegate the task.","c":["him","his","himself","he"],"a":2,"why":"「人に任せるより自分で確認したい」という意味で、「自分で」を強調するhimselfが入ります。文はすでに完成しているので、him、his、he を置く場所はありません。","k":"代名詞・関係詞","lv":2},
{"s":"Kendall Corp. is looking for a consultant ____ experience includes international marketing.","c":["who","which","whom","whose"],"a":3,"why":"空所の後ろに名詞experienceがあり、「そのコンサルタントの経験」という所有の関係なのでwhoseが正解です。who、which、whom の後ろには名詞をそのまま続けられません。","k":"代名詞・関係詞","lv":3},
{"s":"The conference center, ____ was renovated last year, can now hold up to 800 guests.","c":["which","that","where","what"],"a":0,"why":"カンマで区切られた補足説明(非制限用法)で、先行詞は物(center)、後ろに主語がないのでwhichです。thatはカンマの後では使えません。whereは後ろに完全な文が必要で、whatは先行詞をとりません。","k":"代名詞・関係詞","lv":3},
{"s":"The city of Brookfield, ____ the company's new factory will be built, offers generous tax incentives.","c":["which","what","where","whom"],"a":2,"why":"空所の後ろ the company's new factory will be built は主語も動詞もそろった完全な文です。場所(Brookfield)について「そこで工場が建てられる」と説明するので関係副詞whereが入ります。whichは後ろに主語か目的語が欠けた文が必要です。","k":"代名詞・関係詞","lv":4},
{"s":"This year's sales figures are much ____ than last year's.","c":["high","higher","highest","highly"],"a":1,"why":"後ろにthan(~よりも)があるので比較級higherです。muchは比較級を強めて「ずっと」という意味になります。highestは最上級、highlyは副詞です。","k":"その他(比較・数・慣用)","lv":1},
{"s":"Of all the candidates, Ms. Bryant has the ____ experience in project management.","c":["more","most","much","many"],"a":1,"why":"Of all the candidates(候補者全員の中で)とtheがあるので最上級mostです。moreは比較級で than と使うのが基本です。experienceは数えられない名詞なので many も使えません。","k":"その他(比較・数・慣用)","lv":2},
{"s":"____ of the applicants has been contacted for a second interview.","c":["Each","All","Both","Many"],"a":0,"why":"動詞が has been と単数の形なので、単数扱いのEachが正解です。All、Both、Many of the applicants は複数扱いになり、have been が必要です。","k":"その他(比較・数・慣用)","lv":3},
{"s":"The new printer is twice as ____ as the old model.","c":["faster","fastest","fastly","fast"],"a":3,"why":"twice as ~ as ... で「…の2倍~」です。as と as の間には形容詞・副詞の元の形が入るのでfastが正解です。fasterやfastestは as ~ as の間に入りません。fastlyという単語はありません。","k":"その他(比較・数・慣用)","lv":3},
{"s":"Only after the inspection was completed ____ allowed to enter the building.","c":["the workers were","were the workers","the workers","were workers being"],"a":1,"why":"Only after ~ が文の先頭に来ると、その後ろは疑問文と同じ語順(倒置)になります。そのためwere the workersが正解です。the workers were は普通の語順なので誤り、the workers だけでは動詞がありません。","k":"その他(比較・数・慣用)","lv":4},
{"s":"The ____ the deadline approaches, the busier the editorial team becomes.","c":["close","closest","more close","closer"],"a":3,"why":"The 比較級 ~, the 比較級 ... で「~すればするほど…」です。後半が the busier なので、前半も比較級closerが入ります。closeの比較級はcloserで、more close とは言いません。","k":"その他(比較・数・慣用)","lv":4}
];

const P6 = [
{"kind":"Email","title":"Your Recent Order","text":"Dear Ms. Alvarez,\n\nThank you for your recent order from Clearwater Office Supply. Unfortunately, the ergonomic chairs you requested are [1] out of stock. Our supplier has informed us that a new shipment will arrive on June 12. [2]\n\nIn the meantime, we would like to offer you a 15 percent discount on your next purchase as an [3] for the inconvenience. If you would prefer to cancel your order, please let us know, and we will issue a full refund [4] three business days.\n\nSincerely,\nDaniel Brooks\nCustomer Service Manager","ja":"アルバレス様\n\nこのたびはクリアウォーター・オフィスサプライにご注文いただき、ありがとうございます。あいにく、ご注文の人間工学チェアは一時的に在庫切れとなっております。仕入れ先によると、6月12日に新しい商品が入荷する予定です。入荷しだい、すぐにチェアを発送いたします。\n\nそれまでの間、ご不便をおかけしたおわびとして、次回のお買い物に使える15%割引をご用意いたしました。ご注文のキャンセルをご希望の場合はお知らせください。3営業日以内に全額を返金いたします。\n\nよろしくお願いいたします。\nダニエル・ブルックス\nカスタマーサービス・マネージャー","qs":[{"n":1,"o":["temporary","temporariness","temporarily","temporaries"],"a":2,"why":"are と out of stock(在庫切れ)の間で、状態を説明する副詞temporarily(一時的に)が入ります。temporaryは形容詞なので「are temporary out of stock」とは言えません。temporarinessとtemporariesは名詞です。"},{"n":2,"o":["Your chairs were delivered to your office yesterday.","Our store will be closed for the holiday on June 12.","We will ship your chairs as soon as they arrive at our warehouse.","Thank you for completing our customer survey."],"a":2,"why":"直前に「6月12日に入荷予定」とあるので、「入荷しだい発送します」が自然につながります。「昨日届けた」は在庫切れの話と矛盾します。休業や顧客アンケートの話は前後と関係がありません。"},{"n":3,"o":["excuse","reason","appreciation","apology"],"a":3,"why":"「ご不便(the inconvenience)」に対して割引を出すので、as an apology for ~(~のおわびとして)が正解です。excuse(言い訳)、reason(理由)、appreciation(感謝)は、不便をかけた相手への割引の説明として意味が合いません。"},{"n":4,"o":["since","until","among","within"],"a":3,"why":"within three business days で「3営業日以内に」です。since(~以来)は過去の起点、until(~まで継続)は動作が続く場合に使い、among(~の間で)は3つ以上のものの中を表すので合いません。"}]},
{"kind":"Notice","title":"Notice to All Tenants of the Harbor View Building","text":"Notice to All Tenants of the Harbor View Building\n\nPlease be advised that the building's main elevators [1] on Saturday, March 8, from 8:00 A.M. to 4:00 P.M. During this time, technicians from Summit Elevator Services will replace several worn parts. [2] Tenants who need to move heavy items are asked to schedule their deliveries for another day.\n\nWe understand that this work may cause some [3]. To reduce the impact, the service elevator at the rear of the building will remain in operation. Please direct any questions to the building management office, [4] is located on the first floor.\n\nThank you for your cooperation.","ja":"ハーバービュー・ビルのテナントの皆様へのお知らせ\n\n3月8日(土)午前8時から午後4時まで、ビルのメインエレベーターがご利用いただけなくなりますのでご承知おきください。この間、サミット・エレベーター・サービスの技術者が、すり減った部品をいくつか交換します。ビルの両側の階段は終日ご利用いただけます。重い荷物を運ぶ必要があるテナントの方は、配送を別の日に予定してください。\n\nこの作業によりご不便をおかけすることがあるかと存じます。影響を少なくするため、ビル裏手の業務用エレベーターは引き続き運転します。ご質問は1階にあるビル管理事務所までお寄せください。\n\nご協力よろしくお願いいたします。","qs":[{"n":1,"o":["were unavailable","will be unavailable","have been unavailable","had been unavailable"],"a":1,"why":"続く文で technicians ... will replace と未来の予定が書かれているので、これから先の工事のお知らせです。未来を表すwill be unavailableが正解です。過去形や完了形は「もう終わったこと」になってしまいます。"},{"n":2,"o":["Rent payments are due on the first day of each month.","The stairways on both sides of the building will remain open throughout the day.","Technicians completed the repair work ahead of schedule.","Our office is now accepting applications for the parking lot."],"a":1,"why":"エレベーターが止まる話の流れなので、「階段は終日使える」という代わりの案内が自然です。「修理が予定より早く終わった」は、これからの工事という内容と矛盾します。家賃や駐車場の話は前後と関係がありません。"},{"n":3,"o":["inconvenient","inconvenience","inconveniently","inconvenienced"],"a":1,"why":"cause some ~ の目的語なので名詞のinconvenience(不便)が入ります。cause some inconvenience は「多少の不便をかける」という決まった言い方です。inconvenientは形容詞、inconvenientlyは副詞です。"},{"n":4,"o":["which","where","who","what"],"a":0,"why":"カンマの後で office(物)を説明し、後ろの is located には主語がないので関係代名詞whichです。whereの後ろには主語のそろった文が必要です。whoは人に使い、whatは先行詞をとりません。"}]},
{"kind":"Memo","title":"New Expense Reporting System","text":"To: All Sales Staff\nFrom: Priya Desai, Sales Director\nDate: October 2\nSubject: New Expense Reporting System\n\nStarting November 1, all travel expenses must be submitted through our new online system, ExpenseTrack. Paper forms will no longer be [1]. The new system allows you to upload photos of your receipts directly from your phone, [2] should save you considerable time.\n\nTo help everyone get started, the IT department will hold two training sessions next week. [3] Attendance is strongly recommended for anyone who travels regularly.\n\nIf you have trouble logging in, please contact Marco Lindqvist in IT. He will be happy to [4] you.","ja":"宛先: 営業部員各位\n差出人: プリヤ・デサイ(営業部長)\n日付: 10月2日\n件名: 新しい経費精算システム\n\n11月1日から、出張経費はすべて新しいオンラインシステム「ExpenseTrack」で提出しなければなりません。紙の用紙は今後受け付けません。新システムでは、スマートフォンから直接レシートの写真をアップロードできるので、かなりの時間の節約になるはずです。\n\n皆さんが使い始められるよう、IT部門が来週2回の研修会を開きます。各回は約1時間で、会議室Bで行われます。出張の多い人は、ぜひ参加してください。\n\nログインできない場合は、IT部門のマルコ・リンドクビストに連絡してください。喜んでお手伝いします。","qs":[{"n":1,"o":["accept","accepting","accepted","acceptably"],"a":2,"why":"紙の用紙は「受け付けられる」側なので、be + 過去分詞の受け身acceptedが正解です。be accepting だと「用紙が受け付ける」という意味になってしまいます。acceptは原形でbeの後ろに置けず、acceptablyは副詞です。"},{"n":2,"o":["which","what","who","where"],"a":0,"why":"カンマの後で、前の文の内容全体(写真をアップロードできること)を受けて「それは時間の節約になる」と続けるので、関係代名詞whichです。whatは先行詞をとらず、whoは人、whereは場所に使います。"},{"n":3,"o":["Paper forms are available at the front desk.","The sales team exceeded its targets last quarter.","The system was discontinued because of technical problems.","Each session will last about one hour and will be held in Conference Room B."],"a":3,"why":"直前で「研修会を2回開く」と述べているので、「各回は約1時間、会議室Bで」と研修の詳細を続けるのが自然です。「紙の用紙を受付で配布」と「システムは中止された」は本文と矛盾します。売上目標の話は関係がありません。"},{"n":4,"o":["assist","assistance","assistant","assisting"],"a":0,"why":"be happy to do(喜んで~する)のtoの後ろは動詞の原形なのでassist(手伝う)です。assistanceは名詞、assistantは「助手」という名詞、assistingは-ing形で、to の後ろには置けません。"}]},
{"kind":"Article","title":"Local Bakery to Open Second Location","text":"MILLBROOK (May 14) — Golden Crust Bakery, a family-owned business on Pine Street, will open its second location next month. The new shop, [1] on Riverside Avenue, will be nearly twice the size of the original store.\n\nOwner Lena Hoffmann said the expansion was made possible by steady growth over the past five years. \"Our customers have been very loyal,\" she said. \"[2]\"\n\nThe new location will feature a seating area and will offer light lunches [3] baked goods. Ms. Hoffmann plans to hire about twelve additional employees. Interested applicants are [4] to visit the bakery's Web site for details.","ja":"ミルブルック(5月14日) — パイン通りの家族経営の店、ゴールデンクラスト・ベーカリーが来月、2号店をオープンする。リバーサイド通りにできる新店舗は、もとの店の約2倍の広さになる。\n\nオーナーのレナ・ホフマン氏によると、今回の拡大はこの5年間の安定した成長によって実現したという。「お客様はとても長くごひいきにしてくださっています」と同氏は語った。「多くの方から、自宅や職場の近くに店を開いてほしいと言われてきました。」\n\n新店舗には座席スペースが設けられ、パンや焼き菓子に加えて軽いランチも提供する。ホフマン氏は約12人の従業員を新たに雇う予定だ。応募希望者は、詳細についてベーカリーのウェブサイトを見るよう勧められている。","qs":[{"n":1,"o":["located","locating","location","locates"],"a":0,"why":"The new shop, ~ on Riverside Avenue, で「リバーサイド通りにある新店舗」と説明を加える形です。店は「位置させられている」側なので過去分詞locatedが正解です。locatingだと店が何かを配置することになり、locationは名詞、locatesは動詞の現在形です。"},{"n":2,"o":["We are sorry to announce that the bakery will close permanently.","Our prices will rise because sales have fallen sharply.","I have never worked in the food industry before.","Many of them have asked us to open a shop closer to their homes and offices."],"a":3,"why":"直前の「お客様はとても長くごひいきにしてくれている」に続き、2号店を出す理由として「近くに店を開いてと頼まれてきた」が自然です。「閉店する」「売上が急落」は「安定した成長で拡大」という内容と矛盾します。5年以上店を続けているので「食品業界で働いたことがない」もおかしいです。"},{"n":3,"o":["as long as","as well as","so that","even if"],"a":1,"why":"空所の後ろはbaked goodsという名詞だけです。名詞をつなげられるのはas well as(~に加えて)です。as long as、so that、even if は接続詞なので、後ろに主語と動詞のある文が必要です。"},{"n":4,"o":["encouraging","encouragement","encouraged","encourages"],"a":2,"why":"be encouraged to do で「~するよう勧められる」という受け身の形です。応募者は「勧められる」側なのでencouragedが正解です。encouragingだと応募者が誰かを励ますことになり、encouragementは名詞、encouragesは動詞の現在形です。"}]}
];

const P7 = [
{"kind":"Email","title":"Staff luncheon on April 18","text":"From: Helen Marsh (hmarsh@brightlinedesign.com)\nTo: Victor Osei (vosei@oseicatering.com)\nDate: April 3\nSubject: Staff luncheon on April 18\n\nDear Mr. Osei,\n\nI am writing to confirm the details of our staff luncheon on April 18. We now expect about 45 guests, a few more than the 40 I mentioned on the phone. The event will take place in the main hall of our office at 12:30 P.M.\n\nWe would like a buffet featuring two vegetarian main dishes, as we discussed. Could you also provide coffee and tea after the meal? Please let me know if this will change the price you quoted.\n\nYour staff may use the loading dock on the north side of our building when they arrive to set up. I will make sure a parking space is reserved for your van.\n\nBest regards,\nHelen Marsh\nOffice Manager, Brightline Design","ja":"差出人: ヘレン・マーシュ\n宛先: ビクター・オセイ\n日付: 4月3日\n件名: 4月18日の社員昼食会\n\nオセイ様\n\n4月18日の社員昼食会の詳細を確認させていただきたく、ご連絡しました。参加者は現在約45名を見込んでおり、お電話でお伝えした40名より少し増えています。会場は当社オフィスのメインホールで、午後12時30分開始です。\n\nお話ししたとおり、ベジタリアン向けのメイン料理2品を含むビュッフェをお願いしたいと思います。食後にコーヒーと紅茶もご用意いただけますか。これによりお見積もりの金額が変わる場合はお知らせください。\n\n準備のために到着された際は、建物北側の搬入口をご利用いただけます。御社のバン用に駐車スペースを確保しておきます。\n\nよろしくお願いいたします。\nヘレン・マーシュ\nブライトライン・デザイン 総務マネージャー","qs":[{"q":"Why did Ms. Marsh write the e-mail?","o":["To request a refund for a canceled meal","To finalize arrangements for an event","To invite Mr. Osei to a staff party","To complain about a late delivery"],"a":1,"why":"冒頭で I am writing to confirm the details of our staff luncheon(昼食会の詳細を確認するため)と書いています。これを「イベントの手配を確定するため」と言いかえた選択肢が正解です。キャンセルや苦情の話はなく、オセイさんは招待客ではなく料理を用意する業者です。"},{"q":"What has changed since Ms. Marsh last spoke with Mr. Osei?","o":["The event has been moved to a new date.","The number of attendees has increased.","The meal will no longer include vegetarian dishes.","The luncheon will start earlier than planned."],"a":1,"why":"「電話で伝えた40名より少し多い約45名」とあるので、参加人数が増えたことがわかります。日付や開始時刻が変わったとは書かれていません。ベジタリアン料理は as we discussed(話したとおり)なので変更ではありません。"},{"q":"The word \"featuring\" in paragraph 2, line 1, is closest in meaning to","o":["including","advertising","starring","describing"],"a":0,"why":"a buffet featuring two vegetarian main dishes は「ベジタリアンのメイン料理2品を含むビュッフェ」という意味なので、including(含んでいる)が最も近いです。featureには「主演させる(starring)」や「特集する」という意味もありますが、ここでは料理の中身の話なので合いません。"}]},
{"kind":"Notice","title":"Westfield Public Library — Summer Hours","text":"Westfield Public Library — Summer Hours\n\nBeginning June 1, the Westfield Public Library will change its hours of operation for the summer season. The library will open at 9:00 A.M. and close at 6:00 P.M., Monday through Friday. On Saturdays, it will be open from 10:00 A.M. to 2:00 P.M. The library will be closed on Sundays.\n\nDuring the summer, the children's reading program will meet every Wednesday morning in the community room. Registration is free but required, and space is limited to 25 children.\n\nThe book drop outside the main entrance remains available 24 hours a day. Regular hours will resume on September 2. For more information, visit the front desk or call 555-0147.","ja":"ウェストフィールド公立図書館 — 夏季開館時間\n\n6月1日から、ウェストフィールド公立図書館は夏季の開館時間に変更します。月曜日から金曜日は午前9時に開館し、午後6時に閉館します。土曜日は午前10時から午後2時まで開館します。日曜日は休館です。\n\n夏の間、子ども向け読書プログラムは毎週水曜日の午前に多目的室で行います。登録は無料ですが必須で、定員は25名です。\n\n正面入口の外にある返却ポストは、引き続き24時間ご利用いただけます。通常の開館時間は9月2日から再開します。詳しくは受付にお越しいただくか、555-0147までお電話ください。","qs":[{"q":"What is NOT true about the library's summer schedule?","o":["It opens later on Saturdays than on weekdays.","It is closed one day a week.","It stays open until 8:00 P.M. on Fridays.","It ends in early September."],"a":2,"why":"月曜日から金曜日は午後6時閉館なので、「金曜日は午後8時まで」は本文と合いません。土曜日は午前10時開館で平日の9時より遅く、日曜日は休館(週1日)、9月2日に通常時間に戻る(9月初め)と書かれているので、他の3つは正しい内容です。"},{"q":"What is required to join the children's reading program?","o":["A small fee","Advance sign-up","A library card","A parent's attendance"],"a":1,"why":"Registration is free but required(登録は無料だが必須)とあるので、「事前の申し込み」が正解です。無料なので料金は不要です。図書館カードや保護者の同伴については書かれていません。"},{"q":"What can library users most likely do on a Sunday?","o":["Attend the reading program","Speak to staff at the front desk","Use the community room","Return books using the book drop"],"a":3,"why":"日曜日は休館ですが、返却ポストは「24時間利用可能」とあるので、本の返却はできると考えられます。読書プログラムは水曜日で、受付や多目的室は休館日には使えません。"}]},
{"kind":"Advertisement","title":"Northgate Fitness — Grand Reopening","text":"Northgate Fitness — Grand Reopening!\n\nAfter three months of renovations, Northgate Fitness is back and better than ever. Our expanded facility now includes a heated indoor pool, a dedicated cycling studio, and twice as many weight machines as before.\n\nTo celebrate, we are offering new members a special rate of $29 per month for the first six months — a savings of $20 per month. This offer is valid for anyone who signs up between March 1 and March 31. Current members who refer a friend will receive one month of free membership.\n\nFree group classes, including yoga and indoor cycling, are included with every membership. Visit us at 210 Carver Road or sign up online at www.northgatefitness.com.","ja":"ノースゲート・フィットネス — リニューアルオープン!\n\n3か月の改装を経て、ノースゲート・フィットネスがこれまで以上に充実して戻ってきました。広くなった施設には、温水の屋内プール、サイクリング専用スタジオがあり、ウエイトマシンは以前の2倍に増えました。\n\nこれを記念して、新規会員の方には最初の6か月間、月額29ドルの特別料金をご用意しました。毎月20ドルお得です。この特典は3月1日から3月31日までにご入会の方が対象です。友人を紹介した現会員の方には、1か月分の会費が無料になります。\n\nヨガや屋内サイクリングなどのグループクラスは、すべての会員プランに無料で含まれています。カーバー通り210番地までお越しいただくか、ウェブサイトからお申し込みください。","qs":[{"q":"What is suggested about Northgate Fitness?","o":["It was closed for a period of time.","It recently moved to a new address.","It has reduced the number of weight machines.","It charges extra for yoga classes."],"a":0,"why":"「3か月の改装を経て戻ってきた」とあるので、しばらく営業していなかったと推測できます。移転したとは書かれていません。ウエイトマシンは「2倍」に増え、ヨガなどのクラスは無料なので、他の選択肢は本文と逆です。"},{"q":"What is most likely the regular monthly membership fee?","o":["$20","$29","$39","$49"],"a":3,"why":"特別料金は月29ドルで、「毎月20ドルお得」とあります。29+20=49なので、通常料金は49ドルと考えられます。29ドルは特別料金、20ドルは割引額なので、ひっかけに注意しましょう。"},{"q":"How can current members receive a benefit?","o":["By renewing before March 1","By taking a cycling class","By recommending the gym to someone","By signing up online"],"a":2,"why":"Current members who refer a friend(友人を紹介した現会員)は1か月無料とあります。refer a friend を「誰かにジムを勧める」と言いかえた選択肢が正解です。更新時期やクラス参加、オンライン申し込みで特典がもらえるとは書かれていません。"}]},
{"kind":"Text message chain","title":"Akira Tanaka and Sofia Reyes","text":"Akira Tanaka [10:02 A.M.]\nHi Sofia, are you still at the Dalton Hotel? The clients from Merrow Industries just told me their flight landed early.\n\nSofia Reyes [10:05 A.M.]\nYes, I'm in the lobby. I was planning to set up the meeting room at 11:00.\n\nAkira Tanaka [10:07 A.M.]\nThey'll be there in about 40 minutes. Can the room be ready by then?\n\nSofia Reyes [10:09 A.M.]\nI'll check with the front desk. The projector is already in the room, but the printed handouts are still at the office.\n\nAkira Tanaka [10:12 A.M.]\nI can ask Ben to bring them. He's driving over to the hotel anyway.\n\nSofia Reyes [10:15 A.M.]\nThat would be perfect. And the front desk says we can have the room now.\n\nAkira Tanaka [10:16 A.M.]\nGreat. I'll let the clients know everything's ready for them.","ja":"アキラ・タナカ [午前10:02]\nソフィア、まだダルトン・ホテルにいる？メロー・インダストリーズのお客様から、飛行機が早く着いたと連絡があったんだ。\n\nソフィア・レイエス [午前10:05]\nはい、ロビーにいます。会議室の準備は11時にする予定でした。\n\nアキラ・タナカ [午前10:07]\nお客様は40分くらいでそちらに着くよ。それまでに部屋の準備はできるかな？\n\nソフィア・レイエス [午前10:09]\nフロントに確認します。プロジェクターはもう部屋にありますが、印刷した資料はまだオフィスにあります。\n\nアキラ・タナカ [午前10:12]\nベンに持ってきてもらうよう頼めるよ。どうせ車でホテルに向かっているから。\n\nソフィア・レイエス [午前10:15]\nそれは助かります。それと、フロントによると今すぐ部屋を使えるそうです。\n\nアキラ・タナカ [午前10:16]\nよかった。お客様に準備ができていると伝えるね。","qs":[{"q":"Why did Mr. Tanaka contact Ms. Reyes?","o":["To ask her to book a flight for a client","To tell her that some visitors will arrive sooner than planned","To report that a projector is not working","To change the location of a meeting"],"a":1,"why":"10:02に「お客様の飛行機が早く着いた」と伝えているので、「訪問者が予定より早く到着する」と言いかえた選択肢が正解です。航空券の予約や会場変更の話はなく、プロジェクターはすでに部屋にあると書かれていますが、故障しているとは書かれていません。"},{"q":"At 10:15 A.M., what does Ms. Reyes most likely mean when she writes, \"That would be perfect\"?","o":["She is glad that Ben can bring the handouts.","She is pleased that the clients' flight landed early.","She thinks the projector is in good condition.","She wants to meet the clients at the airport."],"a":0,"why":"直前の10:12でタナカさんが「ベンに資料を持ってきてもらえる」と提案しています。That would be perfect(それは完璧です=助かります)はその提案への返事です。飛行機の到着やプロジェクターについての返事ではありません。"},{"q":"What is mentioned about the meeting room?","o":["It was reserved for 10:00 A.M.","It is located in Ms. Reyes's office.","It is too small for the group.","A projector has already been placed in it."],"a":3,"why":"10:09に The projector is already in the room とあるので、「プロジェクターはすでに置かれている」が正解です。会議室はホテルにあり、オフィスにあるわけではありません。予約時間や部屋の広さについては書かれていません。"},{"q":"What will Mr. Tanaka most likely do next?","o":["Drive to the office","Print some documents","Contact the clients","Call the front desk"],"a":2,"why":"最後に I'll let the clients know(お客様に伝える)と書いているので、次にすることは「お客様に連絡する」です。車で移動しているのはベン(行き先はホテル)、フロントに確認したのはレイエスさんです。"}]},
{"kind":"Article","title":"Ridgeway Motors to Build Plant in Carlton","text":"Ridgeway Motors to Build Plant in Carlton\n\nCARLTON (July 9) — Ridgeway Motors announced on Tuesday that it will build a new manufacturing plant on the outskirts of Carlton. The facility, which will produce electric scooters and small delivery vehicles, is expected to begin operating in early 2028.\n\nAccording to company spokesperson Nadia Fournier, the plant will create approximately 600 jobs. Ridgeway has also agreed to partner with Carlton Community College to offer training programs in electrical engineering and vehicle maintenance.\n\nAlthough some residents have raised concerns about increased traffic on Route 14, the main road leading to the site, local officials welcomed the news. Mayor Gregory Lin said the project would bring \"much-needed investment\" to the region. The company stated that it will fund improvements to the road before construction begins.","ja":"リッジウェイ・モーターズ、カールトンに工場建設へ\n\nカールトン(7月9日) — リッジウェイ・モーターズは火曜日、カールトン郊外に新しい製造工場を建設すると発表した。電動スクーターと小型配送車を生産するこの施設は、2028年初めに稼働を始める見込みだ。\n\n同社広報担当のナディア・フルニエ氏によると、工場では約600人の雇用が生まれる。リッジウェイはまた、カールトン・コミュニティ・カレッジと提携し、電気工学と車両整備の研修プログラムを提供することにも合意した。\n\n一部の住民は、建設地に通じる主要道路である14号線の交通量の増加について懸念を示しているが、地元当局はこのニュースを歓迎した。グレゴリー・リン市長は、この計画が地域に「待望の投資」をもたらすと述べた。同社は、建設が始まる前に道路の改良費用を負担すると表明した。","qs":[{"q":"What is the article mainly about?","o":["The opening of a community college","The results of a local election","A company's plans for a new facility","A decline in vehicle sales"],"a":2,"why":"見出しと第1段落で「新しい工場を建設する」と述べ、記事全体がその計画について書かれています。カレッジは提携先として出てくるだけで、開校の話ではありません。選挙や販売の減少の話はありません。"},{"q":"What is NOT mentioned about the plant?","o":["The types of vehicles it will make","The number of jobs it will create","When it will start operating","How much it will cost to build"],"a":3,"why":"作る車の種類(電動スクーターと小型配送車)、雇用数(約600人)、稼働開始時期(2028年初め)はすべて書かれています。建設費用の金額はどこにも書かれていないので、これが正解です。"},{"q":"The word \"raised\" in paragraph 3, line 1, is closest in meaning to","o":["expressed","lifted","increased","grown"],"a":0,"why":"raise concerns は「懸念を示す・口にする」という意味なので、expressed(表明した)が最も近いです。raiseには「持ち上げる(lifted)」や「(値段などを)上げる(increased)」という意味もありますが、ここでは住民が心配を口にしたという意味なので合いません。"},{"q":"What will Ridgeway Motors most likely do before building the plant?","o":["Pay for work on a road","Move its headquarters to Carlton","Reduce the number of planned jobs","Open a training center at its headquarters"],"a":0,"why":"最後の文に「建設が始まる前に道路の改良費用を負担する(fund improvements to the road)」とあります。fund を pay for と言いかえた選択肢が正解です。本社の移転や雇用の削減は書かれておらず、研修はカレッジと協力して行うものです。"}]},
{"kind":"Invoice","title":"Pembroke Printing Co. — Invoice No. 20417","text":"INVOICE\nPembroke Printing Co.\n48 Mill Street, Ashford\nInvoice No. 20417   Date: September 22\n\nBill to: Laura Kim, Sunvale Dental Clinic\n\nItem | Quantity | Unit Price | Amount\nBusiness cards (two-sided) | 500 | $0.10 | $50.00\nAppointment reminder cards | 1,000 | $0.08 | $80.00\nClinic brochures (color) | 200 | $0.75 | $150.00\n\nSubtotal: $280.00\nDiscount (returning customer, 10%): -$28.00\nTotal due: $252.00\n\nPayment is due within 30 days of the invoice date. A late fee of 2% will be added to any balance that remains unpaid after October 22. Please note that the brochures will be delivered separately on September 29 because of a paper shortage. Thank you for your business!","ja":"請求書\nペンブローク印刷\nアシュフォード、ミル通り48番地\n請求書番号 20417　日付: 9月22日\n\n請求先: ローラ・キム様(サンベール歯科クリニック)\n\n品目 | 数量 | 単価 | 金額\n名刺(両面) | 500 | 0.10ドル | 50.00ドル\n予約確認カード | 1,000 | 0.08ドル | 80.00ドル\nクリニック案内パンフレット(カラー) | 200 | 0.75ドル | 150.00ドル\n\n小計: 280.00ドル\n割引(リピーターのお客様、10%): -28.00ドル\nご請求額: 252.00ドル\n\nお支払いは請求日から30日以内にお願いします。10月22日を過ぎても未払いの残高には、2%の延滞料が加算されます。用紙不足のため、パンフレットは9月29日に別便でお届けしますのでご了承ください。ご利用ありがとうございます。","qs":[{"q":"What is indicated about Sunvale Dental Clinic?","o":["It has paid a late fee.","It has ordered from Pembroke Printing before.","It requested express delivery.","It ordered 500 brochures."],"a":1,"why":"割引の欄に returning customer(リピーターの客)とあるので、以前にも注文したことがあるとわかります。延滞料や速達の話はなく、パンフレットの数量は200部です(500は名刺の数量)。"},{"q":"Which item will be delivered later than the others?","o":["The business cards","The clinic brochures","The appointment reminder cards","All items will arrive together."],"a":1,"why":"最後の段落に「用紙不足のため、パンフレットは9月29日に別便で届ける」とあります。名刺と予約確認カードについては別便の記載がないので、遅れるのはパンフレットです。"},{"q":"What will happen if the balance is not paid by October 22?","o":["The discount will be increased.","The order will be canceled.","An extra charge will be applied.","The brochures will not be delivered."],"a":2,"why":"「10月22日を過ぎても未払いの残高には2%の延滞料(late fee)が加算される」とあります。late fee を「追加料金」と言いかえた選択肢が正解です。割引の増加や注文のキャンセルについては書かれていません。"}]},
{"kind":"Web page","title":"Harborline Boat Tours — FAQ","text":"www.harborlinetours.com/faq\n\nHarborline Boat Tours — Frequently Asked Questions\n\nHow long is each tour?\nOur standard harbor tour lasts 90 minutes. The sunset tour lasts two hours and includes a light dinner.\n\nCan I bring my pet?\nUnfortunately, only service animals are allowed on board.\n\nWhat happens if the weather is bad?\nTours may be canceled if winds are too strong. In that case, you can choose either a full refund or a ticket for another date.\n\nDo I need to print my ticket?\nNo. Simply show the confirmation e-mail on your phone when you board. Please arrive at Pier 7 at least 20 minutes before departure.","ja":"www.harborlinetours.com/faq\n\nハーバーライン・ボートツアー — よくある質問\n\nツアーの所要時間は？\n通常のハーバーツアーは90分です。サンセットツアーは2時間で、軽い夕食が付きます。\n\nペットを連れて行けますか？\n申し訳ありませんが、乗船できるのは補助犬などの介助動物のみです。\n\n天候が悪い場合はどうなりますか？\n風が強すぎる場合、ツアーが中止になることがあります。その場合は、全額返金か別の日のチケットのどちらかをお選びいただけます。\n\nチケットを印刷する必要はありますか？\nいいえ。乗船時にスマートフォンで確認メールを見せるだけで大丈夫です。出発の少なくとも20分前までに7番桟橋にお越しください。","qs":[{"q":"What is true about the sunset tour?","o":["It lasts 90 minutes.","It departs from Pier 9.","It allows passengers to bring pets.","It includes a meal."],"a":3,"why":"「サンセットツアーは2時間で、軽い夕食(a light dinner)付き」とあるので、dinner を meal(食事)と言いかえた選択肢が正解です。90分は通常のツアー、乗り場は7番桟橋で、ペットは介助動物以外は乗れません。"},{"q":"What are customers asked to do?","o":["Arrive early for boarding","Print their tickets","Call before arriving at the pier","Bring their own food"],"a":0,"why":"「出発の少なくとも20分前までに桟橋に来てください」とあるので、「早めに来る」が正解です。チケットの印刷は不要と書かれています。電話や食べ物の持ち込みについては書かれていません。"},{"q":"What is suggested about tours that are canceled?","o":["They are rescheduled automatically.","They rarely happen in the summer.","Customers can get their money back.","Customers are notified by phone."],"a":2,"why":"中止の場合は「全額返金か別の日のチケットを選べる」とあるので、お金を返してもらうことができます。自分で選ぶので「自動的に日程変更」ではありません。夏の頻度や電話での連絡については書かれていません。"}]},
{"kind":"Memo","title":"Office Relocation","text":"MEMO\nTo: All Employees\nFrom: Gary Holloway, Facilities Manager\nDate: February 10\nRe: Office Relocation\n\nTo ensure a smooth move to the Lindale Tower on March 15, please note the following points.\n\nEach employee will receive packing boxes by February 28. Please label every box with your name and new desk number, which will be sent to you by e-mail next week. Personal items should be packed separately and taken home before the move.\n\nThe IT team will disconnect and transport all computers, so please do not pack them yourself. Our current office will be closed on March 14 and 15, and employees will work from home on those days.\n\nThank you for your cooperation.","ja":"社内連絡\n宛先: 全従業員\n差出人: ゲイリー・ハロウェイ(施設管理マネージャー)\n日付: 2月10日\n件名: オフィス移転\n\n3月15日のリンデール・タワーへの移転をスムーズに行うため、以下の点にご注意ください。\n\n各従業員には2月28日までに梱包用の箱が配られます。すべての箱に、自分の名前と新しい座席番号を書いてください。座席番号は来週メールでお知らせします。私物は別に梱包し、移転前に持ち帰ってください。\n\nパソコンはすべてIT部門が取り外して運びますので、自分で梱包しないでください。現在のオフィスは3月14日と15日は閉鎖され、その2日間、従業員は在宅勤務となります。\n\nご協力をお願いします。","qs":[{"q":"What is the purpose of the memo?","o":["To announce the opening of a new branch","To give instructions about an upcoming move","To introduce a new facilities manager","To ask employees to choose their desks"],"a":1,"why":"冒頭で「移転をスムーズに行うため、以下の点に注意してください」と書き、箱の準備やパソコンの扱いなど移転の指示を伝えています。新しい支店や新任マネージャーの紹介ではありません。座席番号は会社から送られるので、従業員が選ぶわけではありません。"},{"q":"What will employees receive next week?","o":["New computers","Keys to the Lindale Tower","A schedule for IT training","Information about their new desk locations"],"a":3,"why":"「新しい座席番号は来週メールで送られる」とあるので、座席の場所についての情報が正解です。新しいパソコン、鍵、研修の予定については書かれていません。"},{"q":"What are employees asked NOT to do?","o":["Pack their computers","Label their boxes","Take personal items home","Work from home on March 14"],"a":0,"why":"「パソコンはIT部門が運ぶので、自分で梱包しないで(do not pack them yourself)」とあります。箱へのラベル付け、私物の持ち帰り、3月14日の在宅勤務は、どれもするように言われていることです。"},{"q":"The word \"smooth\" in paragraph 1, line 1, is closest in meaning to","o":["flat","soft","trouble-free","polished"],"a":2,"why":"a smooth move は「問題なく順調な移転」という意味なので、trouble-free(問題のない)が最も近いです。smoothには「平らな」「(表面が)なめらかな」という意味もあり、flat、soft(柔らかい)、polished(磨かれた)はその意味に近い語ですが、ここでは物の表面ではなく、物事の進み方を表しています。"}]}
];

if('speechSynthesis'in window){loadVoices();speechSynthesis.onvoiceschanged=loadVoices}

function pickVoice(g,lang){
 if(!TTS.ready)loadVoices();
 if(lang==='mix'){const ls=Object.keys(ACC).filter(l=>voicesFor(l).length);lang=ls.length?ls[Math.floor(Math.random()*ls.length)]:'en-US'}
 let list=voicesFor(lang);if(!list.length)list=voicesFor('en-US');if(!list.length)list=TTS.voices;
 if(!list.length)return {voice:null,pitch:g==='m'?.85:1.05,lang};
 const pref=S.set.voice&&list.find(v=>v.name===S.set.voice);
 const isF=v=>FEM.test(v.name),isM=v=>!isF(v)&&MAL.test(v.name);
 // 品質の高い音声(Google, Natural, Enhanced, Premium)を優先
 const good=v=>/google|natural|enhanced|premium|neural/i.test(v.name)?1:0;
 const sorted=[...list].sort((a,b)=>good(b)-good(a));
 let v=g==='m'?sorted.find(isM):sorted.find(isF);
 if(!v&&pref)v=pref;
 if(!v)v=sorted[0];
 const pitch=(g==='m'&&!isM(v))?.8:(g==='f'&&isM(v))?1.2:1;
 return {voice:v,pitch,lang:v.lang||lang};
}
let speakId=0;
function speak(text,opt={}){
 return new Promise(res=>{
  if(!('speechSynthesis'in window)){toast('このブラウザは読み上げに未対応です');return res(false)}
  const id=++speakId;const u=new SpeechSynthesisUtterance(text.replace(/____/g,'blank'));
  const p=pickVoice(opt.g||'f',opt.lang||S.set.accent);
  if(p.voice)u.voice=p.voice;u.lang=p.lang;u.pitch=p.pitch;u.rate=(opt.slow?0.72:1)*S.set.rate;
  let done=false;const fin=()=>{if(done)return;done=true;clearTimeout(t);res(id===speakId)};
  u.onend=fin;u.onerror=fin;
  const t=setTimeout(fin,1500+text.length*120/u.rate);
  speechSynthesis.speak(u);
 });
}
function stopSpeak(){speakId++;if('speechSynthesis'in window)speechSynthesis.cancel()}
async function speakSeq(arr){// arr: [{text,g}]  — 途中で別の再生が始まったら止まる
 stopSpeak();const my=speakId;
 for(const a of arr){if(my!==speakId)return false;await speak(a.text,{g:a.g,lang:a.lang});if(my!==speakId)return false;await wait(a.gap||350)}
 return true;
}
const wait=ms=>new Promise(r=>setTimeout(r,ms));

let recNow=null;
function listen(){
 return new Promise((res,rej)=>{
  if(!SR)return rej('unsupported');
  stopSpeak();
  const r=new SR();recNow=r;r.lang=S.set.accent==='en-GB'?'en-GB':'en-US';r.interimResults=false;r.maxAlternatives=5;r.continuous=false;
  let got=null;
  r.onresult=e=>{const alts=[];for(let i=0;i<e.results[0].length;i++)alts.push(e.results[0][i].transcript);got=alts};
  r.onerror=e=>{recNow=null;rej(e.error||'error')};
  r.onend=()=>{recNow=null;got?res(got):rej('no-speech')};
  try{r.start()}catch(e){rej('busy')}
 });
}
